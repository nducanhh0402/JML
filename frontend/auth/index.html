<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập & Đăng ký | JML Store</title>
  <link rel="stylesheet" href="../shared/css/shared.css">
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --koi-red: #d42b24;
      --koi-red-hover: #b21f19;
      --koi-red-soft: rgba(212, 43, 36, .14);
      --lotus-ink: #143224;
      --lotus-muted: #476858;
    }
    html, body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Be Vietnam Pro', -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: var(--lotus-ink);
      background: linear-gradient(180deg, #cfdcd2 0%, #6d7850 36%, #413e1f 72%, #242311 100%);
      overflow-x: hidden;
    }

    /* Sân khấu WebGL 3D toàn màn hình */
    #koi-3d-wrap {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }
    #koi-3d-wrap canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      pointer-events: none;
    }
    .top-nav a {
      pointer-events: auto;
      text-decoration: none;
    }
    .nav-brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.03em;
      color: #133525;
      text-shadow: 0 1px 10px rgba(255, 255, 255, .65);
    }
    .nav-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 32%, #ff6b60, #d42b24 68%, #181a1f 100%);
      box-shadow: 0 0 10px rgba(212, 43, 36, .45);
    }
    .nav-back {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #153928;
      background: rgba(255, 255, 255, .68);
      border: 1px solid rgba(255, 255, 255, .86);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: background .15s, transform .15s;
    }
    .nav-back:hover { background: rgba(255, 255, 255, .92); transform: translateY(-1px); }

    .page-layer {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 32px;
      pointer-events: none;
    }
    @media (min-width: 960px) {
      .page-layer {
        justify-content: flex-end;
        padding: 76px 6.5vw 32px 32px;
      }
    }

    .hero-caption { display: none; }
    @media (min-width: 960px) {
      .hero-caption {
        display: block;
        position: fixed;
        left: 40px;
        bottom: 32px;
        z-index: 2;
        max-width: 420px;
        pointer-events: none;
        user-select: none;
      }
      .hero-caption h1 {
        margin: 0 0 6px;
        font-size: 32px;
        line-height: 1.12;
        font-weight: 800;
        letter-spacing: -.03em;
        color: #ffffff;
        text-shadow: 0 4px 20px rgba(14, 52, 34, .52);
      }
      .hero-caption p {
        margin: 0;
        font-size: 13px;
        color: rgba(242, 255, 247, .92);
        text-shadow: 0 2px 10px rgba(12, 46, 30, .55);
      }
    }

    .auth-shell {
      width: 100%;
      max-width: 412px;
      pointer-events: auto;
    }

    .card {
      background: rgba(252, 255, 253, .82);
      backdrop-filter: blur(18px) saturate(135%);
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 22px;
      padding: 26px 24px 22px;
      box-shadow:
        0 26px 56px -18px rgba(18, 56, 38, .32),
        inset 0 1px 0 rgba(255, 255, 255, .95);
    }

    .alert {
      display: none;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.45;
    }
    .alert.show { display: block; }
    .alert.error { background: rgba(254, 242, 242, .95); color: #b91c1c; border: 1px solid #fecaca; }
    .alert.warning { background: rgba(255, 251, 235, .95); color: #92400e; border: 1px solid #fde68a; }
    .alert.success { background: rgba(236, 253, 245, .95); color: #047857; border: 1px solid #a7f3d0; }

    .session-bar {
      display: none;
      background: rgba(236, 250, 242, .92);
      border: 1px solid rgba(47, 133, 90, .25);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .session-bar.show { display: block; }
    .session-bar-top { margin-bottom: 8px; color: var(--lotus-ink); }
    .session-actions { display: flex; gap: 8px; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(22, 66, 46, .07);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 18px;
    }
    .tab-btn {
      border: 0;
      background: transparent;
      padding: 9px 12px;
      border-radius: 9px;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      color: var(--lotus-muted);
      cursor: pointer;
      transition: background .15s, color .15s, box-shadow .15s;
    }
    .tab-btn.active {
      background: #fff;
      color: var(--koi-red);
      box-shadow: 0 2px 8px rgba(22, 66, 46, .1);
    }

    .field { margin-bottom: 13px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: #1f4433; margin-bottom: 5px; }
    .field label .req { color: var(--koi-red); }
    .input-wrap { position: relative; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(28, 76, 54, .18);
      border-radius: 11px;
      font: inherit;
      font-size: 14px;
      color: var(--lotus-ink);
      background: rgba(255, 255, 255, .88);
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      outline: none;
      background: #fff;
      border-color: var(--koi-red);
      box-shadow: 0 0 0 3px var(--koi-red-soft);
    }
    input.invalid { border-color: var(--danger); background: var(--danger-light); }
    input.has-toggle { padding-right: 54px; }
    .toggle-pw {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: none;
      color: var(--koi-red);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .field-err { color: var(--danger); font-size: 12px; margin-top: 4px; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .role-opt {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 11px;
      border: 1px solid rgba(28, 76, 54, .16);
      border-radius: 10px;
      background: rgba(255, 255, 255, .78);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .role-opt input { margin: 0; accent-color: var(--koi-red); }

    .btn {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, #e53e30 0%, #c8231c 65%, #9e1b18 100%);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 20px -8px rgba(185, 28, 28, .55);
      transition: transform .12s, box-shadow .15s, filter .15s;
    }
    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: .65; cursor: not-allowed; transform: none; }
    .btn-sm { width: auto; padding: 7px 12px; font-size: 12px; border-radius: 8px; box-shadow: none; }
    .btn-outline {
      background: rgba(255, 255, 255, .92);
      color: var(--koi-red);
      border: 1px solid rgba(212, 43, 36, .35);
    }
    .btn-outline:hover { background: var(--danger-light); transform: none; }

    .demo-box {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px solid rgba(28, 76, 54, .1);
    }
    .demo-label { font-size: 12px; color: var(--lotus-muted); margin: 0 0 8px; text-align: center; }
    .demo-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .demo-btn {
      padding: 7px 8px;
      border: 1px solid rgba(28, 76, 54, .16);
      border-radius: 9px;
      background: rgba(255, 255, 255, .75);
      color: #1f4433;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
    }
    .demo-btn:hover { border-color: var(--koi-red); color: var(--koi-red); background: #fff; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="koi-3d-wrap" aria-hidden="true"></div>

  <header class="top-nav">
    <a class="nav-brand" href="../buyer/index.html"><span class="nav-dot"></span> JML Store</a>
    <a class="nav-back" href="../buyer/index.html">← Trang mua sắm</a>
  </header>

  <div class="hero-caption">
    <h1>Chào mừng đến<br>JML Store</h1>
    <p>Hồ sen 3D • Di chuột hoặc chạm vào mặt hồ để tạo gợn sóng</p>
  </div>

  <div class="page-layer">
    <div class="auth-shell">
      <div class="card">
        <div id="auth-guard-alert" class="alert" role="alert"></div>

        <div id="active-session-bar" class="session-bar">
          <div class="session-bar-top">
            <span>Đang đăng nhập: <strong id="session-user-name"></strong> (<span id="session-user-role"></span>)</span>
          </div>
          <div class="session-actions">
            <button id="modal-role-redirect-btn" type="button" class="btn btn-sm" style="flex:1">Tiếp tục →</button>
            <button id="session-logout-btn" type="button" class="btn btn-sm btn-outline">Đăng xuất</button>
          </div>
        </div>

        <div class="tabs" role="tablist">
          <button type="button" id="tab-login" class="tab-btn active" role="tab">Đăng nhập</button>
          <button type="button" id="tab-register" class="tab-btn" role="tab">Đăng ký</button>
        </div>

        <div id="form-alert" class="alert" role="alert"></div>

        <!-- FORM ĐĂNG NHẬP -->
        <form id="form-login" novalidate>
          <div class="field">
            <label for="login-username">Tên đăng nhập, Email hoặc SĐT <span class="req">*</span></label>
            <input id="login-username" type="text" placeholder="VD: buyer, email@gmail.com hoặc 0912345678" autocomplete="username">
            <div id="login-username-err" class="field-err"></div>
          </div>
          <div class="field">
            <label for="login-password">Mật khẩu <span class="req">*</span></label>
            <div class="input-wrap">
              <input id="login-password" type="password" class="has-toggle" placeholder="Nhập mật khẩu" autocomplete="current-password">
              <button type="button" class="toggle-pw" data-target="login-password">Hiện</button>
            </div>
            <div id="login-password-err" class="field-err"></div>
          </div>
          <button type="submit" id="login-submit-btn" class="btn">Đăng nhập</button>

          <div class="demo-box">
            <p class="demo-label">Điền nhanh tài khoản mẫu (mật khẩu: <code>123456</code>)</p>
            <div class="demo-btns">
              <button type="button" class="demo-btn" data-demo="buyer">Khách hàng</button>
              <button type="button" class="demo-btn" data-demo="trungshop">Người bán</button>
              <button type="button" class="demo-btn" data-demo="admin">Admin</button>
            </div>
          </div>
        </form>

        <!-- FORM ĐĂNG KÝ -->
        <form id="form-register" class="hidden" novalidate>
          <div class="field">
            <label for="reg-fullname">Họ và tên <span class="req">*</span></label>
            <input id="reg-fullname" type="text" placeholder="Nguyễn Văn A" autocomplete="name">
            <div id="reg-fullname-err" class="field-err"></div>
          </div>
          <div class="row-2">
            <div class="field">
              <label for="reg-username">Tên đăng nhập <span class="req">*</span></label>
              <input id="reg-username" type="text" placeholder="nguyenvana" autocomplete="username">
              <div id="reg-username-err" class="field-err"></div>
            </div>
            <div class="field">
              <label for="reg-phone">Số điện thoại <span class="req">*</span></label>
              <input id="reg-phone" type="tel" placeholder="0912345678" autocomplete="tel">
              <div id="reg-phone-err" class="field-err"></div>
            </div>
          </div>
          <div class="field">
            <label for="reg-email">Email (không bắt buộc)</label>
            <input id="reg-email" type="email" placeholder="email@example.com" autocomplete="email">
            <div id="reg-email-err" class="field-err"></div>
          </div>
          <div class="field">
            <label>Vai trò</label>
            <div class="role-grid">
              <label class="role-opt"><input type="radio" name="reg-role" value="customer" checked> Người mua</label>
              <label class="role-opt"><input type="radio" name="reg-role" value="seller"> Người bán</label>
            </div>
          </div>
          <div class="field">
            <label for="reg-password">Mật khẩu <span class="req">*</span></label>
            <div class="input-wrap">
              <input id="reg-password" type="password" class="has-toggle" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password">
              <button type="button" class="toggle-pw" data-target="reg-password">Hiện</button>
            </div>
            <div id="reg-password-err" class="field-err"></div>
          </div>
          <div class="field">
            <label for="reg-confirm">Nhập lại mật khẩu <span class="req">*</span></label>
            <div class="input-wrap">
              <input id="reg-confirm" type="password" class="has-toggle" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
              <button type="button" class="toggle-pw" data-target="reg-confirm">Hiện</button>
            </div>
            <div id="reg-confirm-err" class="field-err"></div>
          </div>
          <button type="submit" id="reg-submit-btn" class="btn">Tạo tài khoản</button>
        </form>
      </div>
    </div>
  </div>

  <div class="shared-toast-container" id="toastContainer"></div>

  <!-- ========================================================================
       WEBGL 3D (THREE.JS): CÁ KOI 3D TRẮNG - ĐỎ - ĐEN & HỒ HOA SEN XANH LÁ NHẠT
       ======================================================================== -->
  <script>
  (function () {
    'use strict';
    if (typeof THREE === 'undefined') return;

    const wrap = document.getElementById('koi-3d-wrap');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ------------------------------------------------------------------
    // 1. SCENE, CAMERA, RENDERER (PBR + SOFT SHADOWS + TONE MAPPING)
    // ------------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x3e3d20, 0.014);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0.4, 2.35, 11.4);
    camera.lookAt(-1.1, -0.35, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    let lastAppliedDpr = 0;
    function syncRendererResolution() {
      const vvScale = (window.visualViewport && window.visualViewport.scale) ? window.visualViewport.scale : 1;
      const targetDpr = Math.min((window.devicePixelRatio || 1) * vvScale, 4);
      const w = Math.max(1, window.innerWidth);
      const h = Math.max(1, window.innerHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(targetDpr);
      renderer.setSize(w, h);
      lastAppliedDpr = targetDpr;
    }
    syncRendererResolution();
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.12;
    wrap.appendChild(renderer.domElement);

    const maxAniso = renderer.capabilities.getMaxAnisotropy();

    // Bản đồ môi trường phản xạ (IBL Environment Map) tạo độ bóng ướt chân thực cho vảy cá, mắt, giọt sương & đá
    (function buildStudioEnvironment() {
      const ew = 512, eh = 256;
      const ecv = document.createElement('canvas');
      ecv.width = ew; ecv.height = eh;
      const eg = ecv.getContext('2d');
      const skyG = eg.createLinearGradient(0, 0, 0, eh);
      skyG.addColorStop(0.0,  '#eef9ff');
      skyG.addColorStop(0.32, '#bde8ff');
      skyG.addColorStop(0.50, '#78c9f0');
      skyG.addColorStop(0.56, '#146aa8');
      skyG.addColorStop(0.80, '#0a3a5e');
      skyG.addColorStop(1.0,  '#061d2e');
      eg.fillStyle = skyG;
      eg.fillRect(0, 0, ew, eh);

      // Đĩa nắng mai rực rỡ & cụm mây sáng để vảy cá và mắt cá bắt sáng lung linh
      const sunG = eg.createRadialGradient(ew * 0.28, eh * 0.22, 4, ew * 0.28, eh * 0.22, 72);
      sunG.addColorStop(0.0, 'rgba(255, 254, 240, 1.0)');
      sunG.addColorStop(0.35, 'rgba(255, 248, 220, 0.65)');
      sunG.addColorStop(1.0, 'rgba(255, 248, 220, 0)');
      eg.fillStyle = sunG;
      eg.fillRect(0, 0, ew, eh);

      for (let i = 0; i < 8; i++) {
        const cx = (i / 8) * ew + 28, cy = eh * (0.18 + (i % 3) * 0.08);
        const cg = eg.createRadialGradient(cx, cy, 4, cx, cy, 48);
        cg.addColorStop(0, 'rgba(255, 255, 255, 0.55)');
        cg.addColorStop(1, 'rgba(255, 255, 255, 0)');
        eg.fillStyle = cg;
        eg.beginPath(); eg.ellipse(cx, cy, 52, 18, 0, 0, Math.PI * 2); eg.fill();
      }

      const envTex = new THREE.CanvasTexture(ecv);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      envTex.encoding = THREE.sRGBEncoding;
      const pmrem = new THREE.PMREMGenerator(renderer);
      pmrem.compileEquirectangularShader();
      scene.environment = pmrem.fromEquirectangular(envTex).texture;
      envTex.dispose();
      pmrem.dispose();
    })();

    // ------------------------------------------------------------------
    // 2. ÁNH SÁNG NẮNG TỰ NHIÊN HỒ CÁ KOI (ÁNH NẮNG ẤM, BÓNG ĐỔ MỀM LÊN ĐÁY BÙN RÊU)
    // ------------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xf6f8e8, 0x4d4924, 1.08);
    scene.add(hemiLight);

    // Nắng sớm vàng dịu chiếu xiên tạo bóng cá Koi & lá sen sắc nét dưới đáy bùn rêu
    const sunLight = new THREE.DirectionalLight(0xfff6dc, 1.65);
    sunLight.position.set(-5.0, 12.0, 6.2);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 2;
    sunLight.shadow.camera.far = 32;
    const dShadow = 16.5;
    sunLight.shadow.camera.left = -dShadow;
    sunLight.shadow.camera.right = dShadow;
    sunLight.shadow.camera.top = dShadow;
    sunLight.shadow.camera.bottom = -dShadow;
    sunLight.shadow.bias = -0.0005;
    sunLight.shadow.radius = 4.5;
    scene.add(sunLight);

    // Đèn viền sáng dịu phía sau làm bật độ trong của cánh hoa sen & vây cá
    const rimLight = new THREE.DirectionalLight(0xeef5d8, 0.65);
    rimLight.position.set(6, 4.5, -8);
    scene.add(rimLight);

    // Ánh hắt ấm tự nhiên từ đáy bùn rêu sâu lên bụng cá
    const bounceLight = new THREE.PointLight(0x6b6532, 0.34, 22);
    bounceLight.position.set(-2, -3.0, 2);
    scene.add(bounceLight);

    // Điểm sáng hồng ấm nhẹ gần cụm hoa sen tiền cảnh giúp màu hoa tươi rực
    const lotusGlow = new THREE.PointLight(0xffb8d4, 0.58, 14);
    lotusGlow.position.set(-5.2, 2.4, 1.0);
    scene.add(lotusGlow);

    // ------------------------------------------------------------------
    // 3. TEXTURE SIÊU CHI TIẾT 2K: VẢY GINRIN, SOBEL NORMAL MAP THẬT, 4 DÒNG KOI THUẦN CHỦNG
    // ------------------------------------------------------------------
    const koiUnderwaterUniforms = {
      uKoiTime: { value: 0 },
      uKoiWaterY: { value: 1.65 },
    };

    // Chuyển heightfield canvas sang Tangent-Space Normal Map thật bằng bộ lọc Sobel
    function heightCanvasToNormalTexture(heightCanvas, strength = 2.8, wrapSRepeat = true) {
      const w = heightCanvas.width, h = heightCanvas.height;
      const hData = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
      const nv = document.createElement('canvas');
      nv.width = w; nv.height = h;
      const nCtx = nv.getContext('2d');
      const nImg = nCtx.createImageData(w, h);
      const nData = nImg.data;
      for (let y = 0; y < h; y++) {
        const ym = Math.max(0, y - 1);
        const yp = Math.min(h - 1, y + 1);
        for (let x = 0; x < w; x++) {
          const xm = wrapSRepeat ? (x - 1 + w) % w : Math.max(0, x - 1);
          const xp = wrapSRepeat ? (x + 1) % w : Math.min(w - 1, x + 1);
          const tl = hData[(ym * w + xm) * 4] / 255;
          const t  = hData[(ym * w + x)  * 4] / 255;
          const tr = hData[(ym * w + xp) * 4] / 255;
          const l  = hData[(y  * w + xm) * 4] / 255;
          const r  = hData[(y  * w + xp) * 4] / 255;
          const bl = hData[(yp * w + xm) * 4] / 255;
          const b0 = hData[(yp * w + x)  * 4] / 255;
          const br = hData[(yp * w + xp) * 4] / 255;
          const dx = (tr + 2 * r + br - tl - 2 * l - bl) * strength;
          const dy = (bl + 2 * b0 + br - tl - 2 * t - tr) * strength;
          const invLen = 1.0 / Math.hypot(dx, dy, 1.0);
          const idx = (y * w + x) * 4;
          nData[idx]     = Math.round((-dx * invLen * 0.5 + 0.5) * 255);
          nData[idx + 1] = Math.round((-dy * invLen * 0.5 + 0.5) * 255);
          nData[idx + 2] = Math.round(( 1.0 * invLen * 0.5 + 0.5) * 255);
          nData[idx + 3] = 255;
        }
      }
      nCtx.putImageData(nImg, 0, 0);
      const tex = new THREE.CanvasTexture(nv);
      if (wrapSRepeat) tex.wrapS = THREE.RepeatWrapping;
      tex.anisotropy = Math.min(8, maxAniso);
      return tex;
    }

    // Cache Normal Map & Roughness Map giải phẫu vảy cá 1024px (1 bản cho Sanke/Showa/Tancho, 1 bản cho Vàng Kim)
    const koiDetailMapCache = {};
    function getKoiAnatomicalMaps(isGold) {
      const key = isGold ? 'gold' : 'std';
      if (koiDetailMapCache[key]) return koiDetailMapCache[key];

      const s = 1024;
      const hv = document.createElement('canvas'); hv.width = s; hv.height = s;
      const b = hv.getContext('2d');
      const rv = document.createElement('canvas'); rv.width = s; rv.height = s;
      const rCtx = rv.getContext('2d');

      b.fillStyle = '#707070';
      b.fillRect(0, 0, s, s);
      rCtx.fillStyle = isGold ? '#141414' : '#202020';
      rCtx.fillRect(0, 0, s, s);

      // Lưới vảy nổi khối 3D giải phẫu (dọc hông & lưng, chừa phần đầu trơn mượt)
      const cols = 34, rows = 44;
      const cellW = s / cols;
      const cellH = (s * 0.76) / rows;
      const startY = s * 0.215;

      for (let row = 0; row < rows; row++) {
        const y = startY + row * cellH;
        const stagger = (row % 2) * (cellW * 0.5);
        for (let col = -1; col <= cols; col++) {
          const x = col * cellW + stagger;
          // Mái vòm 3D của từng chiếc vảy
          const bg = b.createRadialGradient(x, y + cellH * 0.08, 1, x, y + cellH * 0.18, cellW * 0.54);
          bg.addColorStop(0.0, isGold ? '#f6f6f6' : '#ebebeb');
          bg.addColorStop(0.66, '#9c9c9c');
          bg.addColorStop(0.92, '#3a3a3a');
          bg.addColorStop(1.0, '#181818');
          b.fillStyle = bg;
          b.beginPath();
          b.arc(x, y, cellW * 0.51, 0.08 * Math.PI, 0.92 * Math.PI);
          b.fill();

          // Rãnh khía tinh trên mặt vảy (radii)
          b.strokeStyle = 'rgba(255,255,255,0.12)';
          b.lineWidth = 1;
          b.beginPath();
          b.moveTo(x, y); b.lineTo(x, y + cellW * 0.42);
          b.stroke();

          // Khe vảy hơi nhám hơn đỉnh vảy ướt bóng
          rCtx.strokeStyle = isGold ? '#444444' : '#646464';
          rCtx.lineWidth = 2.0;
          rCtx.beginPath();
          rCtx.arc(x, y + 0.8, cellW * 0.51, 0.14 * Math.PI, 0.86 * Math.PI);
          rCtx.stroke();
        }
      }

      // Đường bên cảm nhận sóng nước dọc 2 bên hông cá (lateral line)
      for (const sideU of [0.26, 0.74]) {
        b.strokeStyle = '#383838';
        b.lineWidth = 2.4;
        b.beginPath();
        b.moveTo(sideU * s, s * 0.24);
        b.bezierCurveTo(sideU * s + (sideU < 0.5 ? -8 : 8), s * 0.48, sideU * s, s * 0.72, sideU * s, s * 0.92);
        b.stroke();
      }

      // Nếp nắp mang giải phẫu sâu (operculum) & hốc mũi
      for (const sideU of [0.24, 0.76]) {
        const gx = sideU * s, gy = 0.215 * s;
        b.strokeStyle = '#121212';
        b.lineWidth = 6.5;
        b.beginPath(); b.arc(gx, gy - 25, 56, 0.22 * Math.PI, 0.78 * Math.PI); b.stroke();
        b.strokeStyle = '#c8c8c8';
        b.lineWidth = 3.2;
        b.beginPath(); b.arc(gx, gy - 28, 53, 0.24 * Math.PI, 0.76 * Math.PI); b.stroke();
      }
      b.fillStyle = '#181818';
      b.beginPath(); b.ellipse(0.455 * s, 0.055 * s, 4.5, 7, -0.2, 0, Math.PI * 2); b.fill();
      b.beginPath(); b.ellipse(0.545 * s, 0.055 * s, 4.5, 7,  0.2, 0, Math.PI * 2); b.fill();

      const normalMap = heightCanvasToNormalTexture(hv, isGold ? 3.2 : 2.7, true);
      const roughnessMap = new THREE.CanvasTexture(rv);
      roughnessMap.wrapS = THREE.RepeatWrapping;

      koiDetailMapCache[key] = { normalMap, roughnessMap };
      return koiDetailMapCache[key];
    }

    // Texture mống mắt 3D chi tiết (vân sợi ánh kim tỏa tia + viền tròng sẫm + đồng tử sâu)
    function createKoiIrisTexture(isGold) {
      const s = 256;
      const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
      const g = cv.getContext('2d');
      const cx = s / 2, cy = s / 2;
      const gr = g.createRadialGradient(cx, cy, 18, cx, cy, s * 0.5);
      if (isGold) {
        gr.addColorStop(0.0, '#fff7cf');
        gr.addColorStop(0.42, '#f5c23b');
        gr.addColorStop(0.80, '#a6650c');
        gr.addColorStop(1.0, '#2c1804');
      } else {
        gr.addColorStop(0.0, '#fffdf2');
        gr.addColorStop(0.45, '#e8dfc2');
        gr.addColorStop(0.82, '#8b836c');
        gr.addColorStop(1.0, '#1e2024');
      }
      g.fillStyle = gr;
      g.fillRect(0, 0, s, s);
      // 48 vân sợi mống mắt tỏa ra từ đồng tử
      for (let i = 0; i < 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        g.strokeStyle = i % 2 === 0 ? 'rgba(255, 252, 232, 0.34)' : 'rgba(20, 16, 8, 0.24)';
        g.lineWidth = 1.6;
        g.beginPath();
        g.moveTo(cx + Math.cos(a) * 20, cy + Math.sin(a) * 20);
        g.lineTo(cx + Math.cos(a) * (s * 0.48), cy + Math.sin(a) * (s * 0.48));
        g.stroke();
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding;
      return tex;
    }
    const koiIrisTexStd = createKoiIrisTexture(false);
    const koiIrisTexGold = createKoiIrisTexture(true);

    function createKoiSkinTextures(variant = 0) {
      const size = 2048;
      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = size; colorCanvas.height = size;
      const c = colorCanvas.getContext('2d');

      const isGold = variant === 'gold';
      const isTancho = variant === 'tancho';

      if (isGold) {
        // Cá Koi Vàng Kim Hoàng Gia (Yamabuki Ogon / Kin Matsuba): lưng vàng 24K rực rỡ, hông vàng champagne ánh kim
        const baseGrad = c.createLinearGradient(0, 0, size, 0);
        baseGrad.addColorStop(0.0,  '#f6e4aa');
        baseGrad.addColorStop(0.18, '#f8cc4c');
        baseGrad.addColorStop(0.38, '#f0a616');
        baseGrad.addColorStop(0.50, '#ffd852');
        baseGrad.addColorStop(0.62, '#f0a616');
        baseGrad.addColorStop(0.82, '#f8cc4c');
        baseGrad.addColorStop(1.0,  '#f6e4aa');
        c.fillStyle = baseGrad;
        c.fillRect(0, 0, size, size);

        const headGlow = c.createRadialGradient(size * 0.5, size * 0.11, 18, size * 0.5, size * 0.14, size * 0.28);
        headGlow.addColorStop(0.0, 'rgba(255, 248, 192, 0.85)');
        headGlow.addColorStop(0.55, 'rgba(255, 206, 62, 0.35)');
        headGlow.addColorStop(1.0, 'rgba(224, 152, 12, 0.0)');
        c.fillStyle = headGlow;
        c.fillRect(0, 0, size, size * 0.32);

        const dorsalSheen = c.createLinearGradient(size * 0.32, 0, size * 0.68, 0);
        dorsalSheen.addColorStop(0.0, 'rgba(186, 108, 6, 0.0)');
        dorsalSheen.addColorStop(0.5, 'rgba(186, 108, 6, 0.24)');
        dorsalSheen.addColorStop(1.0, 'rgba(186, 108, 6, 0.0)');
        c.fillStyle = dorsalSheen;
        c.fillRect(0, size * 0.20, size, size * 0.78);
      } else {
        // Nền trắng sứ Shiroji ngọc trai mịn màng, bụng ánh ngọc dịu
        const baseGrad = c.createLinearGradient(0, 0, size, 0);
        baseGrad.addColorStop(0.0,  '#d5e4ed');
        baseGrad.addColorStop(0.18, '#eef5f8');
        baseGrad.addColorStop(0.50, '#ffffff');
        baseGrad.addColorStop(0.82, '#eef5f8');
        baseGrad.addColorStop(1.0,  '#d5e4ed');
        c.fillStyle = baseGrad;
        c.fillRect(0, 0, size, size);
      }

      function drawOrganicSpot(ctx2d, u, v, ru, rv, colorInner, colorOuter, tilt = 0, edgeBlur = false) {
        for (const offset of [-1, 0, 1]) {
          const cx = (u + offset) * size;
          const cy = v * size;
          const rx = ru * size;
          const ry = rv * size;
          if (cx + rx < -80 || cx - rx > size + 80) continue;

          ctx2d.save();
          ctx2d.translate(cx, cy);
          ctx2d.rotate(tilt);
          // Hiệu ứng Sashi: quầng màu mờ nhẹ ẩn dưới rìa trước vảy trắng như cá Koi thật
          if (edgeBlur) {
            const sg = ctx2d.createRadialGradient(0, -ry * 0.12, rx * 0.55, 0, -ry * 0.1, Math.max(rx, ry) * 1.12);
            sg.addColorStop(0, colorOuter);
            sg.addColorStop(0.75, 'rgba(210, 42, 30, 0.22)');
            sg.addColorStop(1, 'rgba(210, 42, 30, 0.0)');
            ctx2d.fillStyle = sg;
            ctx2d.beginPath();
            ctx2d.ellipse(0, -ry * 0.08, rx * 1.06, ry * 1.08, 0, 0, Math.PI * 2);
            ctx2d.fill();
          }

          const g = ctx2d.createRadialGradient(-rx * 0.14, -ry * 0.14, rx * 0.08, 0, 0, Math.max(rx, ry));
          g.addColorStop(0, colorInner);
          g.addColorStop(0.76, colorOuter);
          g.addColorStop(1, colorOuter);
          ctx2d.fillStyle = g;
          ctx2d.beginPath();
          const steps = 40;
          for (let i = 0; i <= steps; i++) {
            const a = (i / steps) * Math.PI * 2;
            const wobble = 1 + 0.085 * Math.sin(a * 3 + u * 12) + 0.045 * Math.cos(a * 5 + v * 9) + 0.025 * Math.sin(a * 8);
            const px = Math.cos(a) * rx * wobble;
            const py = Math.sin(a) * ry * wobble;
            if (i === 0) ctx2d.moveTo(px, py); else ctx2d.lineTo(px, py);
          }
          ctx2d.closePath();
          ctx2d.fill();
          ctx2d.restore();
        }
      }

      if (isTancho) {
        // Cá Koi Tancho Sanke quý hiếm: thân trắng tuyết tinh khôi + 1 chấm đỏ tròn hoàn hảo giữa đỉnh đầu + 2 chấm đen tinh tế
        drawOrganicSpot(c, 0.50, 0.105, 0.092, 0.056, '#ff3a28', '#c6120e', 0, false);
        drawOrganicSpot(c, 0.36, 0.56,  0.055, 0.038, '#20242c', '#07080b', -0.2, false);
        drawOrganicSpot(c, 0.62, 0.78,  0.048, 0.032, '#20242c', '#07080b',  0.2, false);
      } else if (!isGold) {
        // --- CÁC MẢNG ĐỎ SON (HI) CHO TAISHO SANKE (0) & SHOWA SANSHOKU (1) ---
        const redSets = [
          [
            { u: 0.50, v: 0.11, ru: 0.16, rv: 0.085, t: 0.05 },
            { u: 0.36, v: 0.34, ru: 0.20, rv: 0.135, t: -0.25 },
            { u: 0.62, v: 0.37, ru: 0.17, rv: 0.12,  t: 0.22 },
            { u: 0.50, v: 0.62, ru: 0.24, rv: 0.145, t: 0.08 },
            { u: 0.44, v: 0.85, ru: 0.15, rv: 0.075, t: -0.1 },
          ],
          [
            { u: 0.48, v: 0.10, ru: 0.13, rv: 0.075, t: -0.12 },
            { u: 0.54, v: 0.42, ru: 0.26, rv: 0.155, t: 0.15 },
            { u: 0.46, v: 0.76, ru: 0.19, rv: 0.095, t: -0.12 },
          ],
        ];
        for (const r of redSets[variant % redSets.length]) {
          drawOrganicSpot(c, r.u, r.v, r.ru, r.rv, '#f53826', '#b81410', r.t, true);
        }

        // --- CÁC ĐỐM ĐEN MỰC (SUMI) ---
        const blackSets = [
          [
            { u: 0.30, v: 0.23, ru: 0.075, rv: 0.058, t: -0.3 },
            { u: 0.70, v: 0.24, ru: 0.070, rv: 0.052, t: 0.32 },
            { u: 0.54, v: 0.28, ru: 0.085, rv: 0.052, t: 0.15 },
            { u: 0.26, v: 0.48, ru: 0.095, rv: 0.062, t: 0.2 },
            { u: 0.74, v: 0.47, ru: 0.088, rv: 0.056, t: -0.2 },
            { u: 0.46, v: 0.53, ru: 0.082, rv: 0.055, t: -0.15 },
            { u: 0.64, v: 0.68, ru: 0.090, rv: 0.055, t: 0.25 },
            { u: 0.34, v: 0.73, ru: 0.075, rv: 0.050, t: -0.2 },
            { u: 0.52, v: 0.90, ru: 0.065, rv: 0.036, t: 0.1 },
          ],
          // Showa: dải đen mực đậm vắt qua vai và hông đầy ấn tượng
          [
            { u: 0.50, v: 0.22, ru: 0.22, rv: 0.078, t: 0.18 },
            { u: 0.30, v: 0.36, ru: 0.12, rv: 0.082, t: -0.25 },
            { u: 0.70, v: 0.52, ru: 0.14, rv: 0.088, t: 0.22 },
            { u: 0.46, v: 0.63, ru: 0.16, rv: 0.072, t: -0.12 },
            { u: 0.34, v: 0.82, ru: 0.10, rv: 0.055, t: 0.18 },
          ],
        ];
        for (const s of blackSets[variant % blackSets.length]) {
          drawOrganicSpot(c, s.u, s.v, s.ru, s.rv, '#22252c', '#07080b', s.t, false);
        }
      }

      // --- VẢY CÁ KOI 2K XẾP LỚP SIÊU THẬT (FUKURIN + ÁNH KIM CƯƠNG GINRIN LẤP LÁNH) ---
      const cols = 34;
      const rows = 44;
      const cellW = size / cols;
      const cellH = (size * 0.76) / rows;
      const startY = size * 0.215;

      for (let row = 0; row < rows; row++) {
        const y = startY + row * cellH;
        const stagger = (row % 2) * (cellW * 0.5);
        for (let col = -1; col <= cols; col++) {
          const x = col * cellW + stagger;
          const uPos = x / size;
          const nearBack = Math.abs(uPos - 0.5) < 0.26;
          // Một số vảy trên sống lưng có ánh kim cương Ginrin lấp lánh rất sang
          const isGinrin = nearBack && ((row * 7 + col * 13) % 5 === 0);

          // Rãnh bóng hõm ôm dưới mỗi vảy
          c.strokeStyle = isGold ? 'rgba(136, 72, 4, 0.38)' : 'rgba(10, 20, 28, 0.18)';
          c.lineWidth = isGold ? 3.2 : 2.5;
          c.beginPath();
          c.arc(x, y + 1.5, cellW * 0.52, 0.14 * Math.PI, 0.86 * Math.PI);
          c.stroke();

          // Chuyển sắc khối cầu + ánh ngọc trai trên từng chiếc vảy
          const sg = c.createRadialGradient(x, y + cellH * 0.08, 2, x, y + cellH * 0.18, cellW * 0.48);
          if (isGold) {
            sg.addColorStop(0.0, isGinrin ? 'rgba(255, 253, 224, 0.62)' : 'rgba(255, 248, 196, 0.42)');
            sg.addColorStop(0.55, 'rgba(255, 204, 48, 0.16)');
            sg.addColorStop(1.0, 'rgba(156, 86, 6, 0.20)');
          } else {
            sg.addColorStop(0.0, isGinrin ? 'rgba(255, 255, 255, 0.34)' : 'rgba(255, 255, 255, 0.15)');
            sg.addColorStop(0.65, 'rgba(255, 255, 255, 0.03)');
            sg.addColorStop(1.0, 'rgba(0, 0, 0, 0.07)');
          }
          c.fillStyle = sg;
          c.beginPath();
          c.arc(x, y, cellW * 0.49, 0.10 * Math.PI, 0.90 * Math.PI);
          c.fill();

          // Viền bắt sáng Fukurin mảnh trên mép vảy
          c.strokeStyle = isGold ? 'rgba(255, 250, 214, 0.66)' : (isGinrin ? 'rgba(255, 255, 255, 0.56)' : 'rgba(255, 255, 255, 0.32)');
          c.lineWidth = isGold ? 2.1 : 1.6;
          c.beginPath();
          c.arc(x, y - 2, cellW * 0.45, 0.22 * Math.PI, 0.78 * Math.PI);
          c.stroke();
        }
      }

      // Đường bên mảnh & nếp nắp mang (operculum) có sắc hồng phấn dịu bên mép mang
      for (const sideU of [0.24, 0.76]) {
        const gx = sideU * size;
        const gy = 0.215 * size;
        c.strokeStyle = isGold ? 'rgba(156, 88, 8, 0.42)' : 'rgba(18, 28, 36, 0.38)';
        c.lineWidth = 7.5;
        c.beginPath(); c.arc(gx, gy - 50, 112, 0.22 * Math.PI, 0.78 * Math.PI); c.stroke();

        c.strokeStyle = isGold ? 'rgba(255, 242, 180, 0.52)' : 'rgba(255, 224, 224, 0.34)';
        c.lineWidth = 3.5;
        c.beginPath(); c.arc(gx, gy - 54, 108, 0.25 * Math.PI, 0.75 * Math.PI); c.stroke();
      }

      // Môi & 2 hốc lỗ mũi sắc nét trên đầu cá
      c.fillStyle = isGold ? 'rgba(116, 62, 6, 0.65)' : 'rgba(16, 20, 26, 0.58)';
      c.beginPath(); c.ellipse(0.455 * size, 0.055 * size, 8, 13, -0.2, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.ellipse(0.545 * size, 0.055 * size, 8, 13,  0.2, 0, Math.PI * 2); c.fill();
      c.strokeStyle = isGold ? 'rgba(255, 244, 190, 0.5)' : 'rgba(255, 255, 255, 0.45)';
      c.lineWidth = 2.4;
      c.beginPath(); c.ellipse(0.455 * size, 0.055 * size, 10, 15, -0.2, 0, Math.PI * 2); c.stroke();
      c.beginPath(); c.ellipse(0.545 * size, 0.055 * size, 10, 15,  0.2, 0, Math.PI * 2); c.stroke();

      const map = new THREE.CanvasTexture(colorCanvas);
      map.encoding = THREE.sRGBEncoding;
      map.wrapS = THREE.RepeatWrapping;
      map.anisotropy = maxAniso;

      const { normalMap, roughnessMap } = getKoiAnatomicalMaps(isGold);
      return { map, normalMap, roughnessMap };
    }

    // Texture vây lụa 1024px + Normal Map gân vây 3D + viền mép lượn sóng tự nhiên (scalloped organic edge)
    function createFinTexture(style = 'tail', palette = 'sanke') {
      const w = 1024, h = 1024;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      g.clearRect(0, 0, w, h);

      // Heightfield 512px cho gân xương vây 3D (Sobel Normal Map)
      const nh = 512;
      const hCv = document.createElement('canvas'); hCv.width = nh; hCv.height = nh;
      const hg = hCv.getContext('2d');
      hg.fillStyle = '#555555';
      hg.fillRect(0, 0, nh, nh);

      const isGold = palette === 'gold';
      const isTancho = palette === 'tancho';

      if (style === 'tail') {
        const grd = g.createLinearGradient(0, 0, w, 0);
        if (isGold) {
          grd.addColorStop(0.0,  'rgba(244, 178, 24, 0.98)');
          grd.addColorStop(0.32, 'rgba(255, 214, 78, 0.92)');
          grd.addColorStop(0.65, 'rgba(255, 234, 148, 0.80)');
          grd.addColorStop(0.88, 'rgba(255, 248, 214, 0.46)');
          grd.addColorStop(1.0,  'rgba(255, 252, 232, 0.0)');
        } else if (isTancho) {
          grd.addColorStop(0.0,  'rgba(252, 254, 255, 0.95)');
          grd.addColorStop(0.45, 'rgba(244, 250, 255, 0.82)');
          grd.addColorStop(0.82, 'rgba(240, 248, 255, 0.50)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        } else {
          grd.addColorStop(0.0,  'rgba(252, 254, 253, 0.96)');
          grd.addColorStop(0.28, 'rgba(232, 42, 32, 0.90)');
          grd.addColorStop(0.58, 'rgba(190, 20, 18, 0.82)');
          grd.addColorStop(0.79, 'rgba(16, 18, 24, 0.85)');
          grd.addColorStop(0.92, 'rgba(248, 252, 250, 0.50)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        }
        g.fillStyle = grd;
        g.fillRect(0, 0, w, h);
      } else if (style === 'pectoral') {
        const grd = g.createRadialGradient(w * 0.12, h * 0.5, 20, w * 0.25, h * 0.5, w * 0.88);
        if (isGold) {
          grd.addColorStop(0.0,  'rgba(218, 142, 14, 0.98)');
          grd.addColorStop(0.28, 'rgba(255, 206, 62, 0.92)');
          grd.addColorStop(0.62, 'rgba(255, 232, 138, 0.76)');
          grd.addColorStop(0.88, 'rgba(255, 249, 216, 0.34)');
          grd.addColorStop(1.0,  'rgba(255, 252, 232, 0.0)');
        } else if (isTancho) {
          grd.addColorStop(0.0,  'rgba(248, 252, 255, 0.96)');
          grd.addColorStop(0.42, 'rgba(244, 250, 255, 0.80)');
          grd.addColorStop(0.82, 'rgba(240, 248, 255, 0.42)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        } else {
          grd.addColorStop(0.0,  'rgba(14, 16, 22, 0.96)');
          grd.addColorStop(0.22, 'rgba(252, 255, 253, 0.90)');
          grd.addColorStop(0.55, 'rgba(222, 38, 28, 0.78)');
          grd.addColorStop(0.79, 'rgba(16, 18, 24, 0.70)');
          grd.addColorStop(0.93, 'rgba(255, 255, 255, 0.28)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        }
        g.fillStyle = grd;
        g.fillRect(0, 0, w, h);
      } else {
        const grd = g.createLinearGradient(0, h, 0, 0);
        if (isGold) {
          grd.addColorStop(0.0,  'rgba(242, 174, 22, 0.96)');
          grd.addColorStop(0.45, 'rgba(255, 216, 86, 0.88)');
          grd.addColorStop(0.80, 'rgba(255, 240, 176, 0.72)');
          grd.addColorStop(0.94, 'rgba(255, 250, 224, 0.36)');
          grd.addColorStop(1.0,  'rgba(255, 252, 236, 0.0)');
        } else if (isTancho) {
          grd.addColorStop(0.0,  'rgba(250, 253, 255, 0.95)');
          grd.addColorStop(0.55, 'rgba(242, 248, 255, 0.76)');
          grd.addColorStop(0.90, 'rgba(245, 250, 255, 0.36)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        } else {
          grd.addColorStop(0.0,  'rgba(250, 253, 251, 0.95)');
          grd.addColorStop(0.45, 'rgba(220, 36, 28, 0.86)');
          grd.addColorStop(0.80, 'rgba(16, 18, 24, 0.86)');
          grd.addColorStop(0.94, 'rgba(250, 252, 251, 0.40)');
          grd.addColorStop(1.0,  'rgba(255, 255, 255, 0.0)');
        }
        g.fillStyle = grd;
        g.fillRect(0, 0, w, h);
      }

      // 48 tia xương vây chính chẻ nhánh đôi + gân dẫn đầu dày sáng (leading spine)
      for (let i = 0; i < 48; i++) {
        const f = i / 47;
        const isLeading = (style === 'pectoral' && i <= 2) || (style === 'dorsal' && i <= 2);
        g.strokeStyle = isLeading
          ? (isGold ? 'rgba(255, 246, 185, 0.92)' : 'rgba(255, 255, 255, 0.82)')
          : (isGold
              ? (i % 2 === 0 ? 'rgba(255, 250, 212, 0.58)' : 'rgba(176, 106, 10, 0.24)')
              : (i % 2 === 0 ? 'rgba(255, 255, 255, 0.38)' : 'rgba(18, 22, 28, 0.18)'));
        g.lineWidth = isLeading ? 5.2 : (i % 2 === 0 ? 2.6 : 1.5);

        hg.strokeStyle = isLeading ? '#f5f5f5' : '#d2d2d2';
        hg.lineWidth = isLeading ? 3.5 : 1.8;

        g.beginPath();
        hg.beginPath();
        if (style === 'dorsal') {
          g.moveTo(f * w, h); g.quadraticCurveTo(f * w - 42, h * 0.5, f * w - 85, 0);
          hg.moveTo(f * nh, nh); hg.quadraticCurveTo(f * nh - 21, nh * 0.5, f * nh - 42, 0);
        } else {
          const y0 = h * (0.34 + f * 0.32);
          const ym = h * (0.14 + f * 0.72);
          const y1 = h * f;
          g.moveTo(0, y0); g.quadraticCurveTo(w * 0.52, ym, w, y1);
          g.moveTo(w * 0.60, (ym + y1) * 0.5); g.lineTo(w, y1 + 14);
          hg.moveTo(0, y0 * 0.5); hg.quadraticCurveTo(nh * 0.52, ym * 0.5, nh, y1 * 0.5);
        }
        g.stroke();
        hg.stroke();
      }

      // Khứa viền lụa lượn sóng mềm ở mép ngoài cùng của vây (scalloped edge)
      g.globalCompositeOperation = 'destination-out';
      if (style === 'dorsal') {
        for (let i = 0; i < 24; i++) {
          const sx = (i + 0.5) * (w / 24);
          g.fillStyle = 'rgba(0,0,0,0.92)';
          g.beginPath(); g.ellipse(sx, 0, w / 52, 22 + (i % 3) * 8, 0, 0, Math.PI * 2); g.fill();
        }
      } else {
        for (let i = 0; i < 24; i++) {
          const sy = (i + 0.5) * (h / 24);
          g.fillStyle = 'rgba(0,0,0,0.92)';
          g.beginPath(); g.ellipse(w, sy, 22 + (i % 3) * 8, h / 52, 0, 0, Math.PI * 2); g.fill();
        }
      }
      g.globalCompositeOperation = 'source-over';

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.anisotropy = maxAniso;
      const normalMap = heightCanvasToNormalTexture(hCv, 2.2, false);
      return { map, normalMap };
    }

    const finTextures = {
      tail: createFinTexture('tail', 'sanke'),
      pectoral: createFinTexture('pectoral', 'sanke'),
      dorsal: createFinTexture('dorsal', 'sanke'),
    };
    const goldFinTextures = {
      tail: createFinTexture('tail', 'gold'),
      pectoral: createFinTexture('pectoral', 'gold'),
      dorsal: createFinTexture('dorsal', 'gold'),
    };
    const tanchoFinTextures = {
      tail: createFinTexture('tail', 'tancho'),
      pectoral: createFinTexture('pectoral', 'tancho'),
      dorsal: createFinTexture('dorsal', 'tancho'),
    };

    // ------------------------------------------------------------------
    // 4. ĐIÊU KHẮC HÌNH KHỐI 3D CÁ KOI CHÂN THỰC (BODY + FINS + EYES + BARBELS)
    // ------------------------------------------------------------------
    const NOSE_Z = 1.9;
    const TAIL_Z = -2.2;
    const KOI_LEN = NOSE_Z - TAIL_Z; // 4.1

    function koiCrossSection(t) {
      // Hình dáng cá Koi chuẩn: đầu tròn đầy, vai mập khỏe (t≈0.28), eo đuôi thon uyển chuyển
      const s = Math.max(0, Math.min(1, t));
      const snoutCurve = Math.pow(Math.sin(Math.min(1, s * 1.03) * Math.PI), 0.66);
      const taper = 1.0 - 0.42 * Math.pow(s, 1.35);

      const halfW = snoutCurve * taper * 0.62 + (s > 0.78 ? ((s - 0.78) / 0.22) * 0.075 : 0);
      const topH  = Math.pow(Math.sin(Math.min(1, s * 1.02) * Math.PI), 0.70) * (0.70 - 0.24 * s) + (s > 0.8 ? ((s - 0.8) / 0.2) * 0.14 : 0);
      const botH  = Math.pow(Math.sin(Math.min(1, s * 1.01) * Math.PI), 0.74) * (0.56 - 0.22 * s) + (s > 0.8 ? ((s - 0.8) / 0.2) * 0.12 : 0);
      // Hơi nhô nhẹ ở nắp mang (t ≈ 0.2)
      const gillFlare = Math.exp(-Math.pow((s - 0.21) / 0.055, 2)) * 0.035;
      // Đường sống lưng hơi võng nhẹ xuống phần đầu cho giống cá Koi thật
      const centerY = Math.sin(s * Math.PI) * 0.06 - (s < 0.2 ? (0.2 - s) * 0.22 : 0);
      return { halfW: halfW + gillFlare, topH, botH, centerY };
    }

    function buildKoiBodyGeometry() {
      const rings = 62;
      const radial = 36;
      const positions = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= rings; i++) {
        const t = i / rings;
        const z = NOSE_Z - t * KOI_LEN;
        const cs = koiCrossSection(t);

        for (let j = 0; j <= radial; j++) {
          const u = j / radial; // u = 0.5 là đỉnh lưng, u = 0/1 là đáy bụng
          const theta = (u - 0.5) * Math.PI * 2; // 0 = đỉnh lưng (+Y), ±π/2 = hông (±X), ±π = bụng (-Y)
          const sinT = Math.sin(theta);
          const cosT = Math.cos(theta);

          // Mặt cắt hơi bầu trên đầy đặn, gọn dần xuống bụng
          const rx = cs.halfW * sinT * (cosT > 0 ? (1 - 0.06 * cosT) : (1 - 0.14 * (-cosT)));
          const ry = (cosT >= 0 ? cs.topH * cosT : cs.botH * cosT) + cs.centerY;

          positions.push(rx, ry, z);
          uvs.push(u, t);
        }
      }

      const stride = radial + 1;
      for (let i = 0; i < rings; i++) {
        for (let j = 0; j < radial; j++) {
          const a = i * stride + j;
          const b = (i + 1) * stride + j;
          const c = (i + 1) * stride + (j + 1);
          const d = i * stride + (j + 1);
          indices.push(a, d, b);
          indices.push(b, d, c);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.basePos = new Float32Array(positions);
      return geo;
    }

    // Vây đuôi quạt 3D mềm chia lưới mịn để uốn lượn
    function buildTailFinGeometry() {
      const segZ = 16, segY = 14;
      const positions = [], uvs = [], indices = [];
      for (let i = 0; i <= segZ; i++) {
        const f = i / segZ; // 0 = gốc đuôi, 1 = mép ngoài đuôi
        for (let j = 0; j <= segY; j++) {
          const v = j / segY; // 0 = cạnh dưới, 1 = cạnh trên
          const ny = (v - 0.5) * 2; // -1 .. +1
          // Xòe tròn cánh bướm Koi (hơi chẻ nhẹ hình tim ở chính giữa mép sau)
          const forkIndent = Math.exp(-Math.pow(ny / 0.36, 2)) * 0.28 * f * f;
          const z = TAIL_Z + 0.12 - f * (1.42 - forkIndent);
          const spread = 0.15 + Math.pow(f, 0.72) * 0.92;
          const y = ny * spread;
          positions.push(0, y, z);
          uvs.push(f, v);
        }
      }
      const stride = segY + 1;
      for (let i = 0; i < segZ; i++) {
        for (let j = 0; j < segY; j++) {
          const a = i * stride + j, b = (i + 1) * stride + j, c = (i + 1) * stride + j + 1, d = i * stride + j + 1;
          indices.push(a, b, d, b, c, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.basePos = new Float32Array(positions);
      return geo;
    }

    // Vây lưng 3D chạy dọc sống lưng
    function buildDorsalFinGeometry() {
      const segZ = 18, segY = 7;
      const positions = [], uvs = [], indices = [];
      const zStart = 0.58, zEnd = -1.22;
      for (let i = 0; i <= segZ; i++) {
        const f = i / segZ;
        const z = zStart + (zEnd - zStart) * f;
        const tBody = (NOSE_Z - z) / KOI_LEN;
        const cs = koiCrossSection(tBody);
        const baseY = cs.topH + cs.centerY - 0.06;
        const finHeight = Math.sin(Math.pow(f, 0.8) * Math.PI) * 0.62 + 0.06;

        for (let j = 0; j <= segY; j++) {
          const h = j / segY; // 0 = gắn lưng, 1 = ngọn vây
          const y = baseY + h * finHeight;
          const sweepZ = z - h * 0.24 * (0.4 + 0.6 * f);
          positions.push(0, y, sweepZ);
          uvs.push(f, h);
        }
      }
      const stride = segY + 1;
      for (let i = 0; i < segZ; i++) {
        for (let j = 0; j < segY; j++) {
          const a = i * stride + j, b = (i + 1) * stride + j, c = (i + 1) * stride + j + 1, d = i * stride + j + 1;
          indices.push(a, b, d, b, c, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.basePos = new Float32Array(positions);
      return geo;
    }

    // Vây ngực 3D dạng cánh quạt mềm (side = +1 bên phải, -1 bên trái)
    function buildPectoralFinGeometry(side) {
      const segR = 12, segC = 10;
      const positions = [], uvs = [], indices = [];
      for (let i = 0; i <= segR; i++) {
        const r = i / segR; // 0 = gốc vây, 1 = chóp vây
        for (let j = 0; j <= segC; j++) {
          const c = j / segC; // 0 = mép trước, 1 = mép sau
          const fanAngle = (c - 0.35) * 1.15;
          const reach = r * (1.12 - Math.abs(c - 0.45) * 0.36);
          const x = side * (Math.cos(fanAngle * 0.5) * reach * 0.92);
          const z = -Math.sin(fanAngle) * reach * 0.85 - r * 0.42;
          const y = -r * 0.34 - Math.sin(r * Math.PI) * 0.08 + (0.5 - c) * 0.14 * r;
          positions.push(x, y, z);
          uvs.push(r, c);
        }
      }
      const stride = segC + 1;
      for (let i = 0; i < segR; i++) {
        for (let j = 0; j < segC; j++) {
          const a = i * stride + j, b = (i + 1) * stride + j, c = (i + 1) * stride + j + 1, d = i * stride + j + 1;
          indices.push(a, b, d, b, c, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.basePos = new Float32Array(positions);
      return geo;
    }

    // Vây hậu môn & cặp vây bụng
    function buildLowerFinGeometry(length, height, zOffset, xOffset, tiltX) {
      const segZ = 8, segY = 6;
      const positions = [], uvs = [], indices = [];
      for (let i = 0; i <= segZ; i++) {
        const f = i / segZ;
        const z = zOffset - f * length;
        const drop = Math.sin(Math.pow(f, 0.75) * Math.PI) * height;
        for (let j = 0; j <= segY; j++) {
          const h = j / segY;
          const x = xOffset + tiltX * h * drop;
          const y = -0.34 - h * drop;
          positions.push(x, y, z - h * 0.16);
          uvs.push(f, 1 - h);
        }
      }
      const stride = segY + 1;
      for (let i = 0; i < segZ; i++) {
        for (let j = 0; j < segY; j++) {
          const a = i * stride + j, b = (i + 1) * stride + j, c = (i + 1) * stride + j + 1, d = i * stride + j + 1;
          indices.push(a, b, d, b, c, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      geo.userData.basePos = new Float32Array(positions);
      return geo;
    }

    // Tạo 1 con cá Koi 3D hoàn chỉnh siêu thực (Normal Map Sobel, Caustics trên lưng, 4 râu, môi thở, vây có gân 3D)
    function createKoi3D(variant, scale) {
      const isGold = variant === 'gold';
      const isTancho = variant === 'tancho';
      const group = new THREE.Group();
      group.scale.setScalar(scale);

      const { map, normalMap, roughnessMap } = createKoiSkinTextures(variant);
      const bodyMat = new THREE.MeshPhysicalMaterial({
        map,
        normalMap,
        normalScale: new THREE.Vector2(isGold ? 0.95 : 0.78, isGold ? 0.95 : 0.78),
        roughnessMap,
        roughness: isGold ? 0.40 : 0.68,
        metalness: isGold ? 0.60 : 0.06,
        emissive: isGold ? 0x3d2400 : 0x000000,
        emissiveIntensity: isGold ? 0.16 : 0.0,
        clearcoat: 1.0,
        clearcoatRoughness: isGold ? 0.035 : 0.05,
        envMapIntensity: isGold ? 1.80 : 1.22,
        reflectivity: 0.98,
      });

      // Chiếu vân nắng khúc xạ mặt nước (Caustics) động lên sống lưng cá + sắc xanh nước sâu theo độ lặn!
      bodyMat.customProgramCacheKey = () => isGold ? 'koi-phys-gold-v2' : 'koi-phys-std-v2';
      bodyMat.onBeforeCompile = (shader) => {
        shader.uniforms.uKoiTime = koiUnderwaterUniforms.uKoiTime;
        shader.uniforms.uKoiWaterY = koiUnderwaterUniforms.uKoiWaterY;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vKoiWPos;\nvarying vec3 vKoiWNorm;')
          .replace('#include <project_vertex>', '#include <project_vertex>\nvKoiWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvKoiWNorm = normalize(mat3(modelMatrix) * objectNormal);');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform float uKoiTime;\nuniform float uKoiWaterY;\nvarying vec3 vKoiWPos;\nvarying vec3 vKoiWNorm;')
          .replace('#include <tonemapping_fragment>', `
            float kDepth = clamp((uKoiWaterY - vKoiWPos.y) / 3.4, 0.0, 1.0);
            float kUp = smoothstep(0.10, 0.85, normalize(vKoiWNorm).y);
            vec2 kUv = vKoiWPos.xz * 0.52;
            float kA = sin(kUv.x * 3.1 + uKoiTime * 1.45 + sin(kUv.y * 2.5 - uKoiTime * 1.10));
            float kB = cos(kUv.y * 3.3 - uKoiTime * 1.25 + cos(kUv.x * 2.7 + uKoiTime * 1.35));
            float kCaust = pow(clamp(0.5 + 0.5 * kA * kB, 0.0, 1.0), 4.2);
            gl_FragColor.rgb += vec3(0.95, 0.94, 0.65) * kCaust * kUp * (1.0 - kDepth * 0.50) * 0.26;
            gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.16, 0.16, 0.07), kDepth * 0.28);
            #include <tonemapping_fragment>
          `);
      };

      const bodyGeo = buildKoiBodyGeometry();
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      bodyMesh.castShadow = true;
      bodyMesh.receiveShadow = true;
      group.add(bodyMesh);

      const activeFins = isGold ? goldFinTextures : (isTancho ? tanchoFinTextures : finTextures);
      const finMatBase = (finPair) => new THREE.MeshPhysicalMaterial({
        map: finPair.map,
        normalMap: finPair.normalMap,
        normalScale: new THREE.Vector2(0.55, 0.55),
        transparent: true,
        opacity: isGold ? 0.95 : 0.94,
        side: THREE.DoubleSide,
        roughness: isGold ? 0.16 : 0.22,
        metalness: isGold ? 0.36 : 0.03,
        clearcoat: isGold ? 0.90 : 0.72,
        clearcoatRoughness: 0.10,
        envMapIntensity: isGold ? 1.50 : 1.08,
        depthWrite: false,
      });

      const tailMesh = new THREE.Mesh(buildTailFinGeometry(), finMatBase(activeFins.tail));
      tailMesh.castShadow = true;
      group.add(tailMesh);

      const dorsalMesh = new THREE.Mesh(buildDorsalFinGeometry(), finMatBase(activeFins.dorsal));
      dorsalMesh.castShadow = true;
      group.add(dorsalMesh);

      const pecMat = finMatBase(activeFins.pectoral);
      const pecLeft = new THREE.Mesh(buildPectoralFinGeometry(-1), pecMat);
      pecLeft.position.set(-0.44, -0.14, 0.72);
      pecLeft.castShadow = true;
      group.add(pecLeft);

      const pecRight = new THREE.Mesh(buildPectoralFinGeometry(1), pecMat);
      pecRight.position.set(0.44, -0.14, 0.72);
      pecRight.castShadow = true;
      group.add(pecRight);

      const pelvicL = new THREE.Mesh(buildLowerFinGeometry(0.65, 0.36, -0.22, -0.16, -0.45), finMatBase(activeFins.dorsal));
      const pelvicR = new THREE.Mesh(buildLowerFinGeometry(0.65, 0.36, -0.22,  0.16,  0.45), finMatBase(activeFins.dorsal));
      const analFin = new THREE.Mesh(buildLowerFinGeometry(0.72, 0.34, -1.10,  0.0,   0.0),  finMatBase(activeFins.dorsal));
      group.add(pelvicL, pelvicR, analFin);

      // Miệng 3D có viền môi mềm & khoang miệng tối (nhấp nhẹ theo nhịp thở!)
      const mouthGroup = new THREE.Group();
      mouthGroup.position.set(0, -0.135, NOSE_Z - 0.08);
      const lipMat = new THREE.MeshPhysicalMaterial({
        color: isGold ? 0xf2bf48 : 0xf4e8e6,
        roughness: 0.24,
        metalness: isGold ? 0.38 : 0.02,
        clearcoat: 0.9,
      });
      const mouthCavityMat = new THREE.MeshStandardMaterial({ color: 0x160c0e, roughness: 0.85 });
      const lipTorus = new THREE.Mesh(new THREE.TorusGeometry(0.088, 0.028, 10, 20), lipMat);
      lipTorus.scale.set(1.22, 0.72, 0.85);
      lipTorus.rotation.x = 0.25;
      const mouthCavity = new THREE.Mesh(new THREE.SphereGeometry(0.072, 12, 10), mouthCavityMat);
      mouthCavity.scale.set(1.12, 0.58, 0.65);
      mouthCavity.position.z = -0.02;
      mouthGroup.add(lipTorus, mouthCavity);
      group.add(mouthGroup);

      // Mắt 3D đa lớp siêu thực (texture mống mắt vân sợi ánh kim + viền mí + đồng tử đen sâu + giác mạc trong suốt)
      const eyeGroup = new THREE.Group();
      const irisMat = new THREE.MeshPhysicalMaterial({
        map: isGold ? koiIrisTexGold : koiIrisTexStd,
        roughness: isGold ? 0.14 : 0.20,
        metalness: isGold ? 0.65 : 0.35,
        clearcoat: 0.92,
        envMapIntensity: 1.45,
      });
      const pupilMat = new THREE.MeshPhysicalMaterial({ color: 0x020305, roughness: 0.02, clearcoat: 1.0, clearcoatRoughness: 0.01, envMapIntensity: 1.6 });
      const corneaMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.26, roughness: 0.015, clearcoat: 1.0, clearcoatRoughness: 0.01, envMapIntensity: 2.0 });
      const eyeGeo = new THREE.SphereGeometry(0.112, 20, 20);
      const pupilGeo = new THREE.SphereGeometry(0.084, 18, 18);
      const corneaGeo = new THREE.SphereGeometry(0.120, 18, 18);

      for (const side of [-1, 1]) {
        const iris = new THREE.Mesh(eyeGeo, irisMat);
        iris.position.set(side * 0.315, 0.078, 1.30);
        iris.scale.set(0.68, 0.98, 1.04);
        iris.rotation.y = side > 0 ? Math.PI * 0.5 : -Math.PI * 0.5;
        eyeGroup.add(iris);

        const pupil = new THREE.Mesh(pupilGeo, pupilMat);
        pupil.position.set(side * 0.348, 0.078, 1.318);
        pupil.scale.set(0.62, 0.92, 0.92);
        eyeGroup.add(pupil);

        const cornea = new THREE.Mesh(corneaGeo, corneaMat);
        cornea.position.set(side * 0.320, 0.078, 1.305);
        cornea.scale.set(0.73, 1.00, 1.06);
        eyeGroup.add(cornea);
      }
      group.add(eyeGroup);

      // 4 sợi râu cá Koi chuẩn giải phẫu (1 cặp râu dài khóe miệng + 1 cặp râu ngắn mũi trước)
      const barbelMat = new THREE.MeshPhysicalMaterial({
        color: isGold ? 0xf7cf5c : 0xf7f5f2,
        roughness: isGold ? 0.16 : 0.24,
        metalness: isGold ? 0.45 : 0.0,
        clearcoat: 0.88,
      });
      const barbels = [];
      for (const side of [-1, 1]) {
        // Cặp râu chính dài uyển chuyển
        const longCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(side * 0.14, -0.11, 1.72),
          new THREE.Vector3(side * 0.30, -0.20, 1.54),
          new THREE.Vector3(side * 0.38, -0.32, 1.30),
        ]);
        const bLong = new THREE.Mesh(new THREE.TubeGeometry(longCurve, 14, 0.017, 6, false), barbelMat);
        group.add(bLong);
        barbels.push({ mesh: bLong, side, isShort: false });

        // Cặp râu phụ ngắn tinh tế gần chóp mũi
        const shortCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(side * 0.11, -0.09, 1.78),
          new THREE.Vector3(side * 0.21, -0.14, 1.68),
          new THREE.Vector3(side * 0.26, -0.20, 1.56),
        ]);
        const bShort = new THREE.Mesh(new THREE.TubeGeometry(shortCurve, 10, 0.011, 6, false), barbelMat);
        group.add(bShort);
        barbels.push({ mesh: bShort, side, isShort: true });
      }

      scene.add(group);
      return {
        group,
        bodyMesh,
        tailMesh,
        dorsalMesh,
        pecLeft,
        pecRight,
        pelvicL,
        pelvicR,
        analFin,
        mouthGroup,
        eyeGroup,
        barbels,
      };
    }

    // ------------------------------------------------------------------
    // 5. BIẾN DẠNG ĐỈNH 3D THỜI GIAN THỰC (SÓNG SIN + UỐN THEO CUA + VÂY VE VẨY)
    // ------------------------------------------------------------------
    function spineWaveX(z, phase, turnBend) {
      const u = Math.max(0, (NOSE_Z - z) / KOI_LEN); // 0 ở mũi → 1 ở gốc đuôi → ~1.35 ở chóp đuôi
      // Sóng sin uốn ngang mềm mại tăng dần về đuôi + độ cong thân khi rẽ trái/phải
      const wave = Math.sin(phase - u * 4.7) * (0.02 + 0.36 * u * u);
      const curve = turnBend * 0.68 * u * u;
      return wave + curve;
    }

    function deformMeshBySpine(mesh, phase, turnBend, extraTipWave = 0, breathVal = 0) {
      const pos = mesh.geometry.attributes.position;
      const base = mesh.geometry.userData.basePos;
      for (let i = 0; i < pos.count; i++) {
        const bx = base[i * 3];
        const by = base[i * 3 + 1];
        const bz = base[i * 3 + 2];
        let dx = spineWaveX(bz, phase, turnBend);
        let gillExpand = 1.0;
        // Nhịp phập phồng nắp mang tự nhiên (operculum breathing) quanh vùng mang cá (z ∈ [0.85, 1.25])
        if (breathVal !== 0 && bz > 0.72 && bz < 1.35) {
          const gBell = Math.exp(-Math.pow((bz - 1.04) / 0.17, 2));
          gillExpand = 1.0 + breathVal * gBell * 0.068;
        }
        if (extraTipWave && bz < TAIL_Z) {
          const tailFrac = Math.min(1, (TAIL_Z - bz) / 1.45);
          dx += Math.sin(phase - 5.4 - tailFrac * 2.4) * extraTipWave * tailFrac * tailFrac;
        }
        pos.setXYZ(i, bx * gillExpand + dx, by, bz);
      }
      pos.needsUpdate = true;
    }

    function deformDorsalFin(mesh, phase, turnBend) {
      const pos = mesh.geometry.attributes.position;
      const base = mesh.geometry.userData.basePos;
      const uv = mesh.geometry.attributes.uv;
      for (let i = 0; i < pos.count; i++) {
        const bx = base[i * 3];
        const by = base[i * 3 + 1];
        const bz = base[i * 3 + 2];
        const h = uv.getY(i); // 0 gốc lưng → 1 ngọn vây
        const dx = spineWaveX(bz, phase, turnBend) + Math.sin(phase - 2.6 - h * 2.2) * 0.16 * h;
        pos.setXYZ(i, bx + dx, by, bz);
      }
      pos.needsUpdate = true;
    }

    function deformPectoralFin(mesh, phase, side, turnBend) {
      const pos = mesh.geometry.attributes.position;
      const base = mesh.geometry.userData.basePos;
      const uv = mesh.geometry.attributes.uv;
      const localPhase = phase + (side > 0 ? 0 : 0.85);
      // Khi ôm cua, vây bên ngoài xòe chèo mạnh hơn vây bên trong như cá Koi thật giữ thăng bằng
      const turnEffort = 1.0 + Math.max(0, -side * turnBend) * 0.45;
      for (let i = 0; i < pos.count; i++) {
        const bx = base[i * 3];
        const by = base[i * 3 + 1];
        const bz = base[i * 3 + 2];
        const r = uv.getX(i); // 0 gốc → 1 chóp cánh vây
        const c = uv.getY(i);
        // Vây chèo mềm dạng số 8 với chóp trễ pha như lụa trong nước
        const flapY = Math.sin(localPhase - r * 2.15 - c * 0.72) * 0.24 * r * turnEffort;
        const sweepZ = Math.cos(localPhase - r * 1.65) * 0.19 * r * turnEffort;
        pos.setXYZ(i, bx, by + flapY, bz + sweepZ);
      }
      pos.needsUpdate = true;
      // Giữ gốc vây bám đúng độ lắc nhẹ của vai cá
      const shoulderX = spineWaveX(0.72, phase, turnBend);
      mesh.position.x = side * 0.44 + shoulderX;
    }

    function updateKoiDeformation(koi, phase, turnBend, breathPhase = 0) {
      const breathVal = Math.sin(breathPhase);
      deformMeshBySpine(koi.bodyMesh, phase, turnBend, 0, breathVal);
      koi.bodyMesh.geometry.computeVertexNormals();
      deformMeshBySpine(koi.tailMesh, phase, turnBend, 0.36, 0);
      deformDorsalFin(koi.dorsalMesh, phase, turnBend);
      deformPectoralFin(koi.pecLeft, phase, -1, turnBend);
      deformPectoralFin(koi.pecRight, phase, 1, turnBend);
      deformMeshBySpine(koi.pelvicL, phase - 0.5, turnBend, 0, 0);
      deformMeshBySpine(koi.pelvicR, phase - 0.8, turnBend, 0, 0);
      deformMeshBySpine(koi.analFin, phase - 1.1, turnBend, 0, 0);

      const headDx = spineWaveX(1.30, phase, turnBend);
      koi.eyeGroup.position.x = headDx;

      // Nhịp nhấp môi thở nhẹ nhàng đồng pha ngược với nhịp mở mang (hút nước -> đẩy qua mang!)
      const snoutDx = spineWaveX(1.75, phase, turnBend);
      if (koi.mouthGroup) {
        koi.mouthGroup.position.x = snoutDx;
        const mouthOpen = 0.84 + Math.max(0, -breathVal) * 0.34;
        koi.mouthGroup.scale.set(1.0 + Math.max(0, -breathVal) * 0.08, mouthOpen, 1.0);
      }
      for (const b of koi.barbels) {
        b.mesh.position.x = snoutDx;
        const sway = Math.sin(phase * 0.85 - (b.isShort ? 0.2 : 0.65)) * (b.isShort ? 0.06 : 0.11);
        b.mesh.rotation.z = b.side * sway - turnBend * 0.14;
        b.mesh.rotation.y = -turnBend * (b.isShort ? 0.08 : 0.16);
      }
    }

    // ------------------------------------------------------------------
    // 6. HỒ HOA SEN 3D CHI TIẾT & SỐNG ĐỘNG (ĐÁY SỎI, RONG, TIA NẮNG, SEN ĐA TẦNG)
    // ------------------------------------------------------------------
    const WATER_Y = 1.65;
    const FLOOR_Y = -3.35;

    // 6.1 Đáy hồ 3D uốn lượn tự nhiên (cát gợn sóng mịn, không lặp gạch, thoáng mắt)
    function floorHeightAt(x, z) {
      // Lòng hồ hơi trũng nhẹ ở trung tâm, nâng dần mềm mại về rìa + gợn cát 3D êm ái
      const dist = Math.hypot(x + 1.2, z + 0.5);
      const basin = Math.min(0.65, dist * dist * 0.0045);
      const dunes = Math.sin(x * 0.24 + z * 0.16) * 0.20 + Math.cos(z * 0.34 - x * 0.20) * 0.12;
      const ripplesSand = Math.sin(x * 1.05 + z * 0.42 + Math.sin(z * 0.45) * 1.1) * 0.042;
      return FLOOR_Y + basin + dunes + ripplesSand;
    }

    function createPondFloorTextures() {
      // Texture liền mạch 1024x1024 lặp 5x5 -> mật độ thực 5120x5120 siêu nét ngay cả khi zoom cận cảnh!
      const s = 1024;
      const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
      const g = cv.getContext('2d');

      const hv = document.createElement('canvas'); hv.width = s; hv.height = s;
      const hCtx = hv.getContext('2d');

      // 1. Nền bùn đất phủ rêu tảo ô-liu trầm sâu tự nhiên (xầm tối xuống thêm cho thật và làm nổi bật đàn cá Koi)
      g.fillStyle = '#4e4b25';
      g.fillRect(0, 0, s, s);
      hCtx.fillStyle = '#787878';
      hCtx.fillRect(0, 0, s, s);

      // Hàm vẽ lặp 3x3 biên (wrap-around) đảm bảo 100% seamless tiling
      function drawWrapped(fn) {
        for (let ox = -s; ox <= s; ox += s) {
          for (let oy = -s; oy <= s; oy += s) fn(ox, oy);
        }
      }

      // 2. Các mảng loang rêu tảo trầm, phù sa bùn đất & trầm tích hữu cơ sẫm tự nhiên
      const mudTones = [
        'rgba(104, 98, 52, 0.36)',
        'rgba(72, 70, 31, 0.44)',
        'rgba(60, 52, 24, 0.44)',
        'rgba(40, 38, 17, 0.50)',
        'rgba(88, 84, 41, 0.36)',
      ];
      const mudTonesSoft = [
        'rgba(104, 98, 52, 0.12)',
        'rgba(72, 70, 31, 0.15)',
        'rgba(60, 52, 24, 0.15)',
        'rgba(40, 38, 17, 0.17)',
        'rgba(88, 84, 41, 0.13)',
      ];
      for (let i = 0; i < 65; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const rx = 55 + Math.random() * 125, ry = 35 + Math.random() * 90;
        const rot = Math.random() * Math.PI;
        const c0 = mudTones[i % mudTones.length];
        const c1 = mudTonesSoft[(i + 1) % mudTonesSoft.length];
        const hi = i % 2 === 0 ? 'rgba(165,165,165,0.22)' : 'rgba(55,55,55,0.24)';
        drawWrapped((ox, oy) => {
          const cx = x + ox, cy = y + oy;
          if (cx + rx < 0 || cx - rx > s || cy + rx < 0 || cy - rx > s) return;
          const mg = g.createRadialGradient(cx, cy, 4, cx, cy, rx);
          mg.addColorStop(0, c0); mg.addColorStop(0.65, c1); mg.addColorStop(1, 'rgba(0,0,0,0)');
          g.fillStyle = mg;
          g.beginPath(); g.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); g.fill();

          const hg = hCtx.createRadialGradient(cx, cy, 4, cx, cy, rx);
          hg.addColorStop(0, hi); hg.addColorStop(1, 'rgba(120,120,120,0)');
          hCtx.fillStyle = hg;
          hCtx.beginPath(); hCtx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); hCtx.fill();
        });
      }

      // 3. Các vệt bùn gợn mềm (dòng nước & cá quẫy) + cặn hữu cơ / vụn rêu sắc nét ở độ phân giải cao
      for (let i = 0; i < 140; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const len = 18 + Math.random() * 52, w = 4 + Math.random() * 12;
        const rot = -0.35 + (Math.random() - 0.5) * 0.9;
        const col = i % 3 === 0 ? 'rgba(52, 49, 22, 0.28)' : 'rgba(130, 123, 66, 0.22)';
        const hCol = i % 3 === 0 ? 'rgba(72, 72, 72, 0.30)' : 'rgba(168, 168, 168, 0.26)';
        drawWrapped((ox, oy) => {
          const cx = x + ox, cy = y + oy;
          if (cx + len < 0 || cx - len > s || cy + len < 0 || cy - len > s) return;
          g.fillStyle = col;
          g.beginPath(); g.ellipse(cx, cy, len, w, rot, 0, Math.PI * 2); g.fill();
          hCtx.fillStyle = hCol;
          hCtx.beginPath(); hCtx.ellipse(cx, cy, len, w, rot, 0, Math.PI * 2); hCtx.fill();
        });
      }

      const detritusColors = [
        'rgba(48, 44, 20, 0.54)',
        'rgba(64, 56, 26, 0.46)',
        'rgba(42, 42, 18, 0.50)',
        'rgba(92, 86, 40, 0.38)',
        'rgba(126, 118, 64, 0.36)',
      ];
      for (let i = 0; i < 1800; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const rx = 1.4 + Math.pow(Math.random(), 2.2) * 5.2;
        const ry = rx * (0.35 + Math.random() * 0.55);
        const rot = Math.random() * Math.PI;
        const col = detritusColors[i % detritusColors.length];
        const hCol = i % 2 === 0 ? 'rgba(162, 162, 162, 0.32)' : 'rgba(76, 76, 76, 0.32)';
        g.fillStyle = col;
        g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill();
        hCtx.fillStyle = hCol;
        hCtx.beginPath(); hCtx.ellipse(x, y, rx * 1.1, ry * 1.1, rot, 0, Math.PI * 2); hCtx.fill();
      }

      // Hạt mịn bùn đất hữu cơ sắc nét
      const cImg = g.getImageData(0, 0, s, s);
      const cData = cImg.data;
      for (let i = 0; i < cData.length; i += 4) {
        const n = (Math.random() - 0.5) * 16;
        cData[i]     = Math.max(0, Math.min(255, cData[i] + n));
        cData[i + 1] = Math.max(0, Math.min(255, cData[i + 1] + n * 0.95));
        cData[i + 2] = Math.max(0, Math.min(255, cData[i + 2] + n * 0.65));
      }
      g.putImageData(cImg, 0, 0);

      // 4. Tính Tangent-Space Normal Map liền mạch (5x5 repeat + maxAniso sắc nét mọi góc nhìn)
      const normalMap = heightCanvasToNormalTexture(hv, 1.65, true);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.repeat.set(5, 5);
      normalMap.anisotropy = maxAniso;

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.repeat.set(5, 5);
      map.anisotropy = maxAniso;
      return { map, normalMap };
    }

    // Dựng lưới địa hình đáy hồ 3D (76x76) để ánh sáng & bóng đổ cá ôm sát từng gợn bùn rêu
    const floorGeo = new THREE.PlaneGeometry(58, 58, 76, 76);
    floorGeo.rotateX(-Math.PI / 2);
    const fPos = floorGeo.attributes.position;
    for (let i = 0; i < fPos.count; i++) {
      const fx = fPos.getX(i), fz = fPos.getZ(i);
      fPos.setY(i, floorHeightAt(fx, fz));
    }
    floorGeo.computeVertexNormals();

    const { map: floorTex, normalMap: floorNormal } = createPondFloorTextures();
    // Vật liệu bùn rêu lì hoàn toàn + shader chi tiết siêu mịn per-pixel (không bao giờ bị mờ kể cả khi zoom 400%!)
    const pondFloorMat = new THREE.MeshStandardMaterial({
      map: floorTex,
      normalMap: floorNormal,
      normalScale: new THREE.Vector2(0.78, 0.78),
      roughness: 0.96,
      metalness: 0.0,
      envMapIntensity: 0.14,
    });
    pondFloorMat.customProgramCacheKey = () => 'pond-floor-mud-detail-v1';
    pondFloorMat.onBeforeCompile = (shader) => {
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vFloorWPos;')
        .replace('#include <project_vertex>', '#include <project_vertex>\nvFloorWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', `#include <common>
          varying vec3 vFloorWPos;
          float floorHash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }
          float floorNoise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            float a = floorHash(i);
            float b = floorHash(i + vec2(1.0, 0.0));
            float c = floorHash(i + vec2(0.0, 1.0));
            float d = floorHash(i + vec2(1.0, 1.0));
            return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
          }
        `)
        .replace('#include <map_fragment>', `#include <map_fragment>
          // Biến thiên mảng lớn world-space (khử hoàn toàn dấu vết lặp gạch + tạo đụn phù sa sáng góc ao & viền tối sâu)
          vec2 wp = vFloorWPos.xz;
          float macro1 = floorNoise(wp * 0.19 + vec2(3.1, -1.7));
          float macro2 = floorNoise(wp * 0.45 - vec2(1.4, 2.8));
          // Chi tiết vi hạt bùn rêu per-pixel độ phân giải vô hạn -> zoom sát vẫn sắc nét như ảnh thật!
          float micro1 = floorNoise(wp * 6.5);
          float micro2 = floorNoise(wp * 19.0);
          float microDetail = (micro1 - 0.5) * 0.12 + (micro2 - 0.5) * 0.08;
          float centerSun = smoothstep(22.0, 2.5, length(wp - vec2(-1.4, -0.4)));
          float siltCloud = smoothstep(0.58, 0.86, floorNoise(wp * 0.28 + vec2(4.2, 2.1)));
          vec3 macroTint = mix(vec3(0.38, 0.38, 0.30), vec3(0.92, 0.89, 0.74), centerSun * 0.72 + macro1 * 0.28);
          diffuseColor.rgb *= macroTint * (0.90 + macro2 * 0.20 + microDetail);
          diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.22, 0.21, 0.09), siltCloud * 0.26);
        `);
    };
    const pondFloor = new THREE.Mesh(floorGeo, pondFloorMat);
    pondFloor.receiveShadow = true;
    scene.add(pondFloor);

    // Ánh sáng khúc xạ nắng ấm dịu nhẹ nhảy múa trên nền bùn rêu (không xanh gắt, rất thật như ao ngoài trời)
    const causticUniforms = { uTime: { value: 0 } };
    const causticMat = new THREE.ShaderMaterial({
      uniforms: causticUniforms,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec3 vWorldPos;

        float causticPattern(vec2 p, float t) {
          vec2 i = p;
          float c = 0.0;
          float inten = 0.06;
          for (int n = 0; n < 4; n++) {
            float ft = t * (1.0 - (2.6 / float(n + 2)));
            i = p + vec2(
              cos(ft - i.x) + sin(ft + i.y),
              sin(ft - i.y) + cos(ft + i.x)
            );
            c += 1.0 / length(vec2(
              p.x / (sin(i.x + ft) / inten),
              p.y / (cos(i.y + ft) / inten)
            ));
          }
          c /= 4.0;
          c = 1.15 - pow(c, 1.35);
          return clamp(pow(abs(c), 7.2), 0.0, 1.0);
        }

        void main() {
          vec2 uv = vWorldPos.xz * 0.36;
          float t1 = uTime * 0.46;
          float c1 = causticPattern(uv, t1);
          float c2 = causticPattern(uv * 1.16 + vec2(1.7, -2.3), uTime * 0.36 + 2.0);

          vec3 col = vec3(0.95, 0.90, 0.56) * (c1 * 0.65 + c2 * 0.45);
          float dist = length((vWorldPos.xz - vec2(-1.4, -0.4)) / vec2(12.5, 10.0));
          float mask = smoothstep(1.35, 0.12, dist);
          float alpha = clamp(length(col) * mask * 0.14, 0.0, 0.20);
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });
    const causticLayer = new THREE.Mesh(floorGeo, causticMat);
    causticLayer.position.y = 0.028;
    scene.add(causticLayer);

    // 6.2 Đá cuội suối & sỏi 3D siêu chi tiết (Texture vân đá khoáng + mạch thạch anh + vết nứt Sobel Normal Map + rêu bám tự nhiên)
    function createRiverRockTextures(variant = 0) {
      const s = 512;
      const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
      const g = cv.getContext('2d');
      const hv = document.createElement('canvas'); hv.width = s; hv.height = s;
      const hCtx = hv.getContext('2d');
      const rv = document.createElement('canvas'); rv.width = s; rv.height = s;
      const rCtx = rv.getContext('2d');

      // 3 dòng đá suối tự nhiên: 0 = đá bazan xám đen phủ rêu, 1 = đá granite nâu rêu phong hóa, 2 = đá cuội trầm tích có vân khoáng
      const bases = ['#3c3d35', '#4c4632', '#33362f'];
      g.fillStyle = bases[variant % 3];
      g.fillRect(0, 0, s, s);
      hCtx.fillStyle = '#828282';
      hCtx.fillRect(0, 0, s, s);
      rCtx.fillStyle = '#d8d8d8';
      rCtx.fillRect(0, 0, s, s);

      // 1. Lớp địa tầng khoáng vật & mảng màu đá tự nhiên (strata + lichen/algae stains)
      const mineralPatches = variant === 1
