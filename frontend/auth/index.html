        ? ['rgba(86, 76, 52, 0.42)', 'rgba(54, 52, 34, 0.48)', 'rgba(64, 70, 32, 0.44)', 'rgba(32, 30, 22, 0.45)']
        : ['rgba(68, 70, 62, 0.44)', 'rgba(40, 42, 38, 0.50)', 'rgba(66, 70, 32, 0.42)', 'rgba(92, 86, 68, 0.32)'];
      for (let i = 0; i < 110; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const rx = 20 + Math.random() * 88, ry = 10 + Math.random() * 44;
        const rot = (variant === 2 ? 0.15 : 0) + (Math.random() - 0.5) * 1.4;
        const mg = g.createRadialGradient(x, y, 2, x, y, rx);
        mg.addColorStop(0, mineralPatches[i % mineralPatches.length]);
        mg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = mg;
        g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill();

        const hg = hCtx.createRadialGradient(x, y, 2, x, y, rx);
        hg.addColorStop(0, i % 2 === 0 ? 'rgba(185,185,185,0.28)' : 'rgba(55,55,55,0.28)');
        hg.addColorStop(1, 'rgba(130,130,130,0)');
        hCtx.fillStyle = hg;
        hCtx.beginPath(); hCtx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); hCtx.fill();
      }

      // 2. Các mạch vân thạch anh mảnh & đường nứt khe đá thật (tạo độ sắc nét khi nhìn gần!)
      for (let v = 0; v < 9; v++) {
        let vx = Math.random() * s, vy = Math.random() * s;
        const isVein = v % 3 === 0;
        g.strokeStyle = isVein ? 'rgba(176, 170, 146, 0.34)' : 'rgba(18, 19, 12, 0.55)';
        g.lineWidth = isVein ? (1.2 + Math.random() * 1.6) : (1.0 + Math.random() * 2.2);
        hCtx.strokeStyle = isVein ? 'rgba(165, 165, 165, 0.45)' : 'rgba(20, 20, 20, 0.75)';
        hCtx.lineWidth = g.lineWidth + 1.0;

        g.beginPath(); hCtx.beginPath();
        g.moveTo(vx, vy); hCtx.moveTo(vx, vy);
        let ang = Math.random() * Math.PI * 2;
        for (let step = 0; step < 9; step++) {
          ang += (Math.random() - 0.5) * 0.7;
          vx += Math.cos(ang) * (14 + Math.random() * 24);
          vy += Math.sin(ang) * (14 + Math.random() * 24);
          g.lineTo(vx, vy); hCtx.lineTo(vx, vy);
        }
        g.stroke(); hCtx.stroke();
      }

      // 3. Lỗ rỗ đá phong hóa (micro-pits) + hạt tinh thể khoáng + vảy rêu xanh rêu bám rải rác
      for (let i = 0; i < 950; i++) {
        const x = Math.random() * s, y = Math.random() * s;
        const r = 0.8 + Math.pow(Math.random(), 2.2) * 3.8;
        const kind = i % 5;
        if (kind === 0) {
          // Lỗ rỗ tối trên mặt đá
          g.fillStyle = 'rgba(18, 19, 14, 0.48)';
          hCtx.fillStyle = 'rgba(28, 28, 28, 0.65)';
        } else if (kind === 1) {
          // Hạt khoáng sáng mịn
          g.fillStyle = 'rgba(148, 142, 118, 0.32)';
          hCtx.fillStyle = 'rgba(205, 205, 205, 0.45)';
          rCtx.fillStyle = '#888888'; // hạt khoáng hơi bóng ẩm nhẹ dưới nước
          rCtx.beginPath(); rCtx.arc(x, y, r, 0, Math.PI * 2); rCtx.fill();
        } else if (kind === 2) {
          // Đốm rêu xanh ô-liu lì bám trên đá
          g.fillStyle = 'rgba(72, 78, 32, 0.42)';
          hCtx.fillStyle = 'rgba(155, 155, 155, 0.35)';
          rCtx.fillStyle = '#f2f2f2';
          rCtx.beginPath(); rCtx.arc(x, y, r * 1.4, 0, Math.PI * 2); rCtx.fill();
        } else {
          g.fillStyle = 'rgba(46, 44, 32, 0.38)';
          hCtx.fillStyle = 'rgba(110, 110, 110, 0.35)';
        }
        g.beginPath(); g.ellipse(x, y, r, r * (0.55 + Math.random() * 0.45), Math.random() * Math.PI, 0, Math.PI * 2); g.fill();
        hCtx.beginPath(); hCtx.ellipse(x, y, r, r * 0.75, Math.random() * Math.PI, 0, Math.PI * 2); hCtx.fill();
      }

      // Hạt nhiễu đá tự nhiên chống trơn lì giả
      const cImg = g.getImageData(0, 0, s, s);
      const d = cImg.data;
      for (let i = 0; i < d.length; i += 4) {
        const n = (Math.random() - 0.5) * 18;
        d[i]     = Math.max(0, Math.min(255, d[i] + n));
        d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
        d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n * 0.9));
      }
      g.putImageData(cImg, 0, 0);

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.wrapS = map.wrapT = THREE.RepeatWrapping;
      map.anisotropy = maxAniso;

      const normalMap = heightCanvasToNormalTexture(hv, 2.85, true);
      normalMap.wrapS = normalMap.wrapT = THREE.RepeatWrapping;
      normalMap.anisotropy = maxAniso;

      const roughnessMap = new THREE.CanvasTexture(rv);
      roughnessMap.wrapS = roughnessMap.wrapT = THREE.RepeatWrapping;
      return { map, normalMap, roughnessMap };
    }

    // Điêu khắc hình khối đá suối thật 3D (có cạnh vát phong hóa, đáy hơi phẳng lún bùn & Vertex-Color AO chân đá + phủ rêu mặt trên!)
    function createSculptedRockGeometry(seed = 0, detail = 3, angularity = 0.14) {
      const geo = new THREE.IcosahedronGeometry(1, detail);
      const pos = geo.attributes.position;
      const colors = [];
      const col = new THREE.Color();

      for (let i = 0; i < pos.count; i++) {
        let vx = pos.getX(i), vy = pos.getY(i), vz = pos.getZ(i);
        // Nhiễu đa tầng 3D tạo thớ đá tự nhiên + mặt vát địa chất (không còn tròn đều như củ khoai!)
        const n1 = Math.sin(vx * 2.7 + seed * 3.1 + vz * 2.3) * angularity;
        const n2 = Math.cos(vy * 3.8 - vx * 2.9 + seed * 1.7) * (angularity * 0.72);
        const n3 = Math.sin(vz * 5.6 + vy * 4.5 + seed * 2.4) * (angularity * 0.34);
        // Vát phẳng nhẹ tạo cạnh đá suối bị nước bào mòn
        const facet = Math.abs(Math.sin(vx * 1.9 + vz * 1.5 + seed)) * (angularity * 0.45);
        const rad = 1.0 + n1 + n2 + n3 - facet;
        vx *= rad;
        vy *= rad;
        vz *= rad;
        // Đáy viên đá hơi bẹt để nằm ôm tự nhiên vào lớp bùn đáy
        if (vy < -0.25) vy = -0.25 + (vy + 0.25) * 0.45;
        pos.setXYZ(i, vx, vy, vz);

        // Vertex Color: chân đá tối sẫm (Ambient Occlusion lún bùn), mặt đỉnh hơi ngả ánh rêu tự nhiên
        const upFactor = THREE.MathUtils.clamp((vy + 0.35) / 1.15, 0, 1);
        const ao = 0.56 + 0.48 * Math.pow(upFactor, 0.75);
        col.setRGB(
          ao * (0.98 - upFactor * 0.06),
          ao * (0.98 + upFactor * 0.05),
          ao * (0.86 - upFactor * 0.14)
        );
        colors.push(col.r, col.g, col.b);
      }
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();
      return geo;
    }

    const rockTexSets = [
      createRiverRockTextures(0),
      createRiverRockTextures(1),
      createRiverRockTextures(2),
    ];
    const pebbleMats = rockTexSets.map((ts, idx) => new THREE.MeshStandardMaterial({
      map: ts.map,
      normalMap: ts.normalMap,
      normalScale: new THREE.Vector2(1.15, 1.15),
      roughnessMap: ts.roughnessMap,
      roughness: idx === 1 ? 0.90 : 0.84,
      metalness: 0.02,
      vertexColors: true,
      envMapIntensity: 0.24,
    }));

    // 3 dáng khối đá lớn khác nhau để mỗi tảng đá quanh bờ đều độc bản
    const boulderGeos = [
      createSculptedRockGeometry(1.1, 3, 0.17),
      createSculptedRockGeometry(3.7, 3, 0.21),
      createSculptedRockGeometry(6.4, 3, 0.14),
    ];

    // 180 viên sỏi đá cuội 3D siêu chi tiết (2 dáng đá riêng biệt có đủ vân đá, Normal Map & màu đá suối đa dạng)
    (function buildInstancedRiverGravel() {
      const stoneShapes = [
        createSculptedRockGeometry(2.3, 2, 0.13),
        createSculptedRockGeometry(5.8, 2, 0.18),
      ];
      stoneShapes.forEach((g) => g.scale(0.19, 0.12, 0.17));

      const stoneShades = [0x8e8b74, 0x767458, 0x9c9272, 0x64664c, 0x82785c, 0x5c5e44, 0xa89f7e];
      const clusterCenters = [
        [-6.4, -3.2], [-5.5, 3.0], [-0.2, -5.2], [5.2, -3.6], [-3.5, -4.4]
      ];

      stoneShapes.forEach((shapeGeo, sIdx) => {
        const count = 90;
        const ts = rockTexSets[sIdx % rockTexSets.length];
        const gravelMat = new THREE.MeshStandardMaterial({
          map: ts.map,
          normalMap: ts.normalMap,
          normalScale: new THREE.Vector2(1.05, 1.05),
          roughnessMap: ts.roughnessMap,
          roughness: 0.86,
          metalness: 0.02,
          vertexColors: true,
          envMapIntensity: 0.22,
        });

        const inst = new THREE.InstancedMesh(shapeGeo, gravelMat, count);
        inst.receiveShadow = true;
        inst.castShadow = true;

        const dummy = new THREE.Object3D();
        const color = new THREE.Color();

        for (let i = 0; i < count; i++) {
          let sx, sz, scaleBase;
          if (i < 74) {
            // Tập trung tự nhiên thành từng bãi sỏi quanh chân đá lớn & gỗ lũa
            const cc = clusterCenters[(i + sIdx * 2) % clusterCenters.length];
            const ang = Math.random() * Math.PI * 2;
            const rad = 0.45 + Math.pow(Math.random(), 0.72) * 3.1;
            sx = cc[0] + Math.cos(ang) * rad;
            sz = cc[1] + Math.sin(ang) * rad;
            scaleBase = 0.55 + Math.pow(Math.random(), 1.4) * 1.55;
          } else {
            // Ít viên sỏi nhỏ lún sâu rải rất thưa ngoài lòng bùn cho tự nhiên (không rối mắt)
            sx = (Math.random() - 0.5) * 13 - 0.8;
            sz = (Math.random() - 0.5) * 9 - 0.5;
            scaleBase = 0.42 + Math.random() * 0.65;
          }
          const sy = floorHeightAt(sx, sz) + 0.018 * scaleBase;
          dummy.position.set(sx, sy, sz);
          dummy.scale.set(
            scaleBase * (0.82 + Math.random() * 0.58),
            scaleBase * (0.62 + Math.random() * 0.52),
            scaleBase * (0.78 + Math.random() * 0.56)
          );
          dummy.rotation.set((Math.random() - 0.5) * 0.45, Math.random() * Math.PI * 2, (Math.random() - 0.5) * 0.45);
          dummy.updateMatrix();
          inst.setMatrixAt(i, dummy.matrix);

          color.setHex(stoneShades[(i + sIdx * 3) % stoneShades.length]);
          color.offsetHSL(0, (Math.random() - 0.5) * 0.04, (Math.random() - 0.5) * 0.06);
          inst.setColorAt(i, color);
        }
        inst.instanceMatrix.needsUpdate = true;
        if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
        scene.add(inst);
      });
    })();

    // Các khối đá cuội lớn ở góc viền + thảm rêu nhung rậm ôm gờ đá
    const mossMat = new THREE.MeshStandardMaterial({
      map: rockTexSets[1].map,
      normalMap: rockTexSets[1].normalMap,
      normalScale: new THREE.Vector2(1.2, 1.2),
      color: 0x5c682c,
      roughness: 0.96,
      metalness: 0.0,
      envMapIntensity: 0.14,
    });
    const pebbleLayout = [
      [-6.8, -3.4, 1.45, 0.58], [-5.4, -4.1, 0.95, 0.42], [-7.6, -2.1, 0.85, 0.38],
      [-6.2,  3.1, 1.25, 0.50], [-4.9,  3.7, 0.78, 0.34],
      [-0.4, -5.6, 1.55, 0.62], [ 1.1, -5.9, 1.02, 0.44],
      [ 5.4, -4.0, 1.35, 0.54], [ 6.4, -3.1, 0.82, 0.36],
    ];
    pebbleLayout.forEach(([px, pz, r, h], idx) => {
      const m = new THREE.Mesh(boulderGeos[idx % boulderGeos.length], pebbleMats[idx % pebbleMats.length]);
      const groundY = floorHeightAt(px, pz);
      m.position.set(px, groundY + h * 0.24, pz);
      m.scale.set(r * (0.92 + (idx % 3) * 0.1), h, r * (0.85 + ((idx + 1) % 3) * 0.1));
      m.rotation.set(0.05, idx * 1.35, 0.04);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);

      // Thảm rêu bám tự nhiên trên mảng đỉnh đá lớn
      if (r >= 1.2) {
        const moss = new THREE.Mesh(boulderGeos[(idx + 1) % boulderGeos.length], mossMat);
        moss.position.set(px - r * 0.18, groundY + h * 0.56, pz + r * 0.12);
        moss.scale.set(r * 0.56, h * 0.26, r * 0.50);
        moss.receiveShadow = true;
        scene.add(moss);
      }
    });

    // Cành gỗ lũa trầm tích 3D có vân thớ gỗ dọc + Normal Map rãnh vỏ gỗ phủ rêu
    (function buildSunkenDriftwood() {
      const ws = 512;
      const wCv = document.createElement('canvas'); wCv.width = ws; wCv.height = ws;
      const wg = wCv.getContext('2d');
      const wHv = document.createElement('canvas'); wHv.width = ws; wHv.height = ws;
      const wh = wHv.getContext('2d');
      wg.fillStyle = '#38301c'; wg.fillRect(0, 0, ws, ws);
      wh.fillStyle = '#7a7a7a'; wh.fillRect(0, 0, ws, ws);
      for (let i = 0; i < 95; i++) {
        const y = (i / 95) * ws;
        wg.strokeStyle = i % 3 === 0 ? 'rgba(24, 20, 11, 0.55)' : (i % 5 === 0 ? 'rgba(72, 76, 32, 0.40)' : 'rgba(78, 66, 40, 0.35)');
        wg.lineWidth = 2 + Math.random() * 5;
        wh.strokeStyle = i % 2 === 0 ? 'rgba(32, 32, 32, 0.65)' : 'rgba(185, 185, 185, 0.45)';
        wh.lineWidth = wg.lineWidth;
        wg.beginPath(); wh.beginPath();
        wg.moveTo(0, y); wh.moveTo(0, y);
        const midY = y + (Math.random() - 0.5) * 18;
        wg.quadraticCurveTo(ws * 0.5, midY, ws, y);
        wh.quadraticCurveTo(ws * 0.5, midY, ws, y);
        wg.stroke(); wh.stroke();
      }
      const woodMap = new THREE.CanvasTexture(wCv);
      woodMap.encoding = THREE.sRGBEncoding;
      woodMap.wrapS = woodMap.wrapT = THREE.RepeatWrapping;
      woodMap.repeat.set(3, 1);
      const woodNormal = heightCanvasToNormalTexture(wHv, 2.4, true);
      woodNormal.wrapS = woodNormal.wrapT = THREE.RepeatWrapping;
      woodNormal.repeat.set(3, 1);

      const woodMat = new THREE.MeshStandardMaterial({
        map: woodMap,
        normalMap: woodNormal,
        normalScale: new THREE.Vector2(1.1, 1.1),
        roughness: 0.93,
        metalness: 0.0,
        envMapIntensity: 0.16,
      });
      const mainCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-5.2, floorHeightAt(-5.2, -3.9) + 0.05, -3.9),
        new THREE.Vector3(-3.8, floorHeightAt(-3.8, -4.5) + 0.26, -4.5),
        new THREE.Vector3(-2.4, floorHeightAt(-2.4, -4.8) + 0.14, -4.8),
        new THREE.Vector3(-1.3, floorHeightAt(-1.3, -4.3) - 0.04, -4.3),
      ]);
      const trunk = new THREE.Mesh(new THREE.TubeGeometry(mainCurve, 28, 0.20, 10, false), woodMat);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      scene.add(trunk);

      const forkCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-3.6, floorHeightAt(-3.6, -4.4) + 0.24, -4.4),
        new THREE.Vector3(-3.0, floorHeightAt(-3.0, -3.6) + 0.34, -3.6),
        new THREE.Vector3(-2.5, floorHeightAt(-2.5, -3.2) + 0.22, -3.2),
      ]);
      const fork = new THREE.Mesh(new THREE.TubeGeometry(forkCurve, 16, 0.10, 8, false), woodMat);
      fork.castShadow = true;
      fork.receiveShadow = true;
      scene.add(fork);
    })();

    // 6.3 Hệ thực vật thủy sinh dưới hồ chân thực (Cỏ hẹ nước có gân & viền lượn + Rong đuôi chồn tán lông vũ 3D!)
    const aquaticBlades = [];

    // Texture 256x512 cho lá cỏ thủy sinh (gốc nâu bùn -> thân xanh rêu lục trầm -> ngọn xanh ô-liu trong nắng + gân dọc Normal Map)
    function createAquaticGrassTextures(variant = 0) {
      const w = 256, h = 512;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      const hv = document.createElement('canvas'); hv.width = w; hv.height = h;
      const hCtx = hv.getContext('2d');

      const gr = g.createLinearGradient(0, h, 0, 0);
      if (variant === 0) {
        gr.addColorStop(0.0,  '#242612'); // gốc chìm bùn nâu tối
        gr.addColorStop(0.25, '#2d441d'); // xanh rêu đậm
        gr.addColorStop(0.70, '#446028'); // xanh ô-liu thủy sinh tự nhiên
        gr.addColorStop(0.95, '#688038'); // ngọn lá hứng ánh sáng trong dịu
        gr.addColorStop(1.0,  '#7b8e42');
      } else {
        gr.addColorStop(0.0,  '#282814');
        gr.addColorStop(0.28, '#384f22');
        gr.addColorStop(0.74, '#546f2f');
        gr.addColorStop(0.95, '#7a8e42');
        gr.addColorStop(1.0,  '#8c994a');
      }
      g.fillStyle = gr; g.fillRect(0, 0, w, h);
      hCtx.fillStyle = '#747474'; hCtx.fillRect(0, 0, w, h);

      // Gân dọc song song & sống lá giữa nổi khối 3D
      for (let i = 0; i < 16; i++) {
        const x = (i / 15) * w;
        const isMid = Math.abs(x - w * 0.5) < 12;
        g.strokeStyle = isMid ? 'rgba(148, 168, 84, 0.42)' : (i % 2 === 0 ? 'rgba(26, 40, 14, 0.34)' : 'rgba(132, 152, 76, 0.22)');
        g.lineWidth = isMid ? 6 : 2.2;
        g.beginPath(); g.moveTo(x, h); g.lineTo(x, 0); g.stroke();

        hCtx.strokeStyle = isMid ? '#e2e2e2' : (i % 2 === 0 ? '#525252' : '#9c9c9c');
        hCtx.lineWidth = isMid ? 7 : 2.5;
        hCtx.beginPath(); hCtx.moveTo(x, h); hCtx.lineTo(x, 0); hCtx.stroke();
      }
      // Chấm phù sa & rêu bám nhẹ ở phần gốc lá
      for (let i = 0; i < 180; i++) {
        const x = Math.random() * w, y = h * (0.35 + Math.random() * 0.65);
        g.fillStyle = 'rgba(54, 48, 22, 0.34)';
        g.beginPath(); g.ellipse(x, y, 2 + Math.random() * 5, 4 + Math.random() * 10, 0, 0, Math.PI * 2); g.fill();
      }
      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.anisotropy = maxAniso;
      const normalMap = heightCanvasToNormalTexture(hv, 2.0, false);
      return { map, normalMap };
    }

    // Texture 512x512 alpha-cutout cho Rong đuôi chồn (Hornwort) tán lá kim lông vũ cực thật
    function createHornwortTexture() {
      const w = 512, h = 512;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      g.clearRect(0, 0, w, h);

      // Thân chính mảnh uốn nhẹ ở giữa
      const stemGrad = g.createLinearGradient(0, h, 0, 0);
      stemGrad.addColorStop(0.0, '#2a2e16');
      stemGrad.addColorStop(0.5, '#3f5924');
      stemGrad.addColorStop(1.0, '#6a8238');
      g.strokeStyle = stemGrad;
      g.lineWidth = 7;
      g.lineCap = 'round';
      g.beginPath();
      g.moveTo(w * 0.5, h);
      g.quadraticCurveTo(w * 0.48, h * 0.5, w * 0.51, 24);
      g.stroke();

      // 20 tầng vòng lá kim lông vũ (whorls) mọc tỏa dọc thân rong đuôi chồn
      for (let tier = 0; tier < 20; tier++) {
        const frac = tier / 19; // 0 = gốc, 1 = ngọn
        const y = h - 24 - frac * (h - 52);
        const cx = w * 0.5 + Math.sin(frac * 3.14) * -6;
        const spread = (42 + Math.sin(Math.pow(frac, 0.72) * Math.PI) * 145) * (0.85 + (tier % 3) * 0.08);
        const needles = 14;
        for (let k = 0; k < needles; k++) {
          const side = k % 2 === 0 ? 1 : -1;
          const idx = Math.floor(k / 2) / (needles / 2);
          const ang = side * (0.18 + idx * 1.15);
          const len = spread * (0.52 + 0.52 * Math.sin(idx * Math.PI * 0.85 + 0.3));
          const ex = cx + Math.sin(ang) * len;
          const ey = y - Math.cos(ang) * len * 0.48 - 10;
          const midX = (cx + ex) * 0.5;
          const midY = (y + ey) * 0.5 - 6;

          const greenTone = frac > 0.72 ? 'rgba(112, 138, 56, 0.94)' : (tier % 2 === 0 ? 'rgba(66, 94, 38, 0.94)' : 'rgba(50, 74, 30, 0.92)');
          g.strokeStyle = greenTone;
          g.lineWidth = 3.2 - frac * 1.1;
          g.beginPath(); g.moveTo(cx, y); g.quadraticCurveTo(midX, midY, ex, ey); g.stroke();

          // Chẻ nhánh kim phụ cực mảnh đặc trưng của rong đuôi chồn
          g.lineWidth = 1.6;
          for (const forkAng of [-0.32, 0.32]) {
            g.beginPath();
            g.moveTo(midX, midY);
            g.lineTo(midX + Math.sin(ang + forkAng) * len * 0.45, midY - Math.cos(ang + forkAng) * len * 0.28);
            g.stroke();
          }
        }
      }
      const tex = new THREE.CanvasTexture(cv);
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = maxAniso;
      return tex;
    }

    const grassTexA = createAquaticGrassTextures(0);
    const grassTexB = createAquaticGrassTextures(1);
    const weedMatA = new THREE.MeshStandardMaterial({
      map: grassTexA.map, normalMap: grassTexA.normalMap, normalScale: new THREE.Vector2(0.85, 0.85),
      roughness: 0.78, metalness: 0.0, envMapIntensity: 0.24, side: THREE.DoubleSide,
    });
    const weedMatB = new THREE.MeshStandardMaterial({
      map: grassTexB.map, normalMap: grassTexB.normalMap, normalScale: new THREE.Vector2(0.85, 0.85),
      roughness: 0.76, metalness: 0.0, envMapIntensity: 0.24, side: THREE.DoubleSide,
    });
    const hornwortMat = new THREE.MeshStandardMaterial({
      map: createHornwortTexture(),
      transparent: true,
      alphaTest: 0.22,
      roughness: 0.82,
      metalness: 0.0,
      envMapIntensity: 0.20,
      side: THREE.DoubleSide,
    });

    // Cụm cỏ hẹ nước nhiều tầng (lá dài uốn cong ngoài + chồi ngắn bên trong, mép lá lượn sóng mềm)
    function addAquaticCluster(cx, cz, bladeCount, maxH) {
      const groundY = floorHeightAt(cx, cz) - 0.08;
      for (let i = 0; i < bladeCount; i++) {
        const isShort = i >= bladeCount * 0.65;
        const h = maxH * (isShort ? (0.38 + Math.random() * 0.28) : (0.68 + Math.random() * 0.38));
        const w = (isShort ? 0.11 : 0.16) + Math.random() * 0.07;
        const geo = new THREE.PlaneGeometry(w, h, 3, 14);
        geo.translate(0, h / 2, 0);
        const pos = geo.attributes.position;
        const archDir = (Math.random() - 0.5) * 0.55;
        const twistSeed = Math.random() * 6.28;
        for (let k = 0; k < pos.count; k++) {
          const bx = pos.getX(k);
          const by = pos.getY(k);
          const yFrac = by / h;
          // Dáng lá hẹ thuôn nhọn đầu + gợn mép lá tự nhiên + hơi uốn cong rũ nhẹ
          const widthProfile = Math.sin(Math.pow(yFrac, 0.72) * Math.PI);
          const edgeRuffle = Math.sin(yFrac * 15.0 + twistSeed) * 0.022 * Math.abs(bx / (w * 0.5 + 0.001));
          const xNew = bx * (0.20 + 0.94 * widthProfile);
          const zCurve = archDir * yFrac * yFrac + edgeRuffle;
          pos.setXYZ(k, xNew, by, zCurve);
        }
        geo.computeVertexNormals();
        geo.userData.basePos = new Float32Array(pos.array);

        const mesh = new THREE.Mesh(geo, i % 2 === 0 ? weedMatA : weedMatB);
        const ang = (i / bladeCount) * Math.PI * 2 + Math.random() * 0.5;
        const dist = Math.random() * 0.62;
        mesh.position.set(cx + Math.cos(ang) * dist, groundY, cz + Math.sin(ang) * dist);
        mesh.rotation.y = Math.random() * Math.PI * 2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        aquaticBlades.push({ mesh, h, phase: Math.random() * Math.PI * 2, sway: 0.26 + Math.random() * 0.20 });
      }
    }

    // Cụm Rong đuôi chồn 3D dạng chữ thập (2 mặt phẳng giao nhau tạo tán tròn đầy từ mọi góc nhìn!)
    function addHornwortCluster(cx, cz, stemCount, maxH) {
      const groundY = floorHeightAt(cx, cz) - 0.06;
      for (let i = 0; i < stemCount; i++) {
        const h = maxH * (0.58 + Math.random() * 0.45);
        const w = 0.68 + Math.random() * 0.28;
        const ang = (i / stemCount) * Math.PI * 2 + Math.random() * 0.6;
        const dist = 0.1 + Math.random() * 0.55;
        const sx = cx + Math.cos(ang) * dist;
        const sz = cz + Math.sin(ang) * dist;
        const ph = Math.random() * Math.PI * 2;
        const sw = 0.24 + Math.random() * 0.16;
        const baseRot = Math.random() * Math.PI;

        for (let planeIdx = 0; planeIdx < 2; planeIdx++) {
          const geo = new THREE.PlaneGeometry(w, h, 2, 12);
          geo.translate(0, h / 2, 0);
          geo.userData.basePos = new Float32Array(geo.attributes.position.array);
          const mesh = new THREE.Mesh(geo, hornwortMat);
          mesh.position.set(sx, groundY, sz);
          mesh.rotation.y = baseRot + planeIdx * (Math.PI * 0.5);
          mesh.castShadow = true;
          scene.add(mesh);
          aquaticBlades.push({ mesh, h, phase: ph, sway: sw });
        }
      }
    }

    // Bố trí hài hòa 5 bụi cỏ hẹ nước + 4 khóm rong đuôi chồn nép tự nhiên bên đá rìa hồ & cành gỗ lũa
    addAquaticCluster(-6.5, -3.1, 11, 2.5);
    addAquaticCluster(-5.4,  3.1,  9, 2.1);
    addAquaticCluster(-0.2, -5.4, 12, 2.7);
    addAquaticCluster( 5.3, -3.8, 10, 2.3);
    addAquaticCluster(-3.4, -4.4,  8, 2.0);

    addHornwortCluster(-5.8, -3.8, 4, 2.3);
    addHornwortCluster(-2.4, -4.7, 4, 2.2);
    addHornwortCluster( 1.0, -5.6, 3, 2.4);
    addHornwortCluster( 6.0, -3.2, 3, 2.0);

    // 6.4 3 luồng nắng xuyên nước dịu nhẹ (không chói, không rối)
    const sunBeams = [];
    function createBeamTexture() {
      const cv = document.createElement('canvas');
      cv.width = 128; cv.height = 512;
      const g = cv.getContext('2d');
      const gx = g.createLinearGradient(0, 0, 128, 0);
      gx.addColorStop(0.0, 'rgba(255, 253, 240, 0)');
      gx.addColorStop(0.5, 'rgba(255, 253, 240, 1)');
      gx.addColorStop(1.0, 'rgba(255, 253, 240, 0)');
      g.fillStyle = gx;
      g.fillRect(0, 0, 128, 512);
      g.globalCompositeOperation = 'destination-in';
      const gy = g.createLinearGradient(0, 0, 0, 512);
      gy.addColorStop(0.0, 'rgba(255,255,255,0)');
      gy.addColorStop(0.22, 'rgba(255,255,255,0.85)');
      gy.addColorStop(0.78, 'rgba(255,255,255,0.35)');
      gy.addColorStop(1.0, 'rgba(255,255,255,0)');
      g.fillStyle = gy;
      g.fillRect(0, 0, 128, 512);
      return new THREE.CanvasTexture(cv);
    }
    const beamTex = createBeamTexture();
    [
      { x: -4.2, z: -2.0, w: 3.2, h: 11, op: 0.085, ph: 0.2 },
      { x: -1.4, z: -3.0, w: 4.0, h: 12, op: 0.095, ph: 1.8 },
      { x:  1.4, z: -3.6, w: 2.8, h: 11, op: 0.070, ph: 3.4 },
    ].forEach((bm) => {
      const mat = new THREE.MeshBasicMaterial({
        map: beamTex,
        color: 0xdaf8ff,
        transparent: true,
        opacity: bm.op,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(bm.w, bm.h), mat);
      mesh.position.set(bm.x, 0.9, bm.z);
      mesh.rotation.z = -0.34;
      mesh.rotation.y = 0.22;
      scene.add(mesh);
      sunBeams.push({ mesh, baseOp: bm.op, phase: bm.ph });
    });

    // 6.5 Mặt nước Shader GLSL siêu chi tiết:
    // - Sóng Gerstner/Stokes 3D đa tầng (lưới 120x96) có đỉnh sắc & đáy trũng tự nhiên
    // - Sóng lăn tăn mao dẫn (capillary micro-ripples) bị gió đẩy + domain warping không lặp
    // - 16 cụm sóng vòng đồng tâm vật lý trực tiếp trên GPU (chuột, click, cánh sen, cá trồi)
    // - Rẽ sóng theo lưng cá Koi (Koi wake) & vòng gợn lăn tăn quanh mép lá sen
    // - Quang học Schlick Fresnel + tán xạ ngầm xanh biển (SSS) + tia nắng lấp lánh 2 tầng
    const MAX_GPU_RIPPLES = 16;
    const MAX_LOTUS_RINGS = 8;
    const gpuRipples = Array.from({ length: MAX_GPU_RIPPLES }, () => new THREE.Vector4(0, 0, -999, 0));
    // (maxRadius, speed, freq, decay) cho từng cụm sóng -> gợn chuột cực gọn tinh tế, cá & click lan tự nhiên
    const gpuRippleMeta = Array.from({ length: MAX_GPU_RIPPLES }, () => new THREE.Vector4(0.45, 0.75, 26.0, 3.0));
    const gpuLotusPads = Array.from({ length: MAX_LOTUS_RINGS }, () => new THREE.Vector3(999, 999, 0));
    const gpuKoiWakes = [
      new THREE.Vector4(999, 999, 0, 0),
      new THREE.Vector4(999, 999, 0, 0),
      new THREE.Vector4(999, 999, 0, 0),
      new THREE.Vector4(999, 999, 0, 0),
    ];
    let gpuLotusCount = 0;
    let simTime = 0;

    const waterUniforms = {
      uTime: { value: 0 },
      uSunDir: { value: new THREE.Vector3(-0.35, 0.85, 0.42).normalize() },
      uRipples: { value: gpuRipples },
      uRippleMeta: { value: gpuRippleMeta },
      uLotusPads: { value: gpuLotusPads },
      uKoiWakes: { value: gpuKoiWakes },
    };

    // Hàm tính độ cao sóng chính trên CPU (đồng bộ với vertex shader để lá sen nhấp nhô đúng nhịp sóng)
    function sampleMainWaveY(x, z, t) {
      return (
        Math.sin(x * 0.62 + z * 0.28 + t * 1.35) * 0.042 +
        Math.sin(-x * 0.48 + z * 0.78 - t * 1.12) * 0.034 +
        Math.sin(x * 1.18 - z * 0.86 + t * 1.78) * 0.018 +
        Math.cos(x * 0.92 + z * 1.32 - t * 1.54) * 0.014
      );
    }

    const waterGeo = new THREE.PlaneGeometry(54, 44, 120, 96);
    waterGeo.rotateX(-Math.PI / 2);
    const waterMat = new THREE.ShaderMaterial({
      uniforms: waterUniforms,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      vertexShader: `
        uniform float uTime;
        uniform vec4 uRipples[16];
        uniform vec4 uRippleMeta[16];
        varying vec3 vWorldPos;
        varying float vWaveCrest;

        void main() {
          vec3 p = position;
          float t = uTime;

          // 4 lớp sóng Gerstner/Stokes tạo mặt nước nổi khối 3D thật (đỉnh gọn, thung lũng êm)
          float ph1 = p.x * 0.62 + p.z * 0.28 + t * 1.35;
          float ph2 = -p.x * 0.48 + p.z * 0.78 - t * 1.12;
          float ph3 = p.x * 1.18 - p.z * 0.86 + t * 1.78;
          float ph4 = p.x * 0.92 + p.z * 1.32 - t * 1.54;

          float h = 0.0;
          h += (sin(ph1) + 0.20 * sin(2.0 * ph1 - 0.3)) * 0.042;
          h += (sin(ph2) + 0.18 * sin(2.0 * ph2 - 0.2)) * 0.034;
          h += sin(ph3) * 0.018;
          h += cos(ph4) * 0.014;

          // Độ đẩy ngang nhẹ đặc trưng của sóng Gerstner
          p.x += cos(ph1) * 0.022 - cos(ph2) * 0.016;
          p.z += cos(ph1) * 0.010 + cos(ph2) * 0.022;

          // Nâng mặt lưới 3D cho các sóng lớn (cá trồi/click), còn gợn chuột nhỏ xử lý siêu mịn per-pixel
          float rippleLift = 0.0;
          for (int i = 0; i < 16; i++) {
            vec4 rp = uRipples[i];
            vec4 rm = uRippleMeta[i];
            float age = t - rp.z;
            float maxR = rm.x;
            if (age > 0.0 && age < 4.2 && rp.w > 0.001 && maxR > 0.65) {
              float dist = length(p.xz - rp.xy);
              if (dist < maxR) {
                float diff = dist - age * rm.y;
                float invR = 1.0 / max(maxR, 0.3);
                float radFade = smoothstep(maxR, maxR * 0.30, dist);
                float env = exp(-diff * diff * (2.6 * invR * invR)) * exp(-age * rm.w) * smoothstep(0.0, 0.08, age) * radFade;
                rippleLift += sin(diff * rm.z) * env * rp.w * 0.038 * smoothstep(0.65, 1.25, maxR);
              }
            }
          }

          p.y += h + rippleLift;
          vWaveCrest = clamp((h + rippleLift) * 8.5 + 0.42, 0.0, 1.0);

          vec4 wp = modelMatrix * vec4(p, 1.0);
          vWorldPos = wp.xyz;
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform vec3 uSunDir;
        uniform vec4 uRipples[16];
        uniform vec4 uRippleMeta[16];
        uniform vec3 uLotusPads[8];
        uniform vec4 uKoiWakes[4];
        varying vec3 vWorldPos;
        varying float vWaveCrest;

        // Sóng Stokes bậc 2 (đỉnh sắc nét hơn, trũng rộng hơn) + đạo hàm giải tích chính xác
        void addStokesWave(vec2 p, vec2 dir, float freq, float speed, float amp, float steep, float t, inout vec2 grad, inout float h) {
          float phi = dot(p, dir) * freq + t * speed;
          float s1 = sin(phi);
          float c1 = cos(phi);
          float s2 = sin(2.0 * phi - 0.32);
          float c2 = cos(2.0 * phi - 0.32);
          h += amp * (s1 + steep * s2);
          float dphi = amp * freq * (c1 + 2.0 * steep * c2);
          grad += dir * dphi;
        }

        void main() {
          vec2 p = vWorldPos.xz;
          float t = uTime;

          vec2 grad = vec2(0.0);
          float h = 0.0;

          // Tầng 1: Sóng gió chính đa hướng (4 hướng lệch góc phi đối xứng -> không lặp ô lưới)
          addStokesWave(p, normalize(vec2( 0.91,  0.41)), 0.62,  1.35, 0.042, 0.22, t, grad, h);
          addStokesWave(p, normalize(vec2(-0.52,  0.85)), 0.88, -1.12, 0.034, 0.20, t, grad, h);
          addStokesWave(p, normalize(vec2( 0.81, -0.59)), 1.42,  1.78, 0.020, 0.18, t, grad, h);
          addStokesWave(p, normalize(vec2(-0.34, -0.94)), 1.95,  1.52, 0.015, 0.15, t, grad, h);

          // Domain warping: uốn nhẹ tọa độ theo độ dốc sóng lớn để sóng nhỏ tự nhiên như ngoài đời thật
          vec2 pw = p + grad * 0.45;

          // Tầng 2: Sóng gợn trung bình cắt chéo tạo ánh sáng lấp lánh sống động
          addStokesWave(pw, normalize(vec2( 0.64,  0.77)), 2.95,  2.25, 0.0095, 0.14, t, grad, h);
          addStokesWave(pw, normalize(vec2(-0.88,  0.47)), 3.70, -2.55, 0.0072, 0.12, t, grad, h);
          addStokesWave(pw, normalize(vec2( 0.23, -0.97)), 4.85,  2.90, 0.0052, 0.10, t, grad, h);

          // Tầng 3: Sóng mao dẫn cực mịn (capillary wind ripples) làm mặt nước sắc nét ở cự ly gần
          vec2 pc = pw + vec2(sin(p.y * 1.1 + t * 0.6), cos(p.x * 1.1 - t * 0.5)) * 0.18;
          addStokesWave(pc, normalize(vec2( 0.95, -0.31)), 7.20,  3.60, 0.0028, 0.08, t, grad, h);
          addStokesWave(pc, normalize(vec2(-0.46, -0.89)), 9.60, -4.10, 0.0020, 0.06, t, grad, h);
          addStokesWave(pc, normalize(vec2( 0.72,  0.69)), 13.4,  4.85, 0.0012, 0.04, t, grad, h);

          // Tầng 4: 16 cụm sóng vòng đồng tâm 3D thật (gợn chuột nhỏ gọn chỉ lớn hơn trỏ chuột chút xíu!)
          float rippleCrest = 0.0;
          for (int i = 0; i < 16; i++) {
            vec4 rp = uRipples[i];
            vec4 rm = uRippleMeta[i];
            float age = t - rp.z;
            float maxR = rm.x;
            if (age > 0.0 && age < 4.2 && rp.w > 0.001) {
              vec2 d = p - rp.xy;
              float dist = length(d) + 0.0005;
              if (dist < maxR) {
                float front = age * rm.y;
                float diff = dist - front;
                float invR = 1.0 / max(maxR, 0.25);
                float packetK = 2.6 * invR * invR;
                float radFade = smoothstep(maxR, maxR * 0.30, dist);
                float env = exp(-diff * diff * packetK) * exp(-age * rm.w) * smoothstep(0.0, 0.055, age) * radFade;
                float freq = rm.z;
                float ph = diff * freq;
                float s = sin(ph);
                float c = cos(ph);
                // Biên độ gợn sóng tỷ lệ mượt theo kích thước sóng
                float ampScale = 0.016 + 0.014 * smoothstep(0.35, 1.4, maxR);
                float dhdr = rp.w * env * (c * freq - s * (2.0 * packetK * diff)) * ampScale * 0.55;
                grad += (d / dist) * dhdr;
                rippleCrest += rp.w * env * max(s, 0.0) * (0.65 + 0.35 * smoothstep(0.35, 1.4, maxR));
              }
            }
          }

          // Tầng 5: Vệt sóng rẽ nước quanh thân & đuôi cá Koi khi bơi sát mặt nước
          for (int k = 0; k < 4; k++) {
            vec4 kw = uKoiWakes[k];
            if (kw.z > 0.01) {
              vec2 d = p - kw.xy;
              float dist = length(d) + 0.001;
              if (dist < 3.4) {
                float wEnv = exp(-dist * 1.35) * kw.z;
                float wPh = dist * 9.5 - t * 7.2;
                float dh = (cos(wPh) * 9.5 - sin(wPh) * 1.35) * wEnv * 0.016;
                grad += (d / dist) * dh;
                rippleCrest += wEnv * max(sin(wPh), 0.0) * 0.42;
              }
            }
          }

          // Tầng 6: Gợn sóng mao dẫn êm ái vỗ quanh viền các lá sen nổi
          float meniscus = 0.0;
          for (int j = 0; j < 8; j++) {
            vec3 lp = uLotusPads[j];
            if (lp.z > 0.05) {
              vec2 d = p - lp.xy;
              float dist = length(d) + 0.001;
              float ring = dist - lp.z;
              if (ring > -0.05 && ring < 1.35) {
                float mask = smoothstep(-0.05, 0.08, ring) * exp(-max(ring, 0.0) * 2.75);
                float ph = ring * 13.5 - t * 2.35;
                grad += (d / dist) * (cos(ph) * mask * 0.065);
                meniscus += smoothstep(0.18, 0.0, abs(ring)) * 0.25;
              }
            }
          }

          // Pháp tuyến 3D độ sắc nét cao từ tổng độ dốc tất cả các tầng sóng
          vec3 N = normalize(vec3(-grad.x * 1.38, 1.0, -grad.y * 1.38));
          vec3 V = normalize(cameraPosition - vWorldPos);
          vec3 R = reflect(-V, N);

          // Hiệu ứng Schlick Fresnel chuẩn vật lý (F0 = 0.02 cho nước tinh khiết)
          float NdotV = max(dot(N, V), 0.0);
          float fresnel = 0.02 + 0.98 * pow(1.0 - NdotV, 4.2);

          // Phản chiếu vòm trời tự nhiên dịu nhẹ theo góc nhìn Fresnel (nhìn xuống thấy rõ đáy bùn rêu thật!)
          float skyPitch = clamp(R.y * 1.25, 0.0, 1.0);
          vec3 horizonCol = vec3(0.84, 0.92, 0.90);
          vec3 zenithCol  = vec3(0.42, 0.66, 0.78);
          vec3 skyReflect = mix(horizonCol, zenithCol, pow(skyPitch, 0.72));

          // Làn nước ao tự nhiên trong vắt ánh rêu dịu (không phủ màn xanh nhựa lên đáy bùn!)
          vec3 deepWater  = vec3(0.28, 0.33, 0.17);
          vec3 crestTint  = vec3(0.50, 0.58, 0.34);
          float sssFactor = pow(clamp(dot(V, -uSunDir + N * 0.45), 0.0, 1.0), 3.0) * (0.45 + 0.55 * vWaveCrest);
          vec3 waterTint  = mix(deepWater, crestTint, clamp(sssFactor * 0.85 + vWaveCrest * 0.22, 0.0, 0.88));

          vec3 col = mix(waterTint, skyReflect, clamp(fresnel * 1.15, 0.0, 0.88));

          // Ánh nắng lấp lánh 2 tầng trên đỉnh từng con sóng & từng vòng gợn chuột
          vec3 H = normalize(uSunDir + V);
          float NdotH = max(dot(N, H), 0.0);
          float specBroad   = pow(NdotH, 46.0) * 0.20;
          float specCrisp   = pow(NdotH, 240.0) * 1.15;
          float specDiamond = pow(NdotH, 680.0) * 2.05;
          float totalSpec = specBroad + specCrisp + specDiamond;
          col += vec3(1.0, 0.99, 0.90) * totalSpec;

          // Viền ánh sáng trong suốt mảnh trên đỉnh vòng sóng tương tác & mép lá sen
          float crestSheen = clamp(rippleCrest * 0.32 + meniscus * 0.22, 0.0, 0.50);
          col += vec3(0.92, 0.96, 0.86) * crestSheen;

          // Giữ mặt nước trong vắt để lộ trọn nền đáy bùn rêu tự nhiên & bóng cá Koi đổ sắc nét dưới đáy
          float edgeFade = smoothstep(26.5, 9.5, length(vWorldPos.xz));
          float slopeReveal = clamp(length(grad) * 0.24, 0.0, 0.20);
          float alpha = clamp((0.06 + fresnel * 0.44 + slopeReveal + crestSheen * 0.48 + totalSpec * 0.42) * edgeFade, 0.0, 0.82);
          gl_FragColor = vec4(col, alpha);
        }
      `,
    });
    const waterSurface = new THREE.Mesh(waterGeo, waterMat);
    waterSurface.position.y = WATER_Y;
    scene.add(waterSurface);

    // 6.6 Texture lá sen 1024px & cuống sen chân thực (xanh lục phủ phấn sáp lì tự nhiên, gân nổi Normal Map Sobel, mép lá có nét phong hóa nhẹ)
    function createLotusPadTextures(variant = 0) {
      const s = 1024;
      const cv = document.createElement('canvas'); cv.width = s; cv.height = s;
      const g = cv.getContext('2d');
      const hv = document.createElement('canvas'); hv.width = s; hv.height = s;
      const hCtx = hv.getContext('2d');
      const cx = s / 2, cy = s / 2;

      hCtx.fillStyle = '#707070';
      hCtx.fillRect(0, 0, s, s);

      // Tạo đường viền lá sen lượn sóng hữu cơ + khe xẻ chữ V đặc trưng
      function traceLeafPath(ctx2d, scaleR = 1.0) {
        ctx2d.beginPath();
        const steps = 110;
        for (let i = 0; i <= steps; i++) {
          const a = 0.12 + (i / steps) * (Math.PI * 2 - 0.24);
          const wave = Math.sin(a * 13 + variant * 1.4) * 10 + Math.cos(a * 7 - variant) * 8 + Math.sin(a * 21) * 4;
          const r = (464 + wave) * scaleR;
          const px = cx + Math.cos(a) * r;
          const py = cy + Math.sin(a) * r;
          if (i === 0) ctx2d.moveTo(cx, cy);
          ctx2d.lineTo(px, py);
        }
        ctx2d.closePath();
      }

      // 1. Màu xanh lục lá sen thật (lục trầm phủ phấn sáp mờ, KHÔNG chói xanh neon!)
      const gr = g.createRadialGradient(cx - 28, cy - 28, 18, cx, cy, 480);
      if (variant === 0) {
        gr.addColorStop(0.0,  '#788642'); // quanh rốn lá ánh vàng-lục ấm dịu
        gr.addColorStop(0.14, '#4b6335'); // lục lá sen trưởng thành
        gr.addColorStop(0.55, '#39522a'); // xanh lục đậm phủ phấn sáp
        gr.addColorStop(0.88, '#2b4220'); // viền ngoài trầm sâu
        gr.addColorStop(1.0,  '#455228'); // mép lá hơi ngả rêu ấm
      } else {
        gr.addColorStop(0.0,  '#849246');
        gr.addColorStop(0.16, '#58713a'); // lá non hơn một tông xanh ô-liu nắng
        gr.addColorStop(0.58, '#445d30');
        gr.addColorStop(0.89, '#324a24');
        gr.addColorStop(1.0,  '#525c2c');
      }
      g.save();
      traceLeafPath(g, 1.0);
      g.fillStyle = gr;
      g.fill();
      g.clip();

      // 2. Loang sắc diệp lục & lớp phấn sáp mờ tự nhiên (hiệu ứng lá sen Lotus Effect)
      const leafMottles = [
        'rgba(88, 108, 56, 0.26)',  // mảng xanh ô-liu đón nắng
        'rgba(52, 76, 48, 0.30)',   // phấn sáp xanh lục xám mờ
        'rgba(34, 56, 28, 0.28)',   // mảng diệp lục đậm
        'rgba(104, 108, 52, 0.20)', // vùng hơi ngả vàng nhẹ tự nhiên
      ];
      for (let i = 0; i < 42; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 380;
        const x = cx + Math.cos(ang) * dist, y = cy + Math.sin(ang) * dist;
        const rx = 50 + Math.random() * 115, ry = 35 + Math.random() * 85;
        const mg = g.createRadialGradient(x, y, 4, x, y, rx);
        mg.addColorStop(0, leafMottles[i % leafMottles.length]);
        mg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = mg;
        g.beginPath(); g.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2); g.fill();
      }

      // Chấm phong hóa & chút viền nâu rêu cháy nắng tinh tế trên vài đoạn mép lá (chi tiết khiến lá nhìn 100% thật!)
      for (let i = 0; i < 12; i++) {
        const a = 0.3 + Math.random() * (Math.PI * 2 - 0.6);
        const r = 445 + Math.random() * 22;
        const wx = cx + Math.cos(a) * r, wy = cy + Math.sin(a) * r;
        const wg = g.createRadialGradient(wx, wy, 4, wx, wy, 36 + Math.random() * 32);
        wg.addColorStop(0, 'rgba(102, 80, 38, 0.42)');
        wg.addColorStop(0.6, 'rgba(84, 78, 34, 0.20)');
        wg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = wg;
        g.beginPath(); g.arc(wx, wy, 68, 0, Math.PI * 2); g.fill();
      }

      // 3. Hệ thống 20 gân chính tỏa tia, gân chẻ chữ Y & mạng gân phụ + nổi khối thật trên Sobel Normal Map
      const veinCount = 20;
      for (let i = 0; i < veinCount; i++) {
        const a = 0.20 + (i / (veinCount - 1)) * (Math.PI * 2 - 0.40);
        const wobble = (Math.random() - 0.5) * 0.03;
        const rMid = 305 + (i % 3) * 18;
        const rEnd = 456;
        const cpx = cx + Math.cos(a + wobble) * (rMid * 0.55);
        const cpy = cy + Math.sin(a + wobble) * (rMid * 0.55);
        const mx = cx + Math.cos(a) * rMid;
        const my = cy + Math.sin(a) * rMid;

        // Bóng chìm mảnh 2 bên gân tạo cảm giác gân nổi hữu cơ
        g.strokeStyle = 'rgba(24, 42, 18, 0.34)';
        g.lineWidth = 6.5;
        g.beginPath(); g.moveTo(cx, cy); g.quadraticCurveTo(cpx, cpy, mx, my); g.stroke();

        // Gân chính màu xanh ô-liu sáng dịu (không trắng lóa!)
        g.strokeStyle = 'rgba(148, 164, 86, 0.48)';
        g.lineWidth = 3.6;
        g.beginPath(); g.moveTo(cx, cy); g.quadraticCurveTo(cpx, cpy, mx, my); g.stroke();

        // Gờ nổi trên height map
        hCtx.strokeStyle = '#d4d4d4';
        hCtx.lineWidth = 5.5;
        hCtx.beginPath(); hCtx.moveTo(cx, cy); hCtx.quadraticCurveTo(cpx, cpy, mx, my); hCtx.stroke();

        // Chẻ nhánh chữ Y gần mép lá
        for (const dAng of [-0.085, 0.085]) {
          const ex = cx + Math.cos(a + dAng) * rEnd;
          const ey = cy + Math.sin(a + dAng) * rEnd;
          g.strokeStyle = 'rgba(136, 152, 78, 0.36)';
          g.lineWidth = 2.0;
          g.beginPath(); g.moveTo(mx, my); g.lineTo(ex, ey); g.stroke();

          hCtx.strokeStyle = '#b6b6b6';
          hCtx.lineWidth = 3.0;
          hCtx.beginPath(); hCtx.moveTo(mx, my); hCtx.lineTo(ex, ey); hCtx.stroke();
        }

        // Gân phụ nối ngang mảnh giữa các tia gân (mạng lưới mô lá sen thật)
        const nextA = a + (Math.PI * 2 - 0.40) / (veinCount - 1);
        for (const ringR of [140, 235, 330, 405]) {
          g.strokeStyle = 'rgba(130, 146, 74, 0.16)';
          g.lineWidth = 1.2;
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * ringR, cy + Math.sin(a) * ringR);
          g.lineTo(cx + Math.cos(nextA) * ringR, cy + Math.sin(nextA) * ringR);
          g.stroke();
        }
      }

      // Chấm rốn lá sen ở tâm (màu vàng rêu trầm tự nhiên + bóng lõm nhẹ)
      const navel = g.createRadialGradient(cx, cy, 3, cx, cy, 24);
      navel.addColorStop(0.0, '#a6ad56');
      navel.addColorStop(0.55, '#7c8a40');
      navel.addColorStop(1.0, 'rgba(65, 86, 42, 0)');
      g.fillStyle = navel;
      g.beginPath(); g.arc(cx, cy, 24, 0, Math.PI * 2); g.fill();

      // Vi hạt bề mặt nhung sáp lá sen (chống trơn nhựa khi zoom gần!)
      const lImg = g.getImageData(0, 0, s, s);
      const ld = lImg.data;
      for (let i = 0; i < ld.length; i += 4) {
        if (ld[i + 3] > 20) {
          const n = (Math.random() - 0.5) * 11;
          ld[i]     = Math.max(0, Math.min(255, ld[i] + n * 0.9));
          ld[i + 1] = Math.max(0, Math.min(255, ld[i + 1] + n));
          ld[i + 2] = Math.max(0, Math.min(255, ld[i + 2] + n * 0.8));
        }
      }
      g.putImageData(lImg, 0, 0);
      g.restore();

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.anisotropy = maxAniso;

      const normalMap = heightCanvasToNormalTexture(hv, 1.9, false);
      normalMap.anisotropy = maxAniso;
      return { map, normalMap };
    }

    // Texture cuống sen thật (gốc ngập nước nâu rêu -> thân trên xanh lục trầm, có thớ dọc & gai nhỏ đặc trưng cuống sen)
    function createLotusStemTextures() {
      const w = 256, h = 512;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      const hv = document.createElement('canvas'); hv.width = w; hv.height = h;
      const hCtx = hv.getContext('2d');

      const sg = g.createLinearGradient(0, h, 0, 0);
      sg.addColorStop(0.0,  '#2d301a'); // gốc cắm bùn nâu rêu đậm
      sg.addColorStop(0.45, '#3b4d25'); // đoạn thân dưới nước xanh rêu sẫm
      sg.addColorStop(0.75, '#4c6330'); // đoạn vươn khỏi mặt nước xanh lục trầm tự nhiên
      sg.addColorStop(1.0,  '#5a7038'); // sát đài hoa/tán lá
      g.fillStyle = sg;
      g.fillRect(0, 0, w, h);

      hCtx.fillStyle = '#787878';
      hCtx.fillRect(0, 0, w, h);

      // Các sọc xơ dọc mảnh trên thân cuống sen
      for (let i = 0; i < 40; i++) {
        const x = (i / 40) * w;
        g.strokeStyle = i % 2 === 0 ? 'rgba(26, 40, 16, 0.28)' : 'rgba(132, 150, 78, 0.18)';
        g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
        hCtx.strokeStyle = i % 2 === 0 ? '#606060' : '#969696';
        hCtx.lineWidth = 2;
        hCtx.beginPath(); hCtx.moveTo(x, 0); hCtx.lineTo(x, h); hCtx.stroke();
      }
      // Các nốt gai li ti sẫm đặc trưng trên cuống sen thật
      for (let i = 0; i < 220; i++) {
        const x = Math.random() * w, y = Math.random() * h;
        g.fillStyle = 'rgba(38, 34, 18, 0.55)';
        g.beginPath(); g.arc(x, y, 1.4 + Math.random() * 1.4, 0, Math.PI * 2); g.fill();
        hCtx.fillStyle = '#dcdcdc';
        hCtx.beginPath(); hCtx.arc(x, y, 1.8, 0, Math.PI * 2); hCtx.fill();
      }

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.wrapS = THREE.RepeatWrapping;
      const normalMap = heightCanvasToNormalTexture(hv, 1.8, true);
      return { map, normalMap };
    }

    // Texture cánh hoa sen 512x1024 + Sobel Normal Map vân gân nổi (hồng sen thật chuyển sắc mịn, gân hồng đậm thanh mảnh & bề mặt nhung mịn)
    function createLotusPetalTextures(vibrant = true) {
      const w = 512, h = 1024;
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const g = cv.getContext('2d');
      const hv = document.createElement('canvas'); hv.width = w; hv.height = h;
      const hCtx = hv.getContext('2d');

      hCtx.fillStyle = '#787878';
      hCtx.fillRect(0, 0, w, h);

      // 1. Chuyển sắc cánh sen thực vật tự nhiên (gốc kem phớt lục -> thân trắng hồng sứ -> chóp hồng sen đằm thắm, KHÔNG sến nhựa!)
      const gr = g.createLinearGradient(0, h, 0, 0);
      if (vibrant) {
        gr.addColorStop(0.0,  '#eef0c6'); // gốc cánh hơi ánh vàng kem lục tự nhiên
        gr.addColorStop(0.14, '#fdf7ef'); // trắng ngà ấm
        gr.addColorStop(0.46, '#f9dce6'); // hồng phấn mỏng manh
        gr.addColorStop(0.76, '#e28aa9'); // hồng cánh sen tự nhiên
        gr.addColorStop(0.92, '#c84b7a'); // chóp hồng sen đằm rực rỡ
        gr.addColorStop(1.0,  '#9e2755'); // đỉnh nhọn sẫm mịn
      } else {
        gr.addColorStop(0.0,  '#f2f3d2');
        gr.addColorStop(0.18, '#fffaf4');
        gr.addColorStop(0.56, '#fce5ee');
        gr.addColorStop(0.84, '#ea9eb9');
        gr.addColorStop(1.0,  '#cc5682');
      }
      g.fillStyle = gr;
      g.fillRect(0, 0, w, h);

      // Độ ửng đậm tập trung mềm mại ở vùng đỉnh nhọn cánh hoa sen thật
      const tipFlush = g.createRadialGradient(w * 0.5, h * 0.08, 12, w * 0.5, h * 0.16, w * 0.65);
      tipFlush.addColorStop(0.0, vibrant ? 'rgba(176, 36, 88, 0.42)' : 'rgba(202, 72, 118, 0.30)');
      tipFlush.addColorStop(0.55, 'rgba(218, 96, 138, 0.14)');
      tipFlush.addColorStop(1.0, 'rgba(255, 255, 255, 0)');
      g.fillStyle = tipFlush;
      g.fillRect(0, 0, w, h * 0.55);

      // 2. Hệ thống 24 đường gân mạch hồng cánh sen mảnh chạy dọc & chẻ nhẹ (tạo nếp gấp lụa mềm trên Normal Map)
      for (let k = -12; k <= 12; k++) {
        const frac = k / 12;
        const x0 = w * 0.5 + frac * (w * 0.24);
        const xm = w * 0.5 + frac * (w * 0.48);
        const x1 = w * 0.5 + frac * (w * 0.08);
        const isCenter = Math.abs(k) <= 1;

        // Gân màu hồng đậm hơn nền (giống mạch thực vật cánh sen thật!)
        const veinGrad = g.createLinearGradient(0, h, 0, 0);
        veinGrad.addColorStop(0.0,  'rgba(182, 168, 110, 0.18)');
        veinGrad.addColorStop(0.28, vibrant ? 'rgba(210, 92, 134, 0.24)' : 'rgba(222, 124, 158, 0.20)');
        veinGrad.addColorStop(0.75, vibrant ? 'rgba(188, 52, 102, 0.38)' : 'rgba(204, 82, 124, 0.30)');
        veinGrad.addColorStop(1.0,  'rgba(148, 28, 72, 0.42)');
        g.strokeStyle = veinGrad;
        g.lineWidth = isCenter ? 3.0 : (k % 2 === 0 ? 2.0 : 1.15);
        g.beginPath(); g.moveTo(x0, h); g.quadraticCurveTo(xm, h * 0.48, x1, 0); g.stroke();

        // Rãnh nếp gấp dọc trên height map tạo cảm giác lụa mịn tự nhiên khi ánh nắng rọi xiên
        hCtx.strokeStyle = k % 2 === 0 ? '#a8a8a8' : '#585858';
        hCtx.lineWidth = isCenter ? 5.5 : 3.2;
        hCtx.beginPath(); hCtx.moveTo(x0, h); hCtx.quadraticCurveTo(xm, h * 0.48, x1, 0); hCtx.stroke();
      }

      // Vi hạt tế bào nhung mịn trên cánh hoa (chống bóng nhựa khi zoom cận cảnh!)
      const pImg = g.getImageData(0, 0, w, h);
      const pd = pImg.data;
      for (let i = 0; i < pd.length; i += 4) {
        const n = (Math.random() - 0.5) * 9;
        pd[i]     = Math.max(0, Math.min(255, pd[i] + n));
        pd[i + 1] = Math.max(0, Math.min(255, pd[i + 1] + n * 0.92));
        pd[i + 2] = Math.max(0, Math.min(255, pd[i + 2] + n * 0.95));
      }
      g.putImageData(pImg, 0, 0);

      const map = new THREE.CanvasTexture(cv);
      map.encoding = THREE.sRGBEncoding;
      map.anisotropy = maxAniso;
      const normalMap = heightCanvasToNormalTexture(hv, 1.5, false);
      normalMap.anisotropy = maxAniso;
      return { map, normalMap };
    }

    // 2 sắc độ lá sen tự nhiên (lá trưởng thành xanh đậm phủ sáp + lá non xanh ô-liu ấm) - lì nhung không bóng nhựa
    const lotusPadMats = [0, 1].map((v) => {
      const { map, normalMap } = createLotusPadTextures(v);
      return new THREE.MeshStandardMaterial({
        map,
        normalMap,
        normalScale: new THREE.Vector2(0.85, 0.85),
        transparent: true,
        alphaTest: 0.15,
        roughness: 0.88,
        metalness: 0.0,
        envMapIntensity: 0.28,
        side: THREE.DoubleSide,
      });
    });
    const lotusPadMat = lotusPadMats[0];

    // Điêu khắc cánh hoa sen 3D hình lòng thuyền mềm mại (có gờ sống giữa, mép ôm cong & chóp nhọn khẽ vểnh)
    function createPetalGeometry() {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0);
      shape.bezierCurveTo(-0.30, 0.22, -0.30, 0.66, 0, 1.0);
      shape.bezierCurveTo(0.30, 0.66, 0.30, 0.22, 0, 0);
      const geo = new THREE.ShapeGeometry(shape, 18);
      const pos = geo.attributes.position;
      const uvs = [];
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i);
        const yf = y / 1.0;
        // Lòng cánh khum sâu mềm + sóng dọc nhẹ + đầu nhọn hơi cụp nhẹ tự nhiên
        const cup = -Math.sin(yf * Math.PI) * 0.17 - (x * x) * 1.15;
        const tipCurl = Math.pow(Math.max(0, yf - 0.72) / 0.28, 2) * 0.055;
        const midKeel = -Math.exp(-(x * x) * 48) * 0.022 * Math.sin(yf * Math.PI);
        pos.setZ(i, cup + tipCurl + midKeel);
        uvs.push((x + 0.30) / 0.60, yf);
      }
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();
      return geo;
    }

    const petalGeo = createPetalGeometry();
    const petalPairOuter = createLotusPetalTextures(true);
    const petalPairInner = createLotusPetalTextures(false);

    // Vật liệu cánh hoa sen satin-nhung lì kèm hiệu ứng xuyên sáng nắng (Subsurface Scattering) cực thật!
    function createRealisticPetalMaterial(pair, isOuter) {
      const mat = new THREE.MeshStandardMaterial({
        map: pair.map,
        normalMap: pair.normalMap,
        normalScale: new THREE.Vector2(0.75, 0.75),
        roughness: isOuter ? 0.70 : 0.64,
        metalness: 0.0,
        envMapIntensity: 0.34,
        side: THREE.DoubleSide,
      });
      mat.customProgramCacheKey = () => isOuter ? 'lotus-petal-sss-outer' : 'lotus-petal-sss-inner';
      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uPetalSunDir = waterUniforms.uSunDir;
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vPetalWPos;')
          .replace('#include <project_vertex>', '#include <project_vertex>\nvPetalWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', '#include <common>\nuniform vec3 uPetalSunDir;\nvarying vec3 vPetalWPos;')
          .replace('#include <tonemapping_fragment>', `
            // Hiệu ứng ánh nắng xuyên qua cánh hoa sen mỏng manh (Subsurface Translucency)
            vec3 pV = normalize(cameraPosition - vPetalWPos);
            float backLight = pow(clamp(dot(pV, -uPetalSunDir), 0.0, 1.0), 2.2) * 0.55 + 0.16;
            gl_FragColor.rgb += diffuseColor.rgb * vec3(1.0, 0.82, 0.86) * backLight * 0.38;
            #include <tonemapping_fragment>
          `);
      };
      return mat;
    }
    const petalMatOuter = createRealisticPetalMaterial(petalPairOuter, true);
    const petalMatInner = createRealisticPetalMaterial(petalPairInner, false);
    const podMat = new THREE.MeshStandardMaterial({ color: 0xb6b23e, roughness: 0.78, metalness: 0.0 });
    const seedDotMat = new THREE.MeshStandardMaterial({ color: 0x3b4d22, roughness: 0.85 });
    const sepalMat = new THREE.MeshStandardMaterial({ color: 0x4b6330, roughness: 0.84, metalness: 0.0, side: THREE.DoubleSide });
    const stamenMat = new THREE.MeshStandardMaterial({ color: 0xf4cf48, emissive: 0x422a00, emissiveIntensity: 0.18, roughness: 0.52 });
    const stemTexPair = createLotusStemTextures();
    const stemMat = new THREE.MeshStandardMaterial({
      map: stemTexPair.map,
      normalMap: stemTexPair.normalMap,
      normalScale: new THREE.Vector2(0.95, 0.95),
      roughness: 0.86,
      metalness: 0.0,
      envMapIntensity: 0.22,
    });
    const dewMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, roughness: 0.03, clearcoat: 1.0, reflectivity: 1.0 });

    function buildLotusBloom3D(isBud = false, scale = 1.0) {
      const flower = new THREE.Group();
      flower.scale.setScalar(scale);
      const animatedPetals = [];
      const animatedStamens = [];

      // Đài hoa xanh lục trầm (5 lá đài ôm đáy bông sen & búp sen như hoa sen thật)
      for (let s = 0; s < 5; s++) {
        const sp = new THREE.Mesh(petalGeo, sepalMat);
        const sh = new THREE.Group();
        sh.rotation.y = (s / 5) * Math.PI * 2 + 0.3;
        sp.rotation.x = isBud ? 0.48 : 1.38;
        sp.scale.set(0.68, 0.56, 0.68);
        sp.position.y = -0.025;
        sh.add(sp);
        flower.add(sh);
      }

      const layers = isBud ? [
        { count: 5, tilt: 0.36, sc: 0.92, mat: petalMatOuter, y: 0.0,  flex: 0.065 },
        { count: 5, tilt: 0.16, sc: 0.85, mat: petalMatInner, y: 0.04, flex: 0.032 },
      ] : [
        { count: 9, tilt: 1.22, sc: 1.15, mat: petalMatOuter, y: 0.0,  flex: 0.115 },
        { count: 8, tilt: 0.86, sc: 1.00, mat: petalMatOuter, y: 0.04, flex: 0.085 },
        { count: 7, tilt: 0.54, sc: 0.84, mat: petalMatInner, y: 0.08, flex: 0.055 },
        { count: 5, tilt: 0.28, sc: 0.62, mat: petalMatInner, y: 0.11, flex: 0.030 },
      ];

      layers.forEach((lv, li) => {
        for (let k = 0; k < lv.count; k++) {
          const p = new THREE.Mesh(petalGeo, lv.mat);
          const holder = new THREE.Group();
          const ang = (k / lv.count) * Math.PI * 2 + li * 0.42;
          holder.rotation.y = ang;
          p.rotation.x = lv.tilt;
          p.scale.setScalar(lv.sc);
          p.position.y = lv.y;
          p.castShadow = true;
          holder.add(p);
          flower.add(holder);
          animatedPetals.push({
            mesh: p,
            baseTilt: lv.tilt,
            flex: lv.flex,
            angle: ang,
            phase: ang * 1.3 + li * 1.15 + Math.random() * 0.6,
          });
        }
      });

      if (!isBud) {
        // Gương sen vàng-xanh tự nhiên có các mắt hạt sen nhỏ + vòng tua nhị hoa rung rinh
        const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.10, 0.18, 16), podMat);
        pod.position.y = 0.15;
        flower.add(pod);

        const holeGeo = new THREE.SphereGeometry(0.022, 7, 7);
        for (let h = 0; h < 7; h++) {
          const dot = new THREE.Mesh(holeGeo, seedDotMat);
          const ha = (h / 6) * Math.PI * 2;
          const hr = h === 0 ? 0 : 0.095;
          dot.position.set(Math.cos(ha) * hr, 0.238, Math.sin(ha) * hr);
          dot.scale.set(1, 0.45, 1);
          flower.add(dot);
        }

        // 28 tua nhị sen mảnh có cuống chỉ nhị + đầu bao phấn vàng kem thật (thay chấm tròn nổi lơ lửng)
        const filamentGeo = new THREE.CylinderGeometry(0.005, 0.006, 0.17, 5);
        const antherGeo = new THREE.SphereGeometry(0.019, 8, 8);
        const filamentMat = new THREE.MeshStandardMaterial({ color: 0xebd978, roughness: 0.68 });
        for (let k = 0; k < 28; k++) {
          const ang = (k / 28) * Math.PI * 2 + (k % 2) * 0.08;
          const ringR = 0.185 + (k % 2) * 0.036;
          const stalkGroup = new THREE.Group();
          const fil = new THREE.Mesh(filamentGeo, filamentMat);
          fil.position.y = 0.085;
          const anther = new THREE.Mesh(antherGeo, stamenMat);
          anther.scale.set(0.75, 1.45, 0.75);
          anther.position.y = 0.18;
          stalkGroup.add(fil, anther);
          const baseX = Math.cos(ang) * ringR;
          const baseY = 0.09;
          const baseZ = Math.sin(ang) * ringR;
          stalkGroup.position.set(baseX, baseY, baseZ);
          stalkGroup.rotation.z = -Math.cos(ang) * 0.26;
          stalkGroup.rotation.x =  Math.sin(ang) * 0.26;
          flower.add(stalkGroup);
          animatedStamens.push({ mesh: stalkGroup, baseX, baseY, baseZ, phase: ang * 2.0 });
        }
      }
      flower.userData.petals = animatedPetals;
      flower.userData.stamens = animatedStamens;
      return flower;
    }

    // Dựng thân cành sen đàn hồi thực sự (gốc neo dưới bùn đáy hồ, thân uốn cong theo gió & dòng nước)
    function createFlexibleStem(yBottom, yTop, topR, botR, curveX, curveZ) {
      const totalH = Math.max(0.4, yTop - yBottom);
      const geo = new THREE.CylinderGeometry(topR, botR, totalH, 8, 16, false);
      geo.translate(0, yBottom + totalH * 0.5, 0);
      const pos = geo.attributes.position;
      const uArr = new Float32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const vy = pos.getY(i);
        const u = THREE.MathUtils.clamp((vy - yBottom) / totalH, 0, 1);
        uArr[i] = u;
        // Dáng cành sen hơi cong chữ S mềm mại tự nhiên ngay cả khi lặng gió
        const bow = Math.sin(u * Math.PI);
        const tipLean = u * u * 0.45;
        pos.setX(i, pos.getX(i) + curveX * (bow * 0.65 + tipLean));
        pos.setZ(i, pos.getZ(i) + curveZ * (bow * 0.65 + tipLean));
      }
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, stemMat);
      mesh.castShadow = true;
      return {
        mesh,
        geo,
        basePos: new Float32Array(pos.array),
        uArr,
        totalH,
        yTop,
        restTipX: curveX * 0.45,
        restTipZ: curveZ * 0.45,
      };
    }

    // Cập nhật độ uốn cành sen theo mô hình dầm đàn hồi Euler-Bernoulli (gốc giữ chặt, ngọn cong mềm)
    function deformFlexibleStem(stemObj, tipX, tipZ, curX, curZ) {
      const pos = stemObj.geo.attributes.position;
      const base = stemObj.basePos;
      const uArr = stemObj.uArr;
      const shorten = (tipX * tipX + tipZ * tipZ) * 0.20;
      for (let i = 0; i < pos.count; i++) {
        const u = uArr[i];
        const b = u * u * (1.5 - 0.5 * u);
        const under = Math.sin(u * Math.PI) * (1.0 - u) * 0.32;
        pos.setXYZ(
          i,
          base[i * 3]     + tipX * b + curX * under,
          base[i * 3 + 1] - shorten * u * u,
          base[i * 3 + 2] + tipZ * b + curZ * under
        );
      }
      pos.needsUpdate = true;
      return {
        x: stemObj.restTipX + tipX,
        y: stemObj.yTop - shorten,
        z: stemObj.restTipZ + tipZ,
      };
    }

    const floatingLotuses = [];
    // Hàm tạo xung lực vật lý khi chuột/click/cá Koi chạm gần bụi sen -> lá rung, hoa gật mềm mại
    function nudgeLotusesAt(wx, wz, strength = 1.0) {
      for (const fl of floatingLotuses) {
        const dx = fl.x - wx;
        const dz = fl.z - wz;
        const dist = Math.hypot(dx, dz);
        if (dist < 4.2) {
          const falloff = Math.pow(1 - dist / 4.2, 2) * strength;
          const inv = 1 / (dist + 0.35);
          fl.velX += dx * inv * falloff * 0.72;
          fl.velZ += dz * inv * falloff * 0.72;
          fl.padVelY -= falloff * 0.24;
          fl.padVelRot += (Math.random() - 0.5) * falloff * 0.14;
        }
      }
    }

    function addLotus3D(x, z, padRadius, options = {}) {
      const { hasFlower = true, isBud = false, flowerScale = 1.0, stemLift = 0 } = options;
      const rootGroup = new THREE.Group();
      rootGroup.position.set(x, WATER_Y, z);

      // Lá sen nổi tách rời trên mặt nước (mép lá uốn mềm dẻo theo từng con sóng đi qua!)
      const padGroup = new THREE.Group();
      padGroup.position.y = 0.035;
      const padGeo = new THREE.PlaneGeometry(padRadius * 2, padRadius * 2, 10, 10);
      padGeo.rotateX(-Math.PI / 2);
      const pPos = padGeo.attributes.position;
      const padRadii = new Float32Array(pPos.count);
      const padAngles = new Float32Array(pPos.count);
      for (let i = 0; i < pPos.count; i++) {
        const px = pPos.getX(i), pz = pPos.getZ(i);
        const rNorm = Math.hypot(px, pz) / padRadius;
        const ang = Math.atan2(pz, px);
        padRadii[i] = rNorm;
        padAngles[i] = ang;
        // Lòng lá hơi lõm chén + mép lá lượn sóng tự nhiên
        pPos.setY(i, Math.pow(rNorm, 2) * 0.09 + Math.sin(ang * 5.0 + rNorm * 2.0) * 0.018 * Math.min(rNorm, 1.0));
      }
      padGeo.computeVertexNormals();
      const padBasePos = new Float32Array(pPos.array);

      const padRotY = Math.random() * Math.PI * 2;
      const pad = new THREE.Mesh(padGeo, lotusPadMats[floatingLotuses.length % lotusPadMats.length]);
      pad.rotation.y = padRotY;
      pad.castShadow = true;
      pad.receiveShadow = true;
      padGroup.add(pad);

      // 2 giọt sương pha lê lăn lấp lánh nhẹ trong lòng chén lá sen khi lá nghiêng theo sóng
      const dewDrops = [];
      for (let d = 0; d < 2; d++) {
        const drop = new THREE.Mesh(new THREE.SphereGeometry(0.052 + d * 0.02, 12, 10), dewMat);
        drop.scale.set(1.15, 0.56, 1.15);
        const da = Math.random() * Math.PI * 2;
        const dr = padRadius * (0.24 + d * 0.22);
        const bx = Math.cos(da) * dr, bz = Math.sin(da) * dr;
        const by = 0.048 + Math.pow(dr / padRadius, 2) * 0.085;
        drop.position.set(bx, by, bz);
        padGroup.add(drop);
        dewDrops.push({ mesh: drop, bx, by, bz, ox: 0, oz: 0, vx: 0, vz: 0 });
      }
      rootGroup.add(padGroup);

      // Cành sen đàn hồi vươn từ bùn đáy hồ + bông hoa sen có độ trễ quán tính riêng
      let stemObj = null;
      let flower = null;
      if (hasFlower) {
        const cBiasX = (Math.random() - 0.5) * 0.28;
        const cBiasZ = (Math.random() - 0.5) * 0.28;
        stemObj = createFlexibleStem(FLOOR_Y - WATER_Y - 0.05, stemLift + 0.05, 0.036, 0.048, cBiasX, cBiasZ);
        rootGroup.add(stemObj.mesh);

        flower = buildLotusBloom3D(isBud, flowerScale);
        flower.position.set(stemObj.restTipX, stemLift + 0.05, stemObj.restTipZ);
        rootGroup.add(flower);
      }

      scene.add(rootGroup);
      if (gpuLotusCount < MAX_LOTUS_RINGS) {
        gpuLotusPads[gpuLotusCount++].set(x, z, padRadius * 0.96);
      }
      const heightFactor = 0.65 + stemLift * 1.45;
      floatingLotuses.push({
        group: rootGroup,
        padGroup,
        padGeo,
        padBasePos,
        padRadii,
        padAngles,
        padRotY,
        padRadius,
        dewDrops,
        stemObj,
        flower,
        x, z,
        baseY: 0.035,
        phase: Math.random() * Math.PI * 2,
        isTall: false,
        isBud,
        // Tham số lò xo giảm chấn tự nhiên (cành cao mềm & dao động chậm hơn búp thấp)
        dispX: 0, dispZ: 0, velX: 0, velZ: 0,
        headLagX: 0, headLagZ: 0, headVelX: 0, headVelZ: 0,
        padOffY: 0, padVelY: 0, padRotOff: 0, padVelRot: 0,
        stiffness: isBud ? 9.5 / heightFactor : 7.2 / heightFactor,
        damping: 2.15,
        windArea: 0.34 * heightFactor,
      });
    }

    // Cụm lá sen vươn cao làm chiều sâu khung cảnh (thân uốn dẻo + tán lá phất phơ mềm theo từng đợt gió)
    function addTallLotusLeaf(x, z, liftH, radius) {
      const rootGroup = new THREE.Group();
      rootGroup.position.set(x, WATER_Y, z);

      const cBiasX = (Math.random() - 0.5) * 0.38;
      const cBiasZ = (Math.random() - 0.5) * 0.32;
      const stemObj = createFlexibleStem(FLOOR_Y - WATER_Y - 0.05, liftH, 0.038, 0.052, cBiasX, cBiasZ);
      rootGroup.add(stemObj.mesh);

      const leafHolder = new THREE.Group();
      leafHolder.position.set(stemObj.restTipX, liftH, stemObj.restTipZ);

      // Tán lá 10x10 uốn chén có mép lượn mềm để phấp phới tự nhiên trong gió
      const leafGeo = new THREE.PlaneGeometry(radius * 2, radius * 2, 10, 10);
      leafGeo.rotateX(-Math.PI / 2);
      const lPos = leafGeo.attributes.position;
      const leafRadii = new Float32Array(lPos.count);
      const leafAngles = new Float32Array(lPos.count);
      for (let i = 0; i < lPos.count; i++) {
        const px = lPos.getX(i), pz = lPos.getZ(i);
        const rNorm = Math.hypot(px, pz) / radius;
        const ang = Math.atan2(pz, px);
        leafRadii[i] = rNorm;
        leafAngles[i] = ang;
        lPos.setY(i, Math.pow(rNorm, 1.85) * 0.16 + Math.sin(ang * 6.0) * 0.045 * Math.min(rNorm * rNorm, 1.0));
      }
      leafGeo.computeVertexNormals();
      const leafBasePos = new Float32Array(lPos.array);

      const leaf = new THREE.Mesh(leafGeo, lotusPadMats[(floatingLotuses.length + 1) % lotusPadMats.length]);
      leaf.rotation.y = Math.random() * Math.PI * 2;
      leaf.castShadow = true;
      leafHolder.add(leaf);
      rootGroup.add(leafHolder);
      scene.add(rootGroup);

      floatingLotuses.push({
        group: rootGroup,
        stemObj,
        tallLeafHolder: leafHolder,
        tallLeafGeo: leafGeo,
        tallLeafBasePos: leafBasePos,
        tallLeafRadii: leafRadii,
        tallLeafAngles: leafAngles,
        baseTiltX: 0.22 + (Math.random() - 0.5) * 0.1,
        baseTiltZ: (Math.random() - 0.5) * 0.12,
        x, z,
        baseY: WATER_Y,
        phase: Math.random() * Math.PI * 2,
        isTall: true,
        dispX: 0, dispZ: 0, velX: 0, velZ: 0,
        headLagX: 0, headLagZ: 0, headVelX: 0, headVelZ: 0,
        padOffY: 0, padVelY: 0, padRotOff: 0, padVelRot: 0,
        stiffness: 4.4,
        damping: 1.75,
        windArea: 0.85,
      });
    }

    // Bố trí vườn hoa sen rực rỡ nhiều tầng cao thấp quanh rìa hồ
    addLotus3D(-6.4, -3.0, 1.55, { hasFlower: true, flowerScale: 1.22, stemLift: 0.42 });
    addLotus3D(-4.7, -4.4, 1.15, { hasFlower: true, isBud: true, flowerScale: 0.92, stemLift: 0.65 });
    addLotus3D(-5.7,  2.5, 1.35, { hasFlower: true, flowerScale: 1.05, stemLift: 0.18 });
    addLotus3D(-7.2,  0.4, 1.20, { hasFlower: false });
    addLotus3D( 0.6, -5.2, 1.48, { hasFlower: true, flowerScale: 1.15, stemLift: 0.35 });
    addLotus3D( 2.3, -4.2, 1.05, { hasFlower: true, isBud: true, flowerScale: 0.86, stemLift: 0.55 });
    addLotus3D( 5.6, -3.4, 1.35, { hasFlower: true, flowerScale: 1.02, stemLift: 0.25 });
    addLotus3D(-1.8,  3.8, 1.05, { hasFlower: true, isBud: true, flowerScale: 0.80, stemLift: 0.22 });
    addLotus3D(-3.3,  4.2, 0.92, { hasFlower: false });
    addTallLotusLeaf(-7.1, -1.8, 1.35, 1.15);
    addTallLotusLeaf( 1.4, -5.8, 1.45, 1.25);

    // 6.7 Chú chuồn chuồn 3D ánh ngọc bay lượn quanh búp sen
    const dragonfly = new THREE.Group();
    const dfBodyMat = new THREE.MeshPhysicalMaterial({ color: 0x16b8a6, metalness: 0.55, roughness: 0.18, clearcoat: 1.0 });
    const dfWingMat = new THREE.MeshPhysicalMaterial({ color: 0xe6fff8, transparent: true, opacity: 0.52, side: THREE.DoubleSide, roughness: 0.1 });
    const dfTail = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.024, 0.58, 8), dfBodyMat);
    dfTail.rotation.x = Math.PI / 2;
    dfTail.position.z = -0.28;
    const dfThorax = new THREE.Mesh(new THREE.SphereGeometry(0.052, 10, 10), dfBodyMat);
    const dfHead = new THREE.Mesh(new THREE.SphereGeometry(0.044, 10, 10), dfBodyMat);
    dfHead.position.z = 0.08;
    dragonfly.add(dfTail, dfThorax, dfHead);
    const dfWings = [];
    const wingGeo = new THREE.PlaneGeometry(0.46, 0.10);
    wingGeo.translate(0.23, 0, 0);
    for (const side of [-1, 1]) {
      for (const pair of [0, 1]) {
        const w = new THREE.Mesh(wingGeo, dfWingMat);
        w.position.set(0, 0.02, pair === 0 ? 0.01 : -0.07);
        w.rotation.x = -Math.PI / 2;
        if (side < 0) w.rotation.z = Math.PI;
        dragonfly.add(w);
        dfWings.push({ mesh: w, side, pair });
      }
    }
    dragonfly.scale.setScalar(1.15);
    scene.add(dragonfly);

    // 6.8 Cánh sen rơi, bọt khí & hạt nắng tiết chế tinh tế cho thoáng mắt
    const driftingPetals = [];
    for (let i = 0; i < 8; i++) {
      const m = new THREE.Mesh(petalGeo, i % 2 === 0 ? petalMatInner : petalMatOuter);
      m.scale.setScalar(0.18 + Math.random() * 0.12);
      m.position.set((Math.random() - 0.5) * 14, 1.9 + Math.random() * 4.4, (Math.random() - 0.5) * 8);
      m.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
      scene.add(m);
      driftingPetals.push({ mesh: m, speed: 0.006 + Math.random() * 0.006, phase: i * 0.9 });
    }

    const risingBubbles = [];
    const bubbleGeo = new THREE.SphereGeometry(0.042, 10, 10);
    const bubbleMat = new THREE.MeshPhysicalMaterial({
      color: 0xf4fcff, transparent: true, opacity: 0.45, roughness: 0.04, clearcoat: 1.0,
    });
    for (let i = 0; i < 10; i++) {
      const b = new THREE.Mesh(bubbleGeo, bubbleMat);
      const sc = 0.45 + Math.random() * 0.95;
      b.scale.setScalar(sc);
      b.position.set((Math.random() - 0.5) * 12, FLOOR_Y + Math.random() * (WATER_Y - FLOOR_Y), (Math.random() - 0.5) * 8);
      scene.add(b);
      risingBubbles.push({ mesh: b, speed: 0.009 + Math.random() * 0.011, phase: i * 0.7 });
    }

    const moteCount = 24;
    const motePos = new Float32Array(moteCount * 3);
    for (let i = 0; i < moteCount; i++) {
      motePos[i * 3]     = (Math.random() - 0.5) * 16;
      motePos[i * 3 + 1] = WATER_Y + 0.3 + Math.random() * 4.0;
      motePos[i * 3 + 2] = (Math.random() - 0.5) * 10;
    }
    const moteGeo = new THREE.BufferGeometry();
    moteGeo.setAttribute('position', new THREE.BufferAttribute(motePos, 3));
    const sunMotes = new THREE.Points(
      moteGeo,
      new THREE.PointsMaterial({ color: 0xfff8c4, size: 0.085, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    scene.add(sunMotes);

    // ------------------------------------------------------------------
    // 7. HỆ THỐNG SÓNG VÒNG VẬT LÝ TRỰC TIẾP TRONG SHADER MẶT NƯỚC (GPU)
    // ------------------------------------------------------------------
    let rippleWriteIdx = 0;
    let nextAmbientDropAt = 1.6;

    function spawnRipple3D(x, z, maxScale = 1.6, startOpacity = 0.65, isMouseHover = false) {
      let maxRadius, speed, freq, decay, strength;
      if (isMouseHover) {
        // Gợn sóng nhỏ tinh tế chỉ nhỉnh hơn con trỏ chuột một chút, tan nhanh & gọn
        maxRadius = 0.42;
        speed = 0.72;
        freq = 28.0;
        decay = 3.2;
        strength = 0.55;
      } else {
        maxRadius = THREE.MathUtils.clamp(maxScale * 0.48, 0.52, 1.55);
        speed = THREE.MathUtils.clamp(0.85 + maxRadius * 0.78, 1.0, 2.05);
        freq = THREE.MathUtils.clamp(24.0 - maxRadius * 6.5, 13.0, 22.0);
        decay = THREE.MathUtils.clamp(2.4 - maxRadius * 0.65, 1.15, 2.2);
        strength = THREE.MathUtils.clamp(maxScale * 0.24 + startOpacity * 0.65, 0.35, 1.35);
      }
      gpuRipples[rippleWriteIdx].set(x, z, simTime, strength);
      gpuRippleMeta[rippleWriteIdx].set(maxRadius, speed, freq, decay);
      rippleWriteIdx = (rippleWriteIdx + 1) % MAX_GPU_RIPPLES;
      nudgeLotusesAt(x, z, isMouseHover ? 0.18 : strength * 0.68);
    }

    // ------------------------------------------------------------------
    // 8. KHỞI TẠO ĐÀN CÁ KOI 3D — PHẠM VI BƠI RỘNG KHẮP HỒ (ĐÔI KHI BƠI KHUẤT MÀN HÌNH) + TRÁNH VA CHẠM 3D
    // ------------------------------------------------------------------
    // Lưu ý hình học quỹ đạo số 8 (sin t, sin 2t): lệch pha PI/2 & đồng tốc giúp 2 cá lớn luôn cách xa >= 8 đơn vị,
    // không bao giờ cắt mặt nhau, và ở các cung vòng ngoài cá sẽ lướt tự nhiên khuất khỏi mép màn hình rồi quay lại!
    const actors = [
      // 1. Cá Koi chúa (Taisho Sanke: Trắng-Đỏ-Đen) bơi tầng trên-giữa với cung số 8 rộng khắp hồ
      {
        koi: createKoi3D(0, 1.32),
        scale: 1.32,
        hero: true,
        t: -0.35,
        speed: 0.0038,
        cruiseSpeed: 2.35,
        swimPhase: 0,
        cx: -1.4, cy: 0.08, cz: -0.2,
        rx: 8.8,  ry: 0.44, rz: 5.5,
        fx: 1.0,  fy: 1.0,  fz: 2.0,
        driftX: 2.1, driftZ: 1.4, driftFreq: 0.37,
        yPhase: 0.4,
        curPos: new THREE.Vector3(),
        prevPos: new THREE.Vector3(),
        stemSide: {},
        prevYaw: 0,
        curYaw: 0,
        yawRate: 0,
        curPitch: 0,
        smoothTurn: 0,
        wasNearSurface: false,
      },
      // 2. Cá Koi Vàng Kim Hoàng Gia (Yamabuki Ogon 24K) lệch pha đúng PI/2, bơi vòng rộng giao hòa cùng cá chúa
      {
        koi: createKoi3D('gold', 1.15),
        scale: 1.15,
        hero: true,
        t: -0.35 + Math.PI * 0.5,
        speed: 0.0038,
        cruiseSpeed: 2.30,
        swimPhase: 2.1,
        cx: -1.4, cy: -0.82, cz: -0.2,
        rx: 8.8,  ry: 0.42,  rz: 5.5,
        fx: 1.0,  fy: 1.0,   fz: 2.0,
        driftX: 2.1, driftZ: 1.4, driftFreq: 0.37,
        yPhase: 2.6,
        curPos: new THREE.Vector3(),
        prevPos: new THREE.Vector3(),
        stemSide: {},
        prevYaw: 0,
        curYaw: 0,
        yawRate: 0,
        curPitch: 0,
        smoothTurn: 0,
        wasNearSurface: false,
      },
      // 3. Cá Showa Sanshoku (Đen mực - Đỏ son - Trắng) tuần du vòng rộng sâu ra ngoài mép trái/phải hồ
      {
        koi: createKoi3D(1, 0.76),
        scale: 0.76,
        hero: false,
        t: 3.55,
        speed: 0.0044,
        cruiseSpeed: 2.55,
        swimPhase: 1.7,
        cx: -0.6, cy: -1.62, cz: -2.2,
        rx: 10.6, ry: 0.32,  rz: 5.8,
        fx: 1.0,  fy: 1.2,   fz: 1.0,
        driftX: 1.8, driftZ: 1.6, driftFreq: 0.31,
        yPhase: 1.1,
        curPos: new THREE.Vector3(),
        prevPos: new THREE.Vector3(),
        stemSide: {},
        prevYaw: 0,
        curYaw: 0,
        yawRate: 0,
        curPitch: 0,
        smoothTurn: 0,
        wasNearSurface: false,
      },
      // 4. Cá Koi Tancho Sanke quý hiếm (Thân trắng tuyết + chấm đỏ tròn đỉnh đầu) dạo rộng tầng đáy
      {
        koi: createKoi3D('tancho', 0.58),
        scale: 0.58,
        hero: false,
        t: 5.6,
        speed: 0.0050,
        cruiseSpeed: 2.70,
        swimPhase: 3.4,
        cx: -2.0, cy: -2.18, cz: -0.6,
        rx: 9.6,  ry: 0.24,  rz: 6.0,
        fx: 1.0,  fy: 0.9,   fz: 1.5,
        driftX: 2.0, driftZ: 1.5, driftFreq: 0.29,
        yPhase: 0.2,
        curPos: new THREE.Vector3(),
        prevPos: new THREE.Vector3(),
        stemSide: {},
        prevYaw: 0,
        curYaw: 0,
        yawRate: 0,
        curPitch: 0,
        smoothTurn: 0,
        wasNearSurface: false,
      },
    ];

    function samplePath3D(a, timeVal, mouseOffset) {
      // Cộng thêm độ trôi tự nhiên tần số thấp để mỗi vòng bơi có góc lượn khác nhau, đôi khi lướt khuất khỏi khung hình
      const df = a.driftFreq || 0.35;
      const wx = Math.sin(timeVal * df) * (a.driftX || 0);
      const wz = Math.cos(timeVal * (df * 0.82)) * (a.driftZ || 0);
      const x = a.cx + Math.sin(timeVal * a.fx) * a.rx + wx + (a.hero ? mouseOffset.x * 0.75 : 0);
      const z = a.cz + Math.sin(timeVal * a.fz) * a.rz + wz + (a.hero ? mouseOffset.z * 0.50 : 0);
      const y = a.cy + Math.sin(timeVal * a.fy + (a.yPhase || 0.6)) * a.ry;
      return new THREE.Vector3(x, y, z);
    }

    // Khởi tạo vị trí & góc hướng ban đầu để frame đầu tiên mượt tuyệt đối, không giật
    actors.forEach((a) => {
      const pPrev = samplePath3D(a, a.t - 0.025, { x: 0, z: 0 });
      const pCur = samplePath3D(a, a.t, { x: 0, z: 0 });
      a.prevPos.copy(pPrev);
      a.curPos.copy(pCur);
      const v0 = pCur.clone().sub(pPrev);
      a.curYaw = Math.atan2(v0.x, v0.z);
      a.prevYaw = a.curYaw;
      a.curPitch = -Math.atan2(v0.y, Math.hypot(v0.x, v0.z) || 0.001);
    });

    // Tương tác chuột 3D: raycast xuống mặt nước tạo gợn sóng đúng điểm chuột đi qua
    const raycaster = new THREE.Raycaster();
    const mouseNDC = new THREE.Vector2(0, 0);
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_Y);
    const hitPoint = new THREE.Vector3();
    const mouseTarget = { x: 0, z: 0, sx: 0, sy: 0, lastHitX: 999, lastHitZ: 999, lastAt: 0 };

    window.addEventListener('mousemove', (e) => {
      const nx = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
      const ny = -(e.clientY / Math.max(1, window.innerHeight)) * 2 + 1;
      mouseNDC.set(nx, ny);
      mouseTarget.sx = nx;
      mouseTarget.sy = ny;

      raycaster.setFromCamera(mouseNDC, camera);
      if (raycaster.ray.intersectPlane(waterPlane, hitPoint)) {
        mouseTarget.x = THREE.MathUtils.clamp(hitPoint.x * 0.25, -1.5, 1.5);
        mouseTarget.z = THREE.MathUtils.clamp(hitPoint.z * 0.25, -1.2, 1.2);

        const now = performance.now();
        const dist = Math.hypot(hitPoint.x - mouseTarget.lastHitX, hitPoint.z - mouseTarget.lastHitZ);
        if (dist > 0.24 && now - mouseTarget.lastAt > 55 && Math.abs(hitPoint.x) < 15 && Math.abs(hitPoint.z) < 14) {
          mouseTarget.lastHitX = hitPoint.x;
