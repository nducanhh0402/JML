          mouseTarget.lastHitZ = hitPoint.z;
          mouseTarget.lastAt = now;
          spawnRipple3D(hitPoint.x, hitPoint.z, 0.42, 0.45, true);
        }
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target !== renderer.domElement && !e.target.classList.contains('page-layer')) return;
      const nx = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
      const ny = -(e.clientY / Math.max(1, window.innerHeight)) * 2 + 1;
      mouseNDC.set(nx, ny);
      raycaster.setFromCamera(mouseNDC, camera);
      if (raycaster.ray.intersectPlane(waterPlane, hitPoint)) {
        spawnRipple3D(hitPoint.x, hitPoint.z, 1.9, 0.72, false);
        setTimeout(() => spawnRipple3D(hitPoint.x, hitPoint.z, 1.25, 0.48, false), 140);
      }
    });

    window.addEventListener('resize', syncRendererResolution);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncRendererResolution);
    }

    // ------------------------------------------------------------------
    // 9. VÒNG LẶP ANIMATION 60FPS
    // ------------------------------------------------------------------
    const smoothMouse = { x: 0, z: 0, sx: 0, sy: 0 };
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      // Tự động cập nhật độ phân giải gốc WebGL ngay lập tức khi người dùng phóng to (Ctrl+ / pinch-zoom)
      const curVvScale = (window.visualViewport && window.visualViewport.scale) ? window.visualViewport.scale : 1;
      const curTargetDpr = Math.min((window.devicePixelRatio || 1) * curVvScale, 4);
      if (Math.abs(curTargetDpr - lastAppliedDpr) > 0.02) {
        syncRendererResolution();
      }
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();
      const speedMul = reducedMotion ? 0.25 : 1.0;

      smoothMouse.x += (mouseTarget.x - smoothMouse.x) * 0.04;
      smoothMouse.z += (mouseTarget.z - smoothMouse.z) * 0.04;
      smoothMouse.sx += (mouseTarget.sx - smoothMouse.sx) * 0.04;
      smoothMouse.sy += (mouseTarget.sy - smoothMouse.sy) * 0.04;

      // Camera di chuyển parallax rất nhẹ tạo chiều sâu 3D sống động
      const isDesktop = window.innerWidth >= 960;
      const baseCamX = isDesktop ? 1.15 : 0.0;
      camera.position.x = baseCamX + smoothMouse.sx * 0.45;
      camera.position.y = 2.45 + smoothMouse.sy * 0.28;
      camera.lookAt(isDesktop ? -0.8 : 0.0, -0.45, -0.4);

      // Cập nhật shader khúc xạ ánh sáng mặt nước (GLSL caustics) & tia nắng
      causticUniforms.uTime.value = elapsed;
      for (const bm of sunBeams) {
        bm.mesh.material.opacity = bm.baseOp * (0.78 + 0.28 * Math.sin(elapsed * 0.9 + bm.phase));
      }

      // Rong thủy sinh đung đưa mềm mại theo dòng nước
      for (const ab of aquaticBlades) {
        const p = ab.mesh.geometry.attributes.position;
        const b = ab.mesh.geometry.userData.basePos;
        for (let k = 0; k < p.count; k++) {
          const by = b[k * 3 + 1];
          const f = by / ab.h;
          const dx = Math.sin(elapsed * 1.45 + ab.phase - f * 2.2) * ab.sway * f * f;
          const dz = Math.cos(elapsed * 1.1 + ab.phase - f * 1.8) * ab.sway * 0.55 * f * f;
          p.setXYZ(k, b[k * 3] + dx, by, b[k * 3 + 2] + dz);
        }
        p.needsUpdate = true;
      }

      // Chú chuồn chuồn bay lượn quanh hoa sen tiền cảnh
      const dfAngle = elapsed * 0.65;
      const dfX = -5.1 + Math.sin(dfAngle) * 1.4;
      const dfZ =  1.6 + Math.cos(dfAngle * 1.4) * 1.2;
      const dfY = WATER_Y + 0.85 + Math.sin(elapsed * 2.4) * 0.22;
      const nextDfX = -5.1 + Math.sin(dfAngle + 0.05) * 1.4;
      const nextDfZ =  1.6 + Math.cos((dfAngle + 0.05) * 1.4) * 1.2;
      dragonfly.position.set(dfX, dfY, dfZ);
      dragonfly.rotation.y = Math.atan2(nextDfX - dfX, nextDfZ - dfZ);
      for (const w of dfWings) {
        const flap = Math.sin(elapsed * 38 + w.pair * 1.1) * 0.42;
        w.mesh.rotation.y = w.side * flap;
      }

      // Bọt khí nổi từ đáy hồ lên mặt nước
      for (const rb of risingBubbles) {
        rb.mesh.position.y += rb.speed * (dt * 60) * speedMul;
        rb.mesh.position.x += Math.sin(elapsed * 2.1 + rb.phase) * 0.004;
        if (rb.mesh.position.y >= WATER_Y) {
          rb.mesh.position.y = FLOOR_Y + 0.1;
          rb.mesh.position.x = (Math.random() - 0.5) * 14;
        }
      }

      // Hạt nắng phấn hoa bay lơ lửng nhẹ
      const mp = moteGeo.attributes.position;
      for (let i = 0; i < moteCount; i++) {
        let my = mp.getY(i) + Math.sin(elapsed * 0.7 + i) * 0.0025;
        let mx = mp.getX(i) + 0.003 * speedMul;
        if (mx > 8) mx = -8;
        mp.setXY(i, mx, my);
      }
      mp.needsUpdate = true;

      // Cập nhật shader mặt nước 3D (sóng Gerstner/Stokes, mao dẫn, vòng sóng GPU & nắng lấp lánh)
      simTime = elapsed;
      waterUniforms.uTime.value = elapsed;
      koiUnderwaterUniforms.uKoiTime.value = elapsed;

      // Thỉnh thoảng tạo 1 giọt nước / gợn sóng nhẹ tự nhiên trên mặt hồ cho mặt nước sống động liên tục
      if (!reducedMotion && elapsed >= nextAmbientDropAt) {
        nextAmbientDropAt = elapsed + 2.4 + Math.random() * 2.2;
        const rx = -5.5 + Math.random() * 9.5;
        const rz = -3.8 + Math.random() * 6.8;
        spawnRipple3D(rx, rz, 1.65, 0.58);
      }

      // Trường gió tự nhiên quét ngang mặt hồ (có đợt gió thoảng mạnh, khoảng lặng và xoáy nhẹ)
      const simDt = Math.min(dt, 0.033) * speedMul;
      for (const fl of floatingLotuses) {
        // 1. Tính lực gió tại đúng tọa độ (fl.x, fl.z) -> bụi sen bên trái đón gió trước bụi bên phải
        const gustWave = 0.5 + 0.5 * Math.sin(fl.x * 0.22 + fl.z * 0.14 - elapsed * 0.78);
        const gustBurst = Math.pow(gustWave, 2.2) * 1.35 + 0.35;
        const eddy = Math.sin(elapsed * 1.45 + fl.phase) * 0.42 + Math.cos(elapsed * 2.35 + fl.x * 0.4) * 0.22;
        const windX = (0.55 + eddy) * gustBurst;
        const windZ = (0.28 * Math.cos(elapsed * 0.65 + fl.z * 0.25) + Math.sin(elapsed * 1.85 + fl.phase) * 0.28) * gustBurst;
        const windMag = Math.hypot(windX, windZ);
        const windAng = Math.atan2(windZ, windX);

        // Dòng chảy ngầm êm dịu dưới mặt nước đẩy thân cành sen phần chìm
        const curX = Math.sin(elapsed * 0.85 + fl.phase) * 0.12;
        const curZ = Math.cos(elapsed * 0.70 + fl.phase * 1.2) * 0.10;

        // 2. Giải phương trình lò xo giảm chấn (Spring-Damper) cho độ uốn cành sen
        const ax = windX * fl.windArea - fl.stiffness * fl.dispX - fl.damping * fl.velX;
        const az = windZ * fl.windArea - fl.stiffness * fl.dispZ - fl.damping * fl.velZ;
        fl.velX += ax * simDt;
        fl.velZ += az * simDt;
        fl.dispX = THREE.MathUtils.clamp(fl.dispX + fl.velX * simDt, -0.52, 0.52);
        fl.dispZ = THREE.MathUtils.clamp(fl.dispZ + fl.velZ * simDt, -0.46, 0.46);

        // Quán tính trễ thứ cấp (secondary motion) của bông hoa / tán lá trên đỉnh cành
        const hAx = (fl.dispX - fl.headLagX) * 18.0 - fl.headVelX * 4.2 + Math.sin(elapsed * 2.7 + fl.phase) * 0.16 * gustBurst;
        const hAz = (fl.dispZ - fl.headLagZ) * 18.0 - fl.headVelZ * 4.2 + Math.cos(elapsed * 2.3 + fl.phase) * 0.14 * gustBurst;
        fl.headVelX += hAx * simDt;
        fl.headVelZ += hAz * simDt;
        fl.headLagX += fl.headVelX * simDt;
        fl.headLagZ += fl.headVelZ * simDt;

        if (fl.isTall) {
          // Cành lá sen vươn cao: uốn cong mềm từ đáy hồ + tán lá nghiêng trễ & mép lá phất phơ theo gió
          const tip = deformFlexibleStem(fl.stemObj, fl.dispX, fl.dispZ, curX, curZ);
          fl.tallLeafHolder.position.set(tip.x, tip.y, tip.z);
          fl.tallLeafHolder.rotation.z = fl.baseTiltZ - fl.dispX * 0.55 - (fl.headLagX - fl.dispX) * 0.95;
          fl.tallLeafHolder.rotation.x = fl.baseTiltX + fl.dispZ * 0.55 + (fl.headLagZ - fl.dispZ) * 0.95;
          fl.tallLeafHolder.rotation.y = Math.sin(elapsed * 0.8 + fl.phase) * 0.10;

          // Uốn mềm mép tán lá cao khi gió lướt qua
          const lp = fl.tallLeafGeo.attributes.position;
          const lb = fl.tallLeafBasePos;
          const lr = fl.tallLeafRadii;
          const la = fl.tallLeafAngles;
          const flutterAmp = 0.032 + windMag * 0.028;
          for (let k = 0; k < lp.count; k++) {
            const r2 = Math.min(lr[k] * lr[k], 1.15);
            const flWave = Math.sin(elapsed * 3.4 + la[k] * 2.0 + fl.phase) * flutterAmp * r2
                         + Math.cos(elapsed * 5.2 - la[k] * 3.0 + fl.phase) * (flutterAmp * 0.35) * r2;
            lp.setY(k, lb[k * 3 + 1] + flWave);
          }
          lp.needsUpdate = true;
        } else {
          // Lá sen nổi: nhún đàn hồi theo sóng + xung lực chạm + mép lá uốn mềm ôm mặt sóng
          const w0 = sampleMainWaveY(fl.x, fl.z, elapsed);
          const wx = sampleMainWaveY(fl.x + 0.42, fl.z, elapsed);
          const wz = sampleMainWaveY(fl.x, fl.z + 0.42, elapsed);

          // Dao động dọc & xoay nhẹ của lá nổi khi sóng hoặc cá Koi chạm qua
          const padAy = -22.0 * fl.padOffY - 4.6 * fl.padVelY;
          fl.padVelY += padAy * simDt;
          fl.padOffY += fl.padVelY * simDt;

          const padArot = -6.0 * fl.padRotOff - 2.4 * fl.padVelRot;
          fl.padVelRot += padArot * simDt;
          fl.padRotOff += fl.padVelRot * simDt;

          const tiltZ = -(wx - w0) * 0.92 - fl.dispX * 0.14;
          const tiltX =  (wz - w0) * 0.92 + fl.dispZ * 0.14;
          fl.padGroup.position.set(
            Math.sin(elapsed * 0.65 + fl.phase) * 0.045 + fl.dispX * 0.16,
            fl.baseY + w0 + fl.padOffY,
            Math.cos(elapsed * 0.58 + fl.phase) * 0.040 + fl.dispZ * 0.16
          );
          fl.padGroup.rotation.set(tiltX, fl.padRotOff + Math.sin(elapsed * 0.55 + fl.phase) * 0.055, tiltZ);

          // Uốn mềm viền lá sen nổi theo gợn sóng lướt qua mép lá
          const pp = fl.padGeo.attributes.position;
          const pb = fl.padBasePos;
          const pr = fl.padRadii;
          const pa = fl.padAngles;
          for (let k = 0; k < pp.count; k++) {
            const r = pr[k];
            if (r > 0.25) {
              const rimFlex = Math.pow(Math.min(r, 1.05), 2.1) * (
                Math.sin(elapsed * 2.25 + pa[k] * 2.0 + fl.phase) * 0.024 +
                Math.cos(elapsed * 3.6 - pa[k] * 3.0 + fl.x) * 0.012 * gustBurst
              );
              pp.setY(k, pb[k * 3 + 1] + rimFlex);
            }
          }
          pp.needsUpdate = true;

          // Giọt sương lăn nhẹ trong lòng lá theo độ nghiêng thực của lá sen
          for (const dd of fl.dewDrops) {
            dd.vx += (-tiltZ * 0.85 - dd.ox * 9.5 - dd.vx * 3.2) * simDt;
            dd.vz += ( tiltX * 0.85 - dd.oz * 9.5 - dd.vz * 3.2) * simDt;
            dd.ox = THREE.MathUtils.clamp(dd.ox + dd.vx * simDt, -0.12, 0.12);
            dd.oz = THREE.MathUtils.clamp(dd.oz + dd.vz * simDt, -0.12, 0.12);
            dd.mesh.position.set(dd.bx + dd.ox, dd.by + (dd.ox * dd.ox + dd.oz * dd.oz) * 0.35, dd.bz + dd.oz);
          }

          // Cành hoa & bông hoa sen uốn cong mềm, gật trễ nhịp và từng cánh hoa rung rinh thở theo gió
          if (fl.stemObj && fl.flower) {
            const tip = deformFlexibleStem(fl.stemObj, fl.dispX, fl.dispZ, curX, curZ);
            fl.flower.position.set(tip.x, tip.y, tip.z);
            const stemSlopeX = fl.dispX / fl.stemObj.totalH;
            const stemSlopeZ = fl.dispZ / fl.stemObj.totalH;
            fl.flower.rotation.z = -stemSlopeX * 1.15 - (fl.headLagX - fl.dispX) * 1.35;
            fl.flower.rotation.x =  stemSlopeZ * 1.15 + (fl.headLagZ - fl.dispZ) * 1.35;
            fl.flower.rotation.y = Math.sin(elapsed * 0.72 + fl.phase) * 0.09;

            // Từng cánh hoa sen rung rinh độc lập (nhịp thở mềm + rung lất phất khi gió thổi qua)
            const petals = fl.flower.userData.petals;
            if (petals) {
              const breathe = Math.sin(elapsed * 0.95 + fl.phase) * 0.032;
              for (let pi = 0; pi < petals.length; pi++) {
                const pt = petals[pi];
                const windAlign = Math.cos(pt.angle - windAng);
                const flutter = Math.sin(elapsed * 3.2 + pt.phase) * 0.55
                              + Math.sin(elapsed * 5.7 + pt.phase * 1.6) * 0.25;
                pt.mesh.rotation.x = pt.baseTilt
                  + breathe * (pt.flex * 10.0)
                  + pt.flex * (windAlign * windMag * 0.42 + flutter * (0.28 + windMag * 0.48));
              }
            }
            const stamens = fl.flower.userData.stamens;
            if (stamens && stamens.length) {
              const qAmp = 0.008 + windMag * 0.008;
              for (let si = 0; si < stamens.length; si++) {
                const st = stamens[si];
                st.mesh.position.x = st.baseX + Math.sin(elapsed * 4.8 + st.phase) * qAmp;
                st.mesh.position.z = st.baseZ + Math.cos(elapsed * 4.3 + st.phase) * qAmp;
              }
            }
          }
        }
      }

      // Cánh sen rơi nhẹ
      for (const dp of driftingPetals) {
        dp.mesh.position.y -= dp.speed * speedMul;
        dp.mesh.position.x += Math.sin(elapsed * 0.9 + dp.phase) * 0.008 * speedMul;
        dp.mesh.rotation.x += 0.01 * speedMul;
        dp.mesh.rotation.z += 0.014 * speedMul;
        if (dp.mesh.position.y <= WATER_Y + 0.05) {
          spawnRipple3D(dp.mesh.position.x, dp.mesh.position.z, 1.25, 0.48);
          dp.mesh.position.y = 5.4 + Math.random() * 1.5;
          dp.mesh.position.x = (Math.random() - 0.5) * 14;
        }
      }

      // Điều khiển đàn cá Koi 3D theo động lực học dòng chảy mượt (lướt đều tốc độ + đánh lái sớm né cành sen & né cá khác, KHÔNG khựng / KHÔNG giật!)
      const swimDt = Math.min(dt, 0.033) * speedMul;
      const desiredTargets = actors.map((a) => {
        a.t += a.speed * (dt * 60) * speedMul;
        return samplePath3D(a, a.t, smoothMouse);
      });

      // Tính trước tọa độ 3 điểm dọc thân mỗi con cá (Đầu, Giữa, Đuôi) phục vụ né cá mượt mà
      const spineProbes = actors.map((a) => {
        const fx = Math.sin(a.curYaw) * Math.cos(a.curPitch);
        const fy = -Math.sin(a.curPitch);
        const fz = Math.cos(a.curYaw) * Math.cos(a.curPitch);
        return [
          new THREE.Vector3(a.curPos.x + fx * 1.45 * a.scale, a.curPos.y + fy * 1.45 * a.scale, a.curPos.z + fz * 1.45 * a.scale),
          a.curPos.clone(),
          new THREE.Vector3(a.curPos.x - fx * 1.65 * a.scale, a.curPos.y - fy * 1.65 * a.scale, a.curPos.z - fz * 1.65 * a.scale),
        ];
      });

      actors.forEach((a, idx) => {
        const fx = Math.sin(a.curYaw);
        const fz = Math.cos(a.curYaw);
        const target = desiredTargets[idx];

        // 1. Vector hướng tới điểm dẫn đường (carrot) trên quỹ đạo rộng
        const toTx = target.x - a.curPos.x;
        const toTz = target.z - a.curPos.z;
        const distToT = Math.hypot(toTx, toTz) + 0.001;
        let desX = (toTx / distToT) * THREE.MathUtils.clamp(distToT / 2.2, 0.45, 1.15);
        let desZ = (toTz / distToT) * THREE.MathUtils.clamp(distToT / 2.2, 0.45, 1.15);
        let desY = target.y;
        let urgency = 0.0;

        // 2. Đánh lái sớm & mềm mại vòng qua từng thân cành hoa sen (có khóa hướng trái/phải hysteresis -> không bao giờ ngập ngừng hay khựng!)
        const noseX = a.curPos.x + fx * 0.85 * a.scale;
        const noseZ = a.curPos.z + fz * 0.85 * a.scale;
        const awareR = 3.2 + 1.45 * a.scale;
        const safeR  = 0.92 * a.scale + 0.58;

        for (let s = 0; s < floatingLotuses.length; s++) {
          const fl = floatingLotuses[s];
          if (!fl.stemObj) continue;

          const uStem = THREE.MathUtils.clamp((a.curPos.y - FLOOR_Y) / Math.max(0.5, WATER_Y - FLOOR_Y), 0, 1);
          const bend = uStem * uStem * (1.5 - 0.5 * uStem);
          const sx = fl.x + fl.stemObj.restTipX * bend + fl.dispX * bend;
          const sz = fl.z + fl.stemObj.restTipZ * bend + fl.dispZ * bend;

          const dx = noseX - sx;
          const dz = noseZ - sz;
          const d = Math.hypot(dx, dz) + 0.001;

          if (d < awareR) {
            // Khóa hướng rẽ trái hay phải ngay khi vừa vào vùng nhận biết để cá lượn 1 đường cong liền mạch
            if (!a.stemSide[s]) {
              const cross = (a.curPos.x - sx) * fz - (a.curPos.z - sz) * fx;
              a.stemSide[s] = cross >= 0 ? 1 : -1;
            }
            const side = a.stemSide[s];
            const rx = dx / d;
            const rz = dz / d;
            // Chỉ kích hoạt mạnh khi thân sen đang nằm phía trước hoặc sát bên hông (bỏ qua nếu đã lướt qua sau đuôi)
            const aheadDot = ((sx - a.curPos.x) * fx + (sz - a.curPos.z) * fz) / (Math.hypot(sx - a.curPos.x, sz - a.curPos.z) + 0.001);
            const frontWeight = THREE.MathUtils.smoothstep(aheadDot, -0.55, 0.25);

            // Hệ số làm mềm bậc 3 (smoothstep) tăng êm từ 0 ở rìa awareR lên 1 sát safeR
            const u = THREE.MathUtils.clamp((awareR - d) / (awareR - safeR), 0, 1.35);
            const smoothU = u <= 1 ? (u * u * (3 - 2 * u)) : (1 + (u - 1) * 2.2);
            const w = smoothU * (0.35 + 0.65 * frontWeight);

            // Tiếp tuyến vòng tròn quanh thân sen giúp cá lướt vòng vèo mượt mà không giảm tốc
            const tangX = -rz * side;
            const tangZ =  rx * side;
            const pushWeight = THREE.MathUtils.clamp((safeR + 0.65 - d) / 0.85, 0.15, 1.35);
            desX += (tangX * 1.65 + rx * (0.95 + pushWeight * 1.45)) * w * 2.2;
            desZ += (tangZ * 1.65 + rz * (0.95 + pushWeight * 1.45)) * w * 2.2;
            if (w > urgency) urgency = w;
          } else if (d > awareR + 0.9) {
            delete a.stemSide[s];
          }
        }

        // 3. Lượn né mềm mại giữa các con cá Koi với nhau (kết hợp tách hướng ngang + đổi độ sâu nhẹ)
        for (let j = 0; j < actors.length; j++) {
          if (j === idx) continue;
          const b = actors[j];
          const fishAware = (a.scale + b.scale) * 1.65 + 1.35;
          const fishSafe  = (a.scale + b.scale) * 0.95 + 0.55;
          let minD = Infinity, bDx = 0, bDy = 0, bDz = 0;
          for (let p = 0; p < 3; p++) {
            for (let q = 0; q < 3; q++) {
              const dx = spineProbes[idx][p].x - spineProbes[j][q].x;
              const dy = spineProbes[idx][p].y - spineProbes[j][q].y;
              const dz = spineProbes[idx][p].z - spineProbes[j][q].z;
              const d = Math.hypot(dx, dy * 1.2, dz);
              if (d < minD) { minD = d; bDx = dx; bDy = dy; bDz = dz; }
            }
          }
          if (minD < fishAware) {
            const inv = 1 / (minD + 0.001);
            const u = THREE.MathUtils.clamp((fishAware - minD) / (fishAware - fishSafe), 0, 1.4);
            const w = u <= 1 ? (u * u * (3 - 2 * u)) : (1 + (u - 1) * 1.8);
            const weightShare = b.scale / (a.scale + b.scale);
            desX += bDx * inv * w * 2.6 * weightShare;
            desZ += bDz * inv * w * 2.6 * weightShare;
            const prefDirY = Math.abs(bDy) < 0.12 ? (a.cy >= b.cy ? 1 : -1) : Math.sign(bDy);
            desY += prefDirY * w * 0.75 * weightShare;
            if (w * 0.85 > urgency) urgency = w * 0.85;
          }
        }

        // 4. Giữ độ sâu êm ái phía trên nền sỏi/đá lớn và phía dưới mặt nước/tán lá sen nổi
        let minY = floorHeightAt(a.curPos.x, a.curPos.z) + 0.55 * a.scale;
        for (let b = 0; b < pebbleLayout.length; b++) {
          const [px, pz, pr, ph] = pebbleLayout[b];
          if (Math.hypot(a.curPos.x - px, a.curPos.z - pz) < pr + 0.9 * a.scale) {
            const rockTop = floorHeightAt(px, pz) + ph * 0.85 + 0.55 * a.scale;
            if (rockTop > minY) minY = rockTop;
          }
        }
        let maxY = WATER_Y - 0.52 * a.scale;
        for (let s = 0; s < floatingLotuses.length; s++) {
          const fl = floatingLotuses[s];
          if (!fl.isTall && Math.hypot(a.curPos.x - fl.x, a.curPos.z - fl.z) < (fl.padRadius || 1.2) + 0.75 * a.scale) {
            maxY = Math.min(maxY, WATER_Y - 0.82 * a.scale);
          }
        }
        desY = THREE.MathUtils.clamp(desY, minY, maxY);

        // 5. Tích phân góc lái bậc 2 (C1-smooth yawRate) -> rẽ cung tròn mượt như lụa, KHÔNG bao giờ giật hay khựng!
        const targetYaw = (desX * desX + desZ * desZ) > 0.0001 ? Math.atan2(desX, desZ) : a.curYaw;
        let angDiff = targetYaw - a.curYaw;
        while (angDiff > Math.PI) angDiff -= Math.PI * 2;
        while (angDiff < -Math.PI) angDiff += Math.PI * 2;

        const maxTurnRate = 1.65 + THREE.MathUtils.clamp(urgency, 0, 1.2) * 1.15;
        const desiredYawRate = THREE.MathUtils.clamp(angDiff * 2.5, -maxTurnRate, maxTurnRate);
        const yawBlend = 1 - Math.exp(-7.5 * swimDt);
        a.yawRate += (desiredYawRate - a.yawRate) * yawBlend;
        a.curYaw += a.yawRate * swimDt;

        // 6. Cá LUÔN lướt thẳng tiến về phía trước với tốc độ đều đặn tự nhiên (không phanh khựng, không đẩy ngang đột ngột!)
        a.prevPos.copy(a.curPos);
        const dyStep = (desY - a.curPos.y) * (1 - Math.exp(-2.6 * swimDt));
        const speedBoost = 1.0 + THREE.MathUtils.clamp((distToT - 4.5) * 0.04, -0.06, 0.16);
        const horizStep = a.cruiseSpeed * speedBoost * swimDt;

        a.curPos.x += Math.sin(a.curYaw) * horizStep;
        a.curPos.z += Math.cos(a.curYaw) * horizStep;
        a.curPos.y = THREE.MathUtils.clamp(a.curPos.y + dyStep, minY, maxY);
        const pos = a.curPos;

        const actualDy = pos.y - a.prevPos.y;
        const targetPitch = THREE.MathUtils.clamp(-Math.atan2(actualDy, Math.max(0.001, horizStep)), -0.32, 0.32);
        a.curPitch += (targetPitch - a.curPitch) * (1 - Math.exp(-6.0 * swimDt));

        // Độ uốn thân & nghiêng cua lấy trực tiếp từ vận tốc góc mượt a.yawRate
        const targetTurn = THREE.MathUtils.clamp(a.yawRate * 0.42, -1.0, 1.0);
        a.smoothTurn += (targetTurn - a.smoothTurn) * (1 - Math.exp(-7.0 * swimDt));
        a.prevYaw = a.curYaw;

        a.koi.group.position.copy(pos);
        a.koi.group.rotation.order = 'YXZ';
        a.koi.group.rotation.y = a.curYaw;
        a.koi.group.rotation.x = a.curPitch;
        a.koi.group.rotation.z = -a.smoothTurn * 0.30; // Nghiêng thân 3D mượt mà đúng độ cua!

        // Nhịp quẫy sóng sin tỷ lệ mượt với tốc độ bơi đều + tăng nhẹ khi đang lượn cua mạnh
        const speedMag = Math.hypot(horizStep, actualDy);
        a.swimPhase += (0.088 + speedMag * 0.48 + Math.abs(a.smoothTurn) * 0.03) * (dt * 60) * speedMul;
        updateKoiDeformation(a.koi, a.swimPhase, a.smoothTurn, elapsed * 2.75 + idx * 1.65);

        // Truyền vị trí cá vào shader mặt nước tạo vệt sóng rẽ nước sống động khi cá bơi gần mặt hồ
        const depthBelow = WATER_Y - pos.y;
        const wakeStrength = THREE.MathUtils.clamp(1.0 - (depthBelow - 0.55) / 1.45, 0.0, 1.0) * (a.hero ? 1.0 : 0.55);
        if (idx < gpuKoiWakes.length) {
          gpuKoiWakes[idx].set(pos.x, pos.z, wakeStrength, a.curYaw);
        }
        // Khi cá bơi gần bụi sen sẽ đẩy nhẹ nước làm lá sen & cành hoa đung đưa tự nhiên
        if (wakeStrength > 0.25) {
          nudgeLotusesAt(pos.x, pos.z, wakeStrength * dt * 2.2);
        }

        // Khi cá trồi lên sát mặt nước -> tạo sóng vòng đồng tâm lan tỏa thật trên shader mặt nước
        const nearSurface = pos.y > (WATER_Y - 1.25);
        if (nearSurface && (!a.wasNearSurface || elapsed - (a.lastWakeAt || 0) > 0.72)) {
          a.lastWakeAt = elapsed;
          spawnRipple3D(pos.x, pos.z, a.hero ? 2.4 : 1.4, a.hero ? 0.68 : 0.44);
        }
        a.wasNearSurface = nearSurface;
      });

      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>

  <!-- ========================================================================
       LOGIC ĐĂNG NHẬP / ĐĂNG KÝ (JWT)
       ======================================================================== -->
  <script>
  (function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const BASE = window.API_BASE_URL || 'http://127.0.0.1:8000';

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = 'shared-toast';
      el.style.borderLeft = `4px solid var(--${type === 'error' ? 'danger' : 'success'})`;
      el.textContent = msg;
      $('toastContainer').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    function showAlert(id, type, msg) {
      const el = $(id);
      el.className = `alert show ${type}`;
      el.textContent = msg;
    }
    function hideAlert(id) { $(id).className = 'alert'; }

    function setErr(inputId, msg) {
      const input = $(inputId);
      const err = $(inputId + '-err');
      if (msg) { input.classList.add('invalid'); err.textContent = msg; }
      else { input.classList.remove('invalid'); err.textContent = ''; }
      return !msg;
    }

    function getTargetUrl(role) {
      const r = String(role || '').toLowerCase();
      const redirectParam = new URLSearchParams(window.location.search).get('redirect');
      if (redirectParam === 'admin' && r === 'admin') return '../admin/index.html';
      if (redirectParam === 'seller' && (r === 'seller' || r === 'admin')) return '../seller/index.html';
      if (redirectParam === 'profile') return '../user/profile.html';
      if (r === 'admin') return '../admin/index.html';
      if (r === 'seller') return '../seller/index.html';
      return '../buyer/index.html';
    }

    function roleLabel(role) {
      const r = String(role || '').toLowerCase();
      if (r === 'admin') return 'Quản trị viên';
      if (r === 'seller') return 'Người bán';
      return 'Khách hàng';
    }

    function extractApiError(data, fallback) {
      if (!data) return fallback;
      if (typeof data.detail === 'string') return data.detail;
      if (Array.isArray(data.detail) && data.detail.length) {
        return data.detail.map((e) => String(e.msg || '').replace(/^Value error,\s*/i, '')).join(' ');
      }
      return fallback;
    }

    async function postAuth(path, body) {
      let res;
      try {
        res = await fetch(`${BASE}${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch {
        throw new Error('Không kết nối được máy chủ API (cổng 8000). Vui lòng kiểm tra backend đã bật chưa.');
      }
      const data = await res.json().catch(() => null);
      if (!res.ok) throw new Error(extractApiError(data, `Yêu cầu thất bại (HTTP ${res.status})`));
      return data;
    }

    function checkUrlAuthParams() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      const msg = params.get('message');
      if (err === 'unauthorized') {
        showAlert('auth-guard-alert', 'warning', 'Vui lòng đăng nhập để tiếp tục truy cập trang này.');
      } else if (err === 'forbidden') {
        showAlert('auth-guard-alert', 'error', 'Tài khoản của bạn không có quyền truy cập trang quản trị.');
      } else if (msg === 'logged_out') {
        showAlert('auth-guard-alert', 'success', 'Bạn đã đăng xuất thành công.');
      }
    }

    function renderActiveSession() {
      const bar = $('active-session-bar');
      if (!window.Auth || !Auth.isAuthenticated()) {
        bar.classList.remove('show');
        return;
      }
      const user = Auth.getUser();
      $('session-user-name').textContent = user.full_name || user.username;
      $('session-user-role').textContent = roleLabel(user.role);
      const btn = $('modal-role-redirect-btn');
      const target = getTargetUrl(user.role);
      btn.textContent = user.role === 'admin' ? 'Vào trang Quản trị →'
        : user.role === 'seller' ? 'Vào Kênh Người bán →' : 'Vào trang Mua sắm →';
      btn.onclick = () => { window.location.href = target; };
      bar.classList.add('show');
    }

    function switchTab(tab) {
      hideAlert('form-alert');
      const isLogin = tab === 'login';
      $('tab-login').classList.toggle('active', isLogin);
      $('tab-register').classList.toggle('active', !isLogin);
      $('form-login').classList.toggle('hidden', !isLogin);
      $('form-register').classList.toggle('hidden', isLogin);
    }

    async function onLogin(e) {
      e.preventDefault();
      hideAlert('form-alert');
      const username = $('login-username').value.trim();
      const password = $('login-password').value;
      const ok = setErr('login-username', username ? '' : 'Vui lòng nhập tên đăng nhập, email hoặc SĐT.')
               & setErr('login-password', password ? '' : 'Vui lòng nhập mật khẩu.');
      if (!ok) return;

      const btn = $('login-submit-btn');
      btn.disabled = true; btn.textContent = 'Đang đăng nhập...';
      try {
        const data = await postAuth('/api/auth/login', { username, password });
        Auth.setSession(data.user, data.access_token);
        toast('Đăng nhập thành công! Đang chuyển trang...');
        setTimeout(() => { window.location.href = getTargetUrl(data.user.role); }, 350);
      } catch (err) {
        showAlert('form-alert', 'error', err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Đăng nhập';
      }
    }

    async function onRegister(e) {
      e.preventDefault();
      hideAlert('form-alert');
      const full_name = $('reg-fullname').value.trim();
      const username = $('reg-username').value.trim();
      const phone = $('reg-phone').value.trim();
      const email = $('reg-email').value.trim();
      const password = $('reg-password').value;
      const confirm = $('reg-confirm').value;
      const role = document.querySelector('input[name="reg-role"]:checked')?.value || 'customer';

      const ok =
        setErr('reg-fullname', full_name ? '' : 'Vui lòng nhập họ và tên.') &
        setErr('reg-username', !username ? 'Vui lòng nhập tên đăng nhập.' :
          (username.length < 3 || /\s/.test(username) ? 'Tối thiểu 3 ký tự và không chứa khoảng trắng.' : '')) &
        setErr('reg-phone', phone.length >= 8 ? '' : 'Số điện thoại tối thiểu 8 ký tự.') &
        setErr('reg-email', !email || EMAIL_RE.test(email) ? '' : 'Email không đúng định dạng.') &
        setErr('reg-password', password.length >= 6 ? '' : 'Mật khẩu tối thiểu 6 ký tự.') &
        setErr('reg-confirm', confirm === password ? '' : 'Mật khẩu nhập lại không khớp.');
      if (!ok) return;

      const btn = $('reg-submit-btn');
      btn.disabled = true; btn.textContent = 'Đang tạo tài khoản...';
      try {
        const data = await postAuth('/api/auth/register', { username, password, role, full_name, phone, email });
        const user = data.user || { username, role, full_name, phone, email };
        Auth.setSession(user, data.access_token);
        toast('Đăng ký thành công! Đang chuyển trang...');
        setTimeout(() => { window.location.href = getTargetUrl(user.role); }, 350);
      } catch (err) {
        showAlert('form-alert', 'error', err.message);
      } finally {
        btn.disabled = false; btn.textContent = 'Tạo tài khoản';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkUrlAuthParams();
      renderActiveSession();

      $('tab-login').addEventListener('click', () => switchTab('login'));
      $('tab-register').addEventListener('click', () => switchTab('register'));
      $('form-login').addEventListener('submit', onLogin);
      $('form-register').addEventListener('submit', onRegister);

      $('session-logout-btn').addEventListener('click', () => {
        Auth.logout(false);
        renderActiveSession();
        showAlert('auth-guard-alert', 'success', 'Đã đăng xuất.');
      });

      document.querySelectorAll('.toggle-pw').forEach((btn) => {
        btn.addEventListener('click', () => {
          const input = $(btn.dataset.target);
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.textContent = show ? 'Ẩn' : 'Hiện';
        });
      });

      document.querySelectorAll('[data-demo]').forEach((btn) => {
        btn.addEventListener('click', () => {
          switchTab('login');
          $('login-username').value = btn.dataset.demo;
          $('login-password').value = '123456';
          setErr('login-username', '');
          setErr('login-password', '');
          hideAlert('form-alert');
        });
      });

      document.querySelectorAll('input').forEach((inp) => {
        inp.addEventListener('input', () => {
          if ($(inp.id + '-err')) setErr(inp.id, '');
        });
      });
    });
  })();
  </script>
</body>
